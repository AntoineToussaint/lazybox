[workspace]
resolver = "2"

members = [
    "crates/core",
    "crates/auth",
    "crates/entitlement",
    "crates/identity",
    "crates/store",
    "crates/config",
    "crates/sandbox",
    "crates/git-ops",
    "crates/gh-provider",
    "crates/slack-provider",
    "crates/tui-term",
    "crates/ipc",
    "crates/e2e-channel",
    "crates/relay",
    "crates/server",
    "crates/agents",
    "crates/linear-provider",
    "crates/jira-provider",
    "crates/tui-core",
    "crates/tui",
    "crates/tui-boot",
    # Vendored from https://github.com/Uzaaft/libghostty-rs (commit
    # f27655a). Includes lazybox's local Zig-version + xcframework
    # patches that haven't shipped upstream yet. Vendored so a fresh
    # clone of lazybox builds standalone — no sibling-clone dance.
    "crates/libghostty-vt",
    "crates/libghostty-vt-sys",
]
exclude = ["apps/desktop/src-tauri"]

# Lazybox's own crates opt into this lint config via `[lints]
# workspace = true` in their Cargo.toml. The two vendored libghostty
# crates do not, so `cargo clippy --workspace` only fails on issues
# in lazybox code — upstream noise stays upstream.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]

# Config for 'dist'
[workspace.metadata.dist]
# The release workflow publishes the curated changelog because cargo-dist's
# Homebrew hint cannot express Homebrew 6's required tap-and-trust sequence.
allow-dirty = ["ci"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Global artifacts jobs to run in CI
global-artifacts-jobs = ["./smoke-release-artifacts"]
# A GitHub repo to push Homebrew formulas to
tap = "AntoineToussaint/homebrew-lazybox"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Extra runner setup steps. libghostty-vt's build.rs invokes
# `zig build` during compilation — every CI runner needs Zig 0.16.0+
# on PATH. cargo-dist surfaces these to the generated workflow.
github-build-setup = "../release-setup.yml"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Override dist's default runners: it picks macos-13 (Intel, scarce) for the
# Apple-Silicon build and the retired ubuntu-20.04 for Linux. `global` sets the
# runner for the orchestration jobs (plan/host/publish/announce).
[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-14"
# Build Intel macOS on the Apple-Silicon runner (cross-compile) — macos-13
# Intel runners are scarce and stall the release.
x86_64-apple-darwin = "macos-14"
x86_64-unknown-linux-gnu = "ubuntu-22.04"

[workspace.package]
version = "0.1.15"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/AntoineToussaint/lazybox"
homepage = "https://lazybox.ai"
readme = "README.md"
# Lazybox ships as a single binary built by cargo-dist (see
# `[workspace.metadata.dist]`); the individual workspace crates are
# internal and not published to crates.io. Marking them
# `publish = false` keeps an accidental `cargo publish` from
# uploading them and lets cargo-deny treat the path-based wildcards
# between sibling crates as "private", not real wildcard pins.
publish = false

[workspace.dependencies]
# ── Shared library crates ──────────────────────────────────────────────
lazybox-core        = { path = "crates/core" }
lazybox-auth        = { path = "crates/auth" }
lazybox-e2e-channel = { path = "crates/e2e-channel" }
lazybox-entitlement = { path = "crates/entitlement" }
lazybox-identity    = { path = "crates/identity" }
lazybox-store       = { path = "crates/store" }
lazybox-config      = { path = "crates/config" }
lazybox-sandbox     = { path = "crates/sandbox" }
lazybox-git-ops     = { path = "crates/git-ops" }
lazybox-gh          = { path = "crates/gh-provider" }
lazybox-linear      = { path = "crates/linear-provider" }
lazybox-jira        = { path = "crates/jira-provider" }
lazybox-slack       = { path = "crates/slack-provider" }
lazybox-tui-term    = { path = "crates/tui-term" }
lazybox-tui-core    = { path = "crates/tui-core" }

# ── Daemon-side crates ─────────────────────────────────────────────────
lazybox-ipc       = { path = "crates/ipc" }
lazybox-relay     = { path = "crates/relay" }
lazybox-agents    = { path = "crates/agents" }

# ── Third-party ────────────────────────────────────────────────────────
# MCP coordination server (#1420). Only the streamable-HTTP server transport
# is enabled; client/auth/elicitation stay off to keep the transitive tree
# (axum/tower/schemars) minimal. Identity rides the gateway's own per-session
# bearer, read from the request Parts — hence the `http` type dependency.
rmcp               = { version = "3.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
http               = "1"
tokio              = { version = "1", features = ["full"] }
futures            = "0.3"
fs2                = "0.4"
serde              = { version = "1", features = ["derive", "rc"] }
serde_json         = "1"
serde_yaml         = "0.9"
semver             = "1"
# 3.0.0 is a compile-error-only placeholder; 2.0.1 is the final usable
# bincode release. The IPC layer uses its legacy wire config. Its unmaintained
# advisory and replacement constraint are documented in deny.toml.
bincode            = { version = "2.0.1", features = ["serde"] }
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-appender   = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs              = { version = "12", features = ["chrono-impl", "uuid-impl"] }
crossterm          = { version = "0.29", features = ["event-stream"] }
# Raw `sigaction` / `tcsetattr` / `write` for the fatal-signal terminal
# restore. crossterm can't serve that path: its teardown locks stdout and
# allocates, neither of which is legal inside a signal handler.
libc               = "0.2"
ratatui            = "0.30"
tuirealm           = "4.1"
tui-markdown       = "0.3"
unicode-segmentation = "1"
# Markdown parser (CommonMark + GFM tables/strikethrough/tasklists),
# scoped to the description-reader modal's renderer. Parser-only — no
# ratatui coupling, so it stays compatible with the workspace's ratatui
# pin. default-features off drops the unused HTML-writer + CLI.
pulldown-cmark     = { version = "0.13", default-features = false }
chrono             = { version = "0.4", features = ["serde"] }
portable-pty       = "0.9"
# 0.40's libsqlite3 build script requires Rust 1.91; 0.39 is the
# newest release that preserves the workspace's Rust 1.88 floor.
rusqlite           = { version = "0.40", features = ["bundled"] }
parking_lot        = "0.12"
octocrab           = { version = "0.54", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-aws-lc-rs",
    "jwt-aws-lc-rs",
    "timeout",
    "tracing",
] }

# Vendored libghostty-rs — see `crates/libghostty-vt` and
# `crates/libghostty-vt-sys`. Both build a Zig-compiled C library
# under the hood (`make setup` prepares Ghostty's pinned source and Zig
# packages in a host-level cache before the first offline compile).
libghostty-vt     = { path = "crates/libghostty-vt" }
libghostty-vt-sys = { path = "crates/libghostty-vt-sys" }

# Strip local optimized binaries as well as published artifacts. Debug builds
# retain symbols for profiling and crash diagnosis.
[profile.release]
strip = "symbols"

# The release profile cargo-dist (`dist`) builds with: `cargo build --profile
# dist`. cargo-dist requires this to exist (normally added by `dist init`);
# without it the build fails with "profile `dist` is not defined". Mirrors the
# profile cargo-dist generates by default.
[profile.dist]
inherits = "release"
lto = "thin"
