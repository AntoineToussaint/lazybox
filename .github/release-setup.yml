# Snippet inlined into every job of the cargo-dist-generated release
# workflow. Installs the prerequisites lazybox's build needs that
# Rust's toolchain doesn't provide:
#
# - Zig 0.16.0: libghostty-vt's `build.rs` invokes `zig build` to
#   compile the embedded ghostty source. Pinned to the exact version in
#   `.zig-version` because ghostty's build.zig enforces a `requireZig`
#   check that accepts only that minor — a newer or older Zig fails at
#   comptime, so bump this in lockstep with `.zig-version`.
# - SQLite headers: `rusqlite { features = ["bundled"] }` ships its
#   own SQLite source, but the `cc` crate still needs a working C
#   toolchain. macOS has CLT; Linux runners install build-essential.
#
# Once libghostty-rs is published with relaxed Zig pinning, the Zig
# install step is the only platform-specific bit here.

- name: Install Zig 0.16.0
  uses: mlugg/setup-zig@v2
  with:
    version: "0.16.0"

- name: Install C toolchain (Linux)
  if: runner.os == 'Linux'
  # libc++ + libc++abi: the Zig-built ghostty static archive references
  # `std::__1::*` symbols (libc++, LLVM's stdlib) from simdutf /
  # highway / std::optional — NOT libstdc++ (`std::__cxx11::*`).
  # libc++abi carries the typeinfo + RTTI globals (e.g.
  # `typeinfo for std::bad_optional_access`). Without both, the
  # final link fails with ~30 unresolved C++ stdlib symbols.
  #
  # The LLVM unwinder's STATIC archive must also be present, or the final
  # link resolves libc++abi's `_Unwind_*` against libunwind.so.1 and ships a
  # binary that needs a library no stock Ubuntu has (see build.rs). The LLVM
  # major differs per runner image — 14 on ubuntu-22.04 — so derive it from
  # whatever libc++abi-dev actually resolved to rather than pinning a number
  # that a runner bump would silently invalidate. The final `test` fails the
  # job loudly if the archive is still absent, instead of letting a broken
  # artifact reach a release.
  run: |
    sudo apt-get update
    sudo apt-get install -y build-essential pkg-config libc++-dev libc++abi-dev
    llvm_major=$(dpkg-query -W -f='${Package}\n' 'libc++abi-*-dev' 2>/dev/null \
      | sed -n 's/^libc++abi-\([0-9][0-9]*\)-dev$/\1/p' | head -1)
    if [ -n "$llvm_major" ]; then
      sudo apt-get install -y "libunwind-$llvm_major-dev"
    else
      echo "could not determine the libc++abi LLVM major; falling back" >&2
      sudo apt-get install -y libunwind-14-dev
    fi
    test -e /usr/lib/x86_64-linux-gnu/libunwind.a \
      || { echo "libunwind.a missing — the release binary would need libunwind.so.1 at runtime" >&2; exit 1; }

- name: Install C toolchain (macOS)
  if: runner.os == 'macOS'
  run: |
    # Xcode CLT ships a working clang + sqlite headers. CI runners
    # already have it; this is belt-and-suspenders for forks.
    xcode-select --install 2>/dev/null || true
