name: Feature request
description: Suggest an improvement or new capability for lazybox.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describing the problem you're hitting — not just the
        feature you have in mind — helps us find the right solution. For setup
        help or usage questions, choose the Question / setup help form instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and where does lazybox get in the way today?
      placeholder: When I have ten workspaces open I can't tell at a glance which ones have failing CI.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like lazybox to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing features you tried.
    validations:
      required: false
