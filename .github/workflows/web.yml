# Builds the Astro marketing homepage (web/) and publishes it to GitHub
# Pages on push to main. Scoped to web/** so it never runs on Rust-only
# changes, and the Rust CI never runs on homepage-only changes.
#
# NOTE: this and the docs.yml workflow both deploy to GitHub Pages, but a
# repo can only have ONE Pages site. To serve BOTH the homepage and the
# docs from this single repo you must either:
#   (a) move the homepage to its own repo (recommended — apex domain), or
#   (b) merge both builds into one artifact (homepage at /, docs at /docs).
# As written, whichever of web.yml / docs.yml ran most recently wins. Pick
# one before enabling Pages. See web/README.md.
#
# Deploying requires Pages enabled once: repo Settings → Pages → Source:
# "GitHub Actions".

name: web

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
