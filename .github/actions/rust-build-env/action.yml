# Sets up the toolchain lazybox needs to compile its workspace: Zig
# (for the vendored libghostty-vt-sys build.rs), libc++ on Linux (so
# the Zig-built static archive links), and the Rust stable
# toolchain + sccache-style Cargo cache.
#
# Zig is installed by running `scripts/bootstrap.sh` — the SAME script
# contributors run via `make setup`. So CI exercises the real
# download/extract/verify path (which has bitten users before) instead
# of a parallel `setup-zig` install that only agreed by convention, and
# the pinned version stays single-sourced in `.zig-version`. The script
# appends the pinned zig dir to $GITHUB_PATH for the build/test steps.
#
# Used by every CI job that invokes `cargo build`/`test`/`clippy`/
# `doc`. Jobs that don't compile workspace code (`deny`, `typos`,
# `machete`, `fmt`) skip this and just install what they need.

name: rust-build-env
description: Install Zig, C toolchain, Rust stable, and Cargo cache.

inputs:
  rust-toolchain:
    description: Rust toolchain to install (stable or the workspace MSRV, 1.88.0).
    required: false
    default: stable
  rust-components:
    description: Extra rustup components, comma-separated (e.g. "clippy" or "rustfmt").
    required: false
    default: ""
  cache-workspaces:
    description: >-
      Newline-separated Cargo workspaces to cache (Swatinem/rust-cache
      `workspaces` syntax). Defaults to the root workspace; the desktop job adds
      `apps/desktop/src-tauri`, which the root workspace `exclude`s and would
      otherwise recompile uncached every run.
    required: false
    default: "."
  shared-key:
    description: >-
      Swatinem/rust-cache `shared-key`. Jobs that pass the SAME value share one
      cache entry instead of each minting a per-job cache keyed on its job id.
      The parallel Linux root-workspace gates (test/clippy/rustdoc/benches) set
      a common key so they save ONE ~0.6GB cache — not four — keeping the split
      within the 10GB LRU pool and letting all four restore the same warm
      dependency build. Leave empty to keep the per-job-id default (desktop's
      Darwin workspace, the merge-queue-only macOS/MSRV lanes).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install C toolchain (Linux)
      if: runner.os == 'Linux'
      # The Zig-built ghostty static archive vendors simdutf /
      # highway / std::optional from libc++ (LLVM's C++ stdlib,
      # symbols namespaced `std::__1::`), NOT libstdc++ (GNU's,
      # `std::__cxx11::`). Linking with -lstdc++ leaves every libc++
      # symbol unresolved (`std::__1::basic_string`, `typeinfo for
      # std::bad_optional_access`, `hwy::Abort`, …). Install libc++
      # + libc++abi so the build script can link them. bootstrap.sh
      # only warns about these (it can't sudo across arbitrary distros);
      # CI must provision them, so this runs before bootstrap.sh.
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libc++-dev libc++abi-dev

    - name: Cache pinned Zig
      # bootstrap.sh downloads zig into this host-level cache. Restoring
      # it across runs avoids re-fetching ~45MB per job; on a hit
      # bootstrap.sh sees the binary and skips straight to PATH export.
      # Keyed on `.zig-version` so a version bump invalidates the cache.
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/lazybox/zig
          ~/.cache/lazybox/ghostty
        key: lazybox-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.zig-version', '.ghostty-version') }}

    - name: Install pinned Zig (scripts/bootstrap.sh)
      shell: bash
      run: ./scripts/bootstrap.sh

    - name: Install Rust stable
      if: inputs.rust-toolchain == 'stable'
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}

    - name: Install Rust 1.88.0 (workspace MSRV)
      if: inputs.rust-toolchain == '1.88.0'
      uses: dtolnay/rust-toolchain@1.88.0
      with:
        components: ${{ inputs.rust-components }}

    # `save-if` restricts cache *saves* to `main`. GitHub's per-repo cache is a
    # 10GB LRU pool; if every PR branch saved its own multi-GB target cache they
    # would evict the shared `main` cache that PR first-builds restore from.
    # Restores are unaffected — PRs still read the `main` cache on every run.
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.cache-workspaces }}
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
