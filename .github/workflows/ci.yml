# Build + test every PR, merge-queue composition, and main push. Catches
# regressions before they hit main when the repository requires this workflow
# through a merge queue; the main-push run is the recovery alarm, not the
# first integration check.
#
# Test breadth cannot compensate for a stale PR base: two independently-green
# PRs may still fail when composed. Keep `merge_group` enabled here and require
# CI on the repository's merge queue (or require branches be up to date) so
# GitHub tests the exact candidate tree before advancing main.
#
# Jobs that compile workspace code share `.github/actions/rust-build-env`
# (Zig + C toolchain + Rust stable + cache) so the install step
# doesn't drift across jobs.

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

jobs:
  msrv:
    name: msrv (Rust 1.88.0)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
        with:
          rust-toolchain: 1.88.0
      - run: cargo check --workspace --all-targets

  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env

      - name: Build
        run: cargo build --workspace --all-targets

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test with per-test timeout enforcement
        run: cargo nextest run --workspace --profile ci

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
        with:
          rust-components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  web:
    name: web (types, build, Lighthouse budgets)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Audit deployable web dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - name: Type-check and build site
        working-directory: web
        run: |
          npm run check
          npm run build
      - name: Enforce Lighthouse and transfer-size budgets
        working-directory: web
        run: npm run lighthouse

  rustdoc:
    # Broken intra-doc links / bad rustdoc references fail CI. Linux
    # only — rustdoc behavior doesn't differ across the matrix and
    # matrixing would just double the build time of a slow job.
    name: rustdoc
    runs-on: ubuntu-22.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
      - run: cargo doc --no-deps --workspace

  deny:
    # cargo-deny gates on RustSec advisories, banned/duplicated deps,
    # license policy, and source allowlists. Config lives in
    # `deny.toml` at the repo root. No Rust toolchain or build of the
    # workspace needed — cargo-deny only reads Cargo.lock.
    name: deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  typos:
    name: typos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Pinned to a tagged release rather than `@master` so CI is
      # reproducible across re-runs and a silent upstream change
      # can't flip behavior. Bump when typos.dev cuts a new release.
      - uses: crate-ci/typos@v1.48.0

  machete:
    # Dependency hygiene is a real gate: a stale direct dependency expands
    # compile time, advisory surface, and the set of contracts maintainers
    # falsely believe a crate owns.
    name: machete
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Pinned to a tagged release rather than `@main` so CI is
      # reproducible. Bump when bnjbvr/cargo-machete cuts a new release.
      - uses: bnjbvr/cargo-machete@v0.9.2
