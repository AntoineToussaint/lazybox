syntax = "proto3";
package lazybox.bench.v1;

option go_package = "github.com/AntoineToussaint/lazybox/services/runner/code/pkg/gen;gen";

service RunnerService {
  rpc ListSnippets(InfoRequest) returns (SnippetCatalog);
  rpc GetRepositoryCatalog(GetRepositoryCatalogRequest) returns (RepositoryCatalog);
  rpc PrepareWorkspace(PrepareWorkspaceRequest) returns (stream WorkspacePreparation);
  // A repository's branches for New task's "Start from" choice, its default
  // branch and the branch it last started from (WORKSPACES.md, "Start from").
  rpc ListRepositoryBranches(ListRepositoryBranchesRequest) returns (RepositoryBranches);
  // The owner's only. Replaces Lazybox's copy of a GitHub repository whose
  // history changed on GitHub since Lazybox copied it (a force-push with a
  // new root, or a new repository that took its name) with a fresh copy of
  // what GitHub has now. Without confirm it only says what that changes.
  // Workspaces made from the old copy keep their worktrees on it.
  rpc RefreshRepositoryIdentity(RefreshRepositoryIdentityRequest) returns (RepositoryIdentityRefresh);
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc GetRunnerSettings(InfoRequest) returns (RunnerSettings);
  rpc SaveRunnerSettings(RunnerSettings) returns (RunnerSettings);
  rpc SetModelPrice(SetModelPriceRequest) returns (RunnerSettings);
  // Owner only. How Claude agents authenticate (CLAUDE_COMPLIANCE.md): whether
  // an Anthropic API key is saved (never the key itself) and which cloud
  // provider the Runner's environment selects.
  rpc GetClaudeAuth(InfoRequest) returns (ClaudeAuth);
  // Owner only. Saves or forgets the Anthropic API key the claude-default
  // account's agents run with.
  rpc SetClaudeApiKey(SetClaudeApiKeyRequest) returns (ClaudeAuth);
  // Owner only. The user's themes folder for Settings → Appearance: each .json
  // or .toml file parsed to JSON, read on every call so edits apply without a
  // restart. The client validates each document against its token catalogue.
  rpc ListThemes(ListThemesRequest) returns (ThemeFolder);
  // Owner only. Creates a theme file in that folder; never replaces an
  // existing one.
  rpc CreateTheme(CreateThemeRequest) returns (CreateThemeResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
  // Owner only. Which agent providers this Runner can run and on which saved
  // subscriptions: each provider's program (found, where, which version) and
  // each subscription's state. Ask Lazybox picks its agent from it; the
  // welcome shows it. Programs are probed once and again on refresh;
  // subscription states are read on every call.
  rpc GetProviderAvailability(ProviderAvailabilityRequest) returns (ProviderAvailability);
  // Owner only. Adds or changes an ACP agent the person runs (a custom one,
  // or a built-in one's command), and answers with the availability report,
  // probed again. Environment values stay on the Runner (ACP.md).
  rpc SaveAcpAgent(SaveAcpAgentRequest) returns (ProviderAvailability);
  // Owner only. Removes a custom ACP agent, or restores a built-in one's
  // command. Running conversations keep their agent.
  rpc RemoveAcpAgent(RemoveAcpAgentRequest) returns (ProviderAvailability);
  rpc GetTelemetry(TelemetryRequest) returns (TelemetryReport);
  rpc RenameCollection(RenameCollectionRequest) returns (CollectionResponse);
  rpc AddSubscription(AddSubscriptionRequest) returns (SubscriptionEnrollment);
  rpc GetSubscriptionEnrollment(SubscriptionEnrollmentRequest) returns (SubscriptionEnrollment);
  rpc CancelSubscriptionEnrollment(SubscriptionEnrollmentRequest) returns (SubscriptionEnrollment);
  rpc RenameSubscription(RenameSubscriptionRequest) returns (Profile);
  rpc RefreshSubscription(RefreshSubscriptionRequest) returns (Profile);
  // Owner only. Forgets a subscription saved in Lazybox: its registry entry and
  // its private folder (an imported token among them). Refused while a running
  // conversation uses it. The person's own CLI sign-ins are never touched.
  rpc RemoveSubscription(RemoveSubscriptionRequest) returns (InfoResponse);
  rpc GetGitHubConnection(GetGitHubConnectionRequest) returns (GitHubConnection);
  rpc ConfigureGitHubApp(ConfigureGitHubAppRequest) returns (GitHubConnection);
  rpc ConnectGitHubPersonalToken(ConnectGitHubPersonalTokenRequest) returns (GitHubConnection);
  rpc ListRepositoryDiscovery(ListRepositoryDiscoveryRequest) returns (RepositoryDiscovery);
  rpc ScanRepositoryRoot(ScanRepositoryRootRequest) returns (RepositoryDiscovery);
  rpc BeginGitHubSignIn(BeginGitHubSignInRequest) returns (GitHubSignIn);
  rpc GetGitHubSignIn(GitHubSignInRequest) returns (GitHubSignIn);
  rpc CancelGitHubSignIn(GitHubSignInRequest) returns (GitHubSignIn);
  rpc DisconnectGitHub(GetGitHubConnectionRequest) returns (GitHubConnection);
  rpc ListGitHubInstallations(ListGitHubInstallationsRequest) returns (ListGitHubInstallationsResponse);
  rpc ListGitHubRepositories(ListGitHubRepositoriesRequest) returns (ListGitHubRepositoriesResponse);
  rpc ImportGitHubRepository(ImportGitHubRepositoryRequest) returns (ImportGitHubRepositoryResponse);
  rpc ListGitHubItems(ListGitHubItemsRequest) returns (ListGitHubItemsResponse);
  rpc ListMailbox(ListMailboxRequest) returns (ListMailboxResponse);
  rpc ListReleaseWatch(ListReleaseWatchRequest) returns (ListReleaseWatchResponse);
  rpc WisprStatus(WisprStatusRequest) returns (WisprStatusResponse);
  rpc TranscribeWispr(TranscribeWisprRequest) returns (TranscribeWisprResponse);
  // Work items (PROJECTS_AND_INTEGRATIONS.md): search a provider for the
  // picker, read one item with the context an agent is given, turn a pasted
  // link into its reference, and find the workspaces started from one.
  rpc SearchItems(SearchItemsRequest) returns (ItemPage);
  rpc GetItem(ItemRequest) returns (ItemDetail);
  rpc ResolveItemUrl(ResolveItemUrlRequest) returns (ItemRef);
  rpc FindItemWorkspaces(ItemRequest) returns (ItemWorkspaces);
  rpc AddLocalRepository(AddLocalRepositoryRequest) returns (AddLocalRepositoryResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc RemoveRepository(RemoveRepositoryRequest) returns (RepositoryDiscovery);
  // Home checkouts (WORKSPACES.md, "Home checkouts"): the person's own,
  // non-worktree clone of a repository, for logins, long-lived dev servers
  // and trying a module by hand. Owner only. Lazybox never deletes one, and
  // no workspace operation touches it.
  rpc ListRepositoryHomes(ListRepositoryHomesRequest) returns (RepositoryHomes);
  // Creates (clones), adopts (an existing checkout) or forgets a home; forgetting changes no file.
  rpc SetRepositoryHome(SetRepositoryHomeRequest) returns (RepositoryHome);
  // Opens a repository's home in Finder or an editor on the Runner's computer.
  rpc OpenRepositoryHome(OpenRepositoryHomeRequest) returns (OpenRepositoryHomeResponse);
  // Fetches the home's origin, then fast-forwards its default branch to the
  // remote's only when it is checked out and has no changes; otherwise says
  // why. Never discards, resets or switches anything.
  rpc UpdateRepositoryHome(UpdateRepositoryHomeRequest) returns (RepositoryHomeUpdate);
  rpc CreateCollection(CreateCollectionRequest) returns (CollectionResponse);
  rpc AddCollectionRepositories(AddCollectionRepositoriesRequest) returns (CollectionResponse);
  rpc RemoveCollectionRepository(RemoveCollectionRepositoryRequest) returns (CollectionResponse);
  rpc GetCollection(CollectionRequest) returns (CollectionResponse);
  // The workspaces in the person's order (ArrangeWorkspaces).
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  // Puts the workspaces in the person's order: the one ListCollections
  // answers in, so every window and a paired phone list them alike, across
  // restarts. The owner's only. Answers the list in its new order.
  rpc ArrangeWorkspaces(ArrangeWorkspacesRequest) returns (ListCollectionsResponse);
  // Keeps the sidebar conversation order on this workspace.
  rpc ArrangeConversations(ArrangeConversationsRequest) returns (CollectionResponse);
  rpc ArchiveCollection(CollectionRequest) returns (CollectionResponse);
  rpc ReconcileCollection(ReconcileCollectionRequest) returns (CollectionResponse);
  // The owner's only. What a previous Runner left unconfirmed in a workspace
  // or a conversation (RESOURCE_OWNERSHIP.md, "Unconfirmed ownership"): each
  // recorded agent and command, its PID and command line, and whether a
  // process with that identity still runs, checked by the Runner. What it
  // proves gone it settles there and then.
  rpc GetOwnership(OwnershipRequest) returns (Ownership);
  // The owner's only. Settles it: stop exactly the recorded processes that
  // still run (checked by identity, never a PID given to another program
  // since), or record the person's word that they stopped.
  rpc ResolveOwnership(ResolveOwnershipRequest) returns (Ownership);
  rpc OpenSession(OpenSessionRequest) returns (SessionResponse);
  rpc OpenAssistant(OpenAssistantRequest) returns (SessionResponse);
  rpc RenameConversation(RenameConversationRequest) returns (SessionResponse);
  // Pin or unpin a conversation (any of its attempts' IDs). The owner's only.
  rpc PinConversation(PinConversationRequest) returns (SessionResponse);
  // Archive a conversation, or bring it back. Nothing is stopped or deleted:
  // its agent keeps any turn in progress, and History still lists it.
  rpc ArchiveConversation(ArchiveConversationRequest) returns (SessionResponse);
  rpc ListWorkspaceChanges(WorkspaceChangesRequest) returns (WorkspaceChanges);
  rpc ReadWorkspaceDiff(WorkspaceDiffRequest) returns (WorkspaceDiff);
  rpc ReadWorkspaceFile(WorkspaceFileRequest) returns (WorkspaceFile);
  rpc SaveWorkspaceFile(SaveWorkspaceFileRequest) returns (WorkspaceFile);
  rpc SearchWorkspaceFiles(SearchWorkspaceFilesRequest) returns (WorkspaceFileSearch);
  rpc ResolveWorkspacePath(ResolveWorkspacePathRequest) returns (WorkspacePathResolution);
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);
  rpc ResumeSession(ResumeSessionRequest) returns (SessionResponse);
  // Continues the conversation in a new agent started with another permission
  // mode, for an agent whose running worker cannot change mode live.
  rpc RestartWithPermission(RestartWithPermissionRequest) returns (SessionResponse);
  // Owner only. Continues the conversation in a new agent started with another
  // model, for an agent whose running worker cannot switch model live: it is
  // ended between turns and the same provider conversation resumes.
  rpc RestartWithModel(RestartWithModelRequest) returns (SessionResponse);
  // Owner only. "Give Claude the browser" (BROWSER.md): turns the agent
  // browser back on for the conversation's workspace if the person turned it
  // off there, and, for an agent started without the browser tools, ends it
  // between turns and resumes the same provider conversation in a new agent
  // that has them. Returns the session the conversation continues in.
  rpc GiveBrowser(GiveBrowserRequest) returns (SessionResponse);
  // Owner only. Moves a live conversation to another signed-in subscription of
  // its provider and continues the same conversation: the same execution,
  // workspace, commands and queued messages, with a portable checkpoint for the
  // new account. The current subscription retries in place (after a reset).
  rpc SwitchSubscription(SwitchSubscriptionRequest) returns (SessionResponse);
  // Owner only. Turns automatic switching at a subscription limit on or off
  // for a conversation that already runs, or for every running one.
  rpc SetSessionRotation(SetSessionRotationRequest) returns (SessionResponse);
  rpc GetSession(SessionRequest) returns (SessionResponse);
  rpc Apply(ApplyRequest) returns (Receipt);
  // The bytes of an image or a text file a sent message carried, so the
  // conversation can show it: only a file the Runner retained as a message
  // attachment (the path an operation_accepted record lists), only an image
  // type a browser displays (PNG, JPEG, GIF, WebP) or text (valid UTF-8, no
  // NUL; always served as text/plain), at most 20 MiB. The owner, and a
  // paired phone reading conversations (REMOTE.md); never an agent.
  rpc ReadAttachment(ReadAttachmentRequest) returns (AttachmentContent);
  rpc CloseSession(SessionRequest) returns (SessionResponse);
  rpc StopSessionResources(SessionRequest) returns (SessionResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  rpc ScheduleDeletion(ScheduleDeletionRequest) returns (PendingDeletion);
  rpc ListPendingDeletions(ListPendingDeletionsRequest) returns (ListPendingDeletionsResponse);
  rpc UndoDeletion(UndoDeletionRequest) returns (ListPendingDeletionsResponse);
  rpc PreviewWorkspaceDeletion(CollectionRequest) returns (WorkspaceDeletionPreview);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (CollectionResponse);
  rpc ContinueSession(ContinueSessionRequest) returns (SessionResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream JournalEvent);
  // The latest turns of a conversation in one response, or an earlier page:
  // a window shows the latest at once and reads the rest in a few pages
  // instead of a record-per-message replay. Turn starts come from an index the
  // Runner keeps as journals open and grow, so no journal is parsed to find
  // them.
  rpc ReadSessionTail(ReadSessionTailRequest) returns (ReadSessionTailResponse);
  rpc StartCommand(StartCommandRequest) returns (CommandStatus);
  rpc RegisterPipe(RegisterPipeRequest) returns (CommandStatus);
  rpc Publish(PublishRequest) returns (CommandStatus);
  rpc FinishPipe(FinishPipeRequest) returns (CommandStatus);
  // Pins a published spec.v2 revision to the caller's conversation, so its
  // `lazybox run --check` and `--needs` runs record delivery observations.
  // Binding another revision starts a new attempt (delivery.Store.Bind).
  rpc BindDelivery(BindDeliveryRequest) returns (DeliveryBinding);
  // The delivery outcome of a conversation, or of a Mission task: the same
  // projection (delivery.Project) through either lookup.
  rpc GetDeliveryOutcome(GetDeliveryOutcomeRequest) returns (DeliveryOutcome);
  // Publishes the outcome as an immutable verdict snapshot: a report
  // artifact (schema delivery-outcome.v1), or the next version of one.
  rpc PublishDeliveryOutcome(PublishDeliveryOutcomeRequest) returns (Artifact);
  // A contract-bound reviewer's verdict on one criterion
  // (`lazybox delivery review <criterion> passed|failed`).
  rpc RecordReviewCriterion(RecordReviewCriterionRequest) returns (RecordReviewCriterionResponse);
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  // Takes a terminal run shared with a conversation (`lazybox log --to`) for
  // one composer: true for the first caller only, so the run is added once.
  rpc ClaimCommandShare(CommandRequest) returns (ClaimCommandShareResponse);
  rpc ReadCommand(ReadCommandRequest) returns (ReadCommandResponse);
  rpc WaitCommand(CommandRequest) returns (CommandStatus);
  rpc CancelCommand(CommandRequest) returns (CommandStatus);
  // Moves a `lazybox run` that is still in the foreground to the background:
  // the agent's (or the person's) call returns now with a report, and the
  // command keeps running, its output still streaming to the console. Only a
  // run whose CLI follows the Runner (CommandStatus.can_background) can move.
  rpc BackgroundCommand(CommandRequest) returns (CommandStatus);
  // The `lazybox run` that publishes a pipe reports its state (foreground or
  // background, its process, its listening ports) and waits up to wait_ms for
  // what the Runner asks of it: stop the command, or move it to the
  // background. Calling it makes the pipe followed: a Runner restart keeps it,
  // and CancelCommand stops it through its CLI.
  rpc FollowPipe(FollowPipeRequest) returns (FollowPipeResponse);
  rpc WatchOutput(WatchOutputRequest) returns (stream OutputEvent);
  // Workspace terminals: a person's interactive shell, never an agent's.
  rpc OpenTerminal(OpenTerminalRequest) returns (TerminalStatus);
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse);
  rpc WatchTerminal(WatchTerminalRequest) returns (stream TerminalEvent);
  rpc WriteTerminal(WriteTerminalRequest) returns (TerminalStatus);
  rpc ResizeTerminal(ResizeTerminalRequest) returns (TerminalStatus);
  rpc CloseTerminal(TerminalRequest) returns (TerminalStatus);
  // Owner only. Asks the launcher that supervises this Runner to start it
  // again: the Runner records the request and stops exactly as on any restart,
  // detaching (never stopping) agents, managed commands and terminals.
  rpc RestartRunner(RestartRunnerRequest) returns (RestartRunnerResponse);
  // The PR loop, per workspace repository: the owner's only Git and GitHub
  // writes. Agent credentials can never call these.
  rpc CommitWorkspaceChanges(CommitWorkspaceChangesRequest) returns (CommitWorkspaceChangesResponse);
  rpc PushWorkspaceBranch(PushWorkspaceBranchRequest) returns (PushWorkspaceBranchResponse);
  rpc CreatePullRequest(CreatePullRequestRequest) returns (PullRequestStatus);
  rpc GetPullRequest(GetPullRequestRequest) returns (PullRequestStatus);
  rpc MergePullRequest(MergePullRequestRequest) returns (PullRequestStatus);
  // Brings a tracked pull request up to date with its base, when its
  // repository requires that before merging (mergeable_state "behind").
  rpc UpdatePullRequestBranch(UpdatePullRequestBranchRequest) returns (PullRequestStatus);
  // The sidebar's git state, per workspace and repository: branch, ahead and
  // behind its pushed branch and the default branch, uncommitted files, and the
  // last pull request seen for the branch. Local Git only (no fetch); the pull
  // request comes from the tracked items (ListLinks), which the Runner keeps
  // fresh in the background for pushed branches. Owner only.
  rpc ListWorkspaceGitSummaries(WorkspaceGitSummariesRequest) returns (WorkspaceGitSummaries);
  // Tracked work items (PROJECTS_AND_INTEGRATIONS.md, GITHUB.md "Tracked pull
  // requests"): the pull requests a workspace delivers and the items it
  // mentions, kept fresh by their provider and persisted across restarts.
  // ListLinks and LinkItem admit an agent for its own workspace (`lazybox
  // items`, `lazybox link`); a paired phone reads them with the read grant.
  rpc ListLinks(ListLinksRequest) returns (Links);
  rpc LinkItem(LinkItemRequest) returns (Links);
  rpc UnlinkItem(UnlinkItemRequest) returns (Links);
  // One-click reactions to a tracked pull request, always a person's: the
  // failing checks' logs, compacted as `lazybox run` compacts output, and
  // GitHub's review comments as Review comments, each sent to the
  // conversation that delivered it (queued while it is mid-turn).
  rpc SendPullRequestFailures(PullRequestReactionRequest) returns (PullRequestReaction);
  rpc ImportPullRequestReview(PullRequestReactionRequest) returns (PullRequestReaction);
  // Inline review comments on a workspace's changes, kept per workspace on the
  // Runner so every window shows them. Owner only. Every reply is the whole
  // review, each comment anchored against the working tree as it is now.
  rpc ListReviewComments(ListReviewCommentsRequest) returns (WorkspaceReview);
  rpc AddReviewComment(AddReviewCommentRequest) returns (WorkspaceReview);
  rpc EditReviewComment(EditReviewCommentRequest) returns (WorkspaceReview);
  rpc DeleteReviewComment(DeleteReviewCommentRequest) returns (WorkspaceReview);
  rpc SetReviewDisposition(SetReviewDispositionRequest) returns (WorkspaceReview);
  rpc SetReviewAutoResolve(SetReviewAutoResolveRequest) returns (WorkspaceReview);
  // Owner only. One-click cross-agent review (GITHUB.md, "Agent review"):
  // opens a read-only conversation in the same workspace on another agent
  // (by default the other provider than the source conversation's), titled
  // "Review · <scope> · <agent>", linked to the source, and sends it a brief
  // generated from the source's goal, the scope's diff and files, and the
  // `lazybox run` evidence so far. Its findings land in the workspace's review.
  rpc StartReview(StartReviewRequest) returns (StartReviewResponse);
  // A reviewer's finding, from `lazybox review add`. An agent credential may
  // call it only for its own execution, and only while that execution is the
  // reviewer of a review in its own workspace: the Runner derives the
  // workspace, review and author from the execution, never the request. A
  // finding with the key of one already filed in that review updates it.
  rpc AddReviewFinding(AddReviewFindingRequest) returns (ReviewFinding);
  // The findings of the review an execution is the reviewer (or the author)
  // of, from `lazybox review list`. The same agent rule as AddReviewFinding.
  rpc ListReviewFindings(ListReviewFindingsRequest) returns (ReviewFindings);
  // Execute a frozen acceptance recipe for the caller’s active verification review.
  rpc RunReviewVerification(RunReviewVerificationRequest) returns (ReviewVerificationCheck);
  // The reviewer's verdict on one of its own findings in a later round
  // (`lazybox review resolve|reopen <id> --note`): resolved, or still open.
  // The same agent rule as AddReviewFinding; only findings of its own review.
  rpc SetReviewFindingState(SetReviewFindingStateRequest) returns (ReviewFinding);
  // Owner only. Controls a review's loop: pause, resume, stop, take over,
  // and how findings reach the author between rounds.
  rpc UpdateReviewRun(UpdateReviewRunRequest) returns (WorkspaceReview);
  // Owner only. Cancels a review under way (GITHUB.md, "Cancelling a
  // review"): no further round of its loop starts, the reviewer's running
  // turn is interrupted and its session ended. Its conversation and the
  // findings it filed are kept; the review reads "cancelled", with who
  // cancelled it and when. The reply is the review's workspace review.
  rpc CancelReview(CancelReviewRequest) returns (WorkspaceReview);
  // One agent asks the other a question (`lazybox ask author|reviewer`): an
  // agent credential may ask only for its own execution, and only between the
  // author and the reviewer of one review in the same workspace. The question
  // goes to the other conversation as a labelled message; its reply comes back.
  rpc AskAgent(AskAgentRequest) returns (AgentAsk);
  // Waits, at most timeout_seconds (bounded), for the reply. Only the asker.
  rpc WaitAgentAsk(WaitAgentAskRequest) returns (AgentAsk);
  // Owner only. Every process the Runner hosts so it outlives the Runner
  // (agents, managed commands, terminals), held by this Runner or orphaned.
  rpc ListProcesses(ListProcessesRequest) returns (ProcessInventory);
  // Owner only. Stops one hosted process the way its owner would: closes the
  // agent's session, cancels the command, closes the terminal; an orphan is
  // stopped directly.
  rpc StopProcess(StopProcessRequest) returns (ProcessInventory);
  // Owner only. The safe sweep: stops every host this Runner does not hold.
  rpc CleanUpOrphanProcesses(CleanUpOrphanProcessesRequest) returns (CleanUpOrphanProcessesResponse);
  // Owner only. The orchestration process (ORCHESTRATION.md §4) a mission
  // in a workspace would run: a built-in preset, the user's process file and
  // the repository's committed .lazybox/process.yaml, resolved under the
  // user's ceiling and validated. Read-only; nothing runs it yet.
  rpc GetOrchestrationProcess(OrchestrationProcessRequest) returns (OrchestrationProcess);
  // Owner only. What that process does on one event type, in firing order.
  rpc ExplainOrchestrationProcess(ExplainOrchestrationProcessRequest) returns (OrchestrationProcessExplanation);
  // Owner only. Per-turn code checkpoints: the workspace's files saved to a
  // private ref before each agent turn and after it, uncommitted and untracked
  // files included. Lists a conversation's turns and reverts.
  rpc ListTurnCheckpoints(TurnCheckpointsRequest) returns (TurnCheckpoints);
  // Owner only. What one turn changed (checkpoint before → after), per repository.
  rpc ListTurnChanges(TurnChangesRequest) returns (TurnChanges);
  rpc ReadTurnDiff(TurnDiffRequest) returns (WorkspaceDiff);
  // Owner only. What reverting to before a turn would change, without changing it.
  rpc PreviewRevertCode(RevertCodeRequest) returns (RevertCodePreview);
  // Owner only. Restores the workspace's files to before a turn, after saving
  // the current ones so the revert can be undone. Never moves a branch.
  // Refused while an agent in the workspace is in a turn.
  rpc RevertCode(RevertCodeRequest) returns (CodeRevert);
  // Owner only. Undoes the latest revert (an undo can itself be undone).
  rpc UndoRevertCode(UndoRevertCodeRequest) returns (CodeRevert);
  // The workspace runtime (WORKSPACE_RUNTIME.md): each repository's committed
  // .lazybox/workspace.yaml (setup, archive, actions, files to copy) and the
  // workspace's port block. Owner only: neither an agent's nor a terminal's
  // credential may call these. An agent starts an action only through its
  // lazybox_command tool, and only when its session's permission allows.
  rpc GetWorkspaceRuntime(WorkspaceRuntimeRequest) returns (WorkspaceRuntime);
  // Approves exactly the repository scripts the person reviewed (by hash),
  // optionally running setup right away.
  rpc ApproveWorkspaceScripts(ApproveWorkspaceScriptsRequest) returns (WorkspaceRuntime);
  rpc StartWorkspaceAction(WorkspaceActionRequest) returns (WorkspaceActionResult);
  rpc StopWorkspaceAction(WorkspaceActionRequest) returns (WorkspaceActionResult);
  rpc RunWorkspaceSetup(RunWorkspaceSetupRequest) returns (WorkspaceRuntime);
  rpc GetWorkspaceRuntimeSettings(InfoRequest) returns (WorkspaceRuntimeSettings);
  rpc SaveWorkspaceRuntimeSettings(WorkspaceRuntimeSettings) returns (WorkspaceRuntimeSettings);
  // Owner only. Remote control from a phone (REMOTE.md): how a paired device
  // reaches this Runner, and turning the Tailscale route on or off.
  rpc GetRemoteAccess(GetRemoteAccessRequest) returns (RemoteAccess);
  rpc SetRemoteAccess(SetRemoteAccessRequest) returns (RemoteAccess);
  // Owner only. A one-time, short-lived pairing offer for the QR code, its
  // progress while the phone completes it, and withdrawing it.
  rpc BeginDevicePairing(BeginDevicePairingRequest) returns (DevicePairing);
  rpc GetDevicePairing(DevicePairingRequest) returns (DevicePairing);
  rpc CancelDevicePairing(DevicePairingRequest) returns (DevicePairing);
  // Owner only. Paired devices, and revoking one: its access ends at its next request.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (ListDevicesResponse);
  // Web Push to a paired phone (REMOTE.md). A phone reads and sets its own
  // subscription and preferences (the device allowlist admits it with read);
  // the owner sees them on each device and can send it a test.
  rpc GetPushSettings(GetPushSettingsRequest) returns (PushSettings);
  rpc SetPushSettings(SetPushSettingsRequest) returns (PushSettings);
  rpc SendTestPush(SendTestPushRequest) returns (SendTestPushResponse);
  // Missions (ORCHESTRATION.md slice 1), owner only. A mission's board is
  // derived from its event log and live observations; nothing else is stored.
  rpc ListMissions(ListMissionsRequest) returns (ListMissionsResponse);
  rpc GetMission(GetMissionRequest) returns (Mission);
  rpc CreateMission(CreateMissionRequest) returns (Mission);
  // One typed change: a goal, a task, an assignment, a report, a decision at
  // a gate, a cancellation. Refused changes say why and write nothing.
  rpc UpdateMission(UpdateMissionRequest) returns (Mission);
  // Owner only. Sent prompts, newest first, from the Runner's prompt log, with
  // the snippet chain a conversation offers next.
  // Review human inputs within one workspace and publish editable proposals.
  rpc SetWorkflowReviewSchedule(SetWorkflowReviewScheduleRequest) returns (CollectionResponse);
  rpc ReviewWorkflow(ReviewWorkflowRequest) returns (ReviewWorkflowResult);
  rpc ListPromptHistory(ListPromptHistoryRequest) returns (PromptHistory);
  // The Orchestrator verbs (`lazybox agents …`; audits/2026-11-16/sota-agents.md
  // §6.3). An agent credential calls them only for its own execution. Starting
  // an agent needs an Orchestrator grant in force, which only the person gives
  // (UpdateMission grant); every other verb reaches only the caller's own
  // lineage: the children it started, or its parent. None approves, answers,
  // passes a gate or accepts a task.
  rpc SpawnAgent(SpawnAgentRequest) returns (AgentLineage);
  rpc ListAgentLineage(AgentLineageRequest) returns (AgentLineage);
  rpc SendAgentMessage(SendAgentMessageRequest) returns (AgentMessageReceipt);
  // Waits, at most timeout_seconds (bounded), until the targets reach a state
  // or (until "event") anything happens in the lineage after after_seq.
  rpc WaitAgents(WaitAgentsRequest) returns (AgentLineage);
  rpc StopChildAgent(StopChildAgentRequest) returns (AgentLineage);
  // A child reports its own task done to the person (and its parent).
  rpc ReportAgentTask(ReportAgentTaskRequest) returns (AgentLineage);
  // An orchestrator proposes how it would split the mission into agents,
  // with an estimate (`lazybox mission plan`). It waits for the person's
  // approval (UpdateMission approve_plan, owner only) before any of them
  // starts when the grant requires a plan.
  rpc ProposePlan(ProposePlanRequest) returns (MissionPlan);
  // Advisory path leases (`lazybox lease`): an agent leases paths for its own
  // task (an orchestrator, for its agents' tasks). Nothing is blocked; an
  // edit inside another task's exclusive lease is recorded as an overlap.
  rpc ClaimLease(ClaimLeaseRequest) returns (MissionLeases);
  rpc ReleaseLease(ReleaseLeaseRequest) returns (MissionLeases);
  rpc ListLeases(LeasesRequest) returns (MissionLeases);
  // Artifacts: versioned documents (plans, reports, specs, notes) of one
  // workspace, kept by the Runner (ARTIFACTS.md). An agent credential may list,
  // read and put artifacts of its own execution's workspace only
  // (`lazybox artifact`), and retire the ones an agent published there;
  // everything else here is the owner's.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
  rpc GetArtifact(GetArtifactRequest) returns (Artifact);
  // Creates an artifact, or appends a version to one. The author is who called
  // (a person, or the agent whose credential it is), never what the request says.
  rpc PutArtifact(PutArtifactRequest) returns (Artifact);
  // Owner only. Tracks a workspace text file: the artifact's first version is
  // the file, and the Runner records a version whenever the file changes on
  // disk. Tracking a file that is already tracked returns that artifact.
  rpc TrackArtifactFile(TrackArtifactFileRequest) returns (Artifact);
  // Owner only. Rename, change kind, or stop following the tracked file.
  rpc UpdateArtifact(UpdateArtifactRequest) returns (Artifact);
  rpc DeleteArtifact(DeleteArtifactRequest) returns (DeleteArtifactResponse);
  // Retires an artifact, or restores a retired one. Retiring is reversible:
  // the artifact and every version are kept, it leaves the default list, and
  // it may name the artifact that supersedes it. The owner retires or restores
  // any; an agent credential may only retire, in its own execution's
  // workspace, an artifact every version of which an agent published.
  rpc RetireArtifact(RetireArtifactRequest) returns (Artifact);
  // Owner only. Writes the artifact's latest version into a workspace
  // repository; never stages or commits.
  rpc SaveArtifactToRepository(SaveArtifactToRepositoryRequest) returns (SaveArtifactToRepositoryResponse);
  // Owner only. Opens a GitHub issue with the artifact as its body, in a
  // workspace repository's GitHub project, through the GitHub connection.
  rpc CreateArtifactIssue(CreateArtifactIssueRequest) returns (CreateArtifactIssueResponse);
  // Power-user extensibility (POWER.md), owner only. The user's actions and
  // hooks file as the Runner last loaded it: actions the app offers in its
  // menus and runs with the owner's own rules, hooks the Runner fires on
  // events, and every problem with the file by line.
  rpc GetUserActions(GetUserActionsRequest) returns (UserActions);
  // Owner only. Creates the actions file with a commented starter and its
  // JSON Schema beside it, when there is none; never replaces a file.
  rpc InitUserActions(GetUserActionsRequest) returns (UserActions);
  // Owner only. Recent hook runs, newest first; each run's output is its
  // command's (ReadCommand).
  rpc ListHookRuns(ListHookRunsRequest) returns (HookRuns);
  // Owner only. Fires one hook now with a sample event, as Settings' Test does.
  rpc TestHook(TestHookRequest) returns (HookRun);
  // Owner only. Asks the person's open Lazybox window to do something the CLI
  // cannot: show a workspace, conversation or file (`lazybox open`), take a
  // screenshot (`lazybox shot`) or run a user action (`lazybox actions run`).
  // Refused at once when no window is open to handle it.
  rpc PostUiRequest(UiRequest) returns (UiRequest);
  // Owner only. Waits for a posted request's outcome (bounded).
  rpc WaitUiRequest(WaitUiRequestRequest) returns (UiRequest);
  // Owner only. A window follows the requests addressed to it…
  rpc WatchUiRequests(WatchUiRequestsRequest) returns (stream UiRequest);
  // …and answers each one, with a screenshot's PNG when one was asked for.
  rpc CompleteUiRequest(CompleteUiRequestRequest) returns (UiRequest);
  // Owner only. The person's config files beside the actions file (POWER.md,
  // "Config files"): keys.yaml, settings.yaml and layouts/*.yaml as the
  // Runner last loaded them, each with its problems by line. A file that does
  // not load keeps its last good version in force, marked stale.
  rpc GetConfigFiles(GetConfigFilesRequest) returns (ConfigFiles);
  // Owner only. Changes one config file: values at paths (comments kept), a
  // whole new content (import), or removal (a layout). Nothing is written
  // when the result would not load; the refusal names each problem by line.
  rpc UpdateConfigFile(UpdateConfigFileRequest) returns (ConfigFiles);
  // Owner only. Sandboxed panel extensions (EXTENSIONS.md): the folders in the
  // config folder's extensions/, each with what its manifest asks for, what
  // the person approved, and its state. Reloaded every second.
  rpc ListExtensions(ListExtensionsRequest) returns (Extensions);
  // Owner only. Approves exactly the grants and hosts the person was shown and
  // turns the extension on; refused when its manifest asks for anything else
  // now, or does not load.
  rpc ApproveExtension(ApproveExtensionRequest) returns (Extensions);
  // Owner only. Turns an approved extension off, or back on (refused when it
  // asks for more than was approved: that needs ApproveExtension).
  rpc SetExtensionEnabled(SetExtensionEnabledRequest) returns (Extensions);
  // Owner only. Deletes an extension's folder and its approval.
  rpc RemoveExtension(RemoveExtensionRequest) returns (Extensions);
  // Owner only. Copies one of the bundled examples into the folder, not yet approved.
  rpc InstallExampleExtension(InstallExampleExtensionRequest) returns (Extensions);
  // Owner only. Opens one panel of a running extension: the address of its
  // sandboxed page on the extension content origin, and the credential the
  // app's bridge calls the Runner with for it, which admits its approved
  // grants alone and is revoked when they change.
  rpc OpenExtensionPanel(OpenExtensionPanelRequest) returns (ExtensionPanelSession);
  // Agents ask for a repository instead of reaching outside their workspace
  // (WORKSPACES.md, "When an agent needs another repository"). An agent
  // credential may list its own execution's workspace repositories, ask to
  // add one to that workspace and wait for the person's answer: it can never
  // add one. Adding is the owner's PrepareWorkspace, with
  // repository_request_id; declining is DeclineRepositoryRequest.
  rpc ListWorkspaceRepositories(ListWorkspaceRepositoriesRequest) returns (WorkspaceRepositories);
  // Matches the query against the repository catalog and records a pending
  // request on the asking conversation; adds nothing.
  rpc RequestRepository(RequestRepositoryRequest) returns (RepositoryRequest);
  // Waits, at most timeout_seconds (bounded), for the person's answer.
  rpc WaitRepositoryRequest(WaitRepositoryRequestRequest) returns (RepositoryRequest);
  // Owner only. Declines a request; the agent is told the reason.
  rpc DeclineRepositoryRequest(DeclineRepositoryRequestRequest) returns (RepositoryRequest);
  // Agents ask the person to start a conversation (docs/guides/orchestrator.md,
  // "Ask an agent to start another conversation"). An agent credential may
  // ask for its own execution and wait for its own requests: it never starts
  // one. The request waits in the asking conversation like an approval; the
  // person starts it (as asked, or edited) or declines it. A conversation
  // that holds an Orchestrator grant in force starts the agent at once, as
  // SpawnAgent does, under that grant.
  rpc RequestConversationStart(RequestConversationStartRequest) returns (ConversationStartRequest);
  // Waits, at most timeout_seconds (bounded), for the person's answer.
  rpc WaitConversationStart(WaitConversationStartRequest) returns (ConversationStartRequest);
  // The person's answer: start (with their edits) or decline. A paired phone
  // that may respond answers it, without changing the agent or workspace.
  rpc AnswerConversationStart(AnswerConversationStartRequest) returns (ConversationStartRequest);
  // The agent browser (BROWSER.md): a Runner-owned Chromium that an agent
  // drives through its browser_* tools and the person watches beside the
  // chat. Every RPC below is the owner's. An agent reaches only its own
  // conversation's browser, and only through the tool pipe of its own
  // execution, never with a credential.
  //
  // Follows one conversation's browser: its state and recent action log
  // first, then live frames (only while someone watches), actions and state.
  rpc WatchBrowser(WatchBrowserRequest) returns (stream BrowserEvent);
  // Take over / Give back / Stop / Let the agent browse again, browse freely,
  // and the person's own navigation while they hold the browser.
  rpc ControlBrowser(ControlBrowserRequest) returns (BrowserState);
  // The person's mouse and keyboard while they hold the browser (Take over).
  rpc SendBrowserInput(BrowserInputRequest) returns (BrowserState);
  // Answers a site, download or sign-in request the agent's browsing raised.
  rpc DecideBrowserRequest(DecideBrowserRequestRequest) returns (BrowserState);
  // Settings → Browser.
  rpc GetBrowserSettings(InfoRequest) returns (BrowserSettings);
  rpc SaveBrowserSettings(BrowserSettings) returns (BrowserSettings);
  // Closes a workspace's agent browsers and deletes its browser profile
  // (cookies, storage, cache) and its always-allowed sites.
  rpc ClearBrowserData(ClearBrowserDataRequest) returns (BrowserSettings);
  // Installs the Chromium the agent browser runs, in a developer build whose
  // Chromium is missing (BrowserSettings.installable), as a command whose
  // output Settings → Browser shows. One at a time: a second call returns the
  // install already running.
  rpc InstallBrowser(InfoRequest) returns (CommandStatus);
  rpc DeleteTheme(DeleteThemeRequest) returns (ThemeFolder);

  rpc DecideTerminalHandoff(DecideTerminalHandoffRequest) returns (TerminalStatus);
}

message InfoRequest {}
message ModelPrice {
 string provider = 1; string model = 2; int64 input = 3; int64 output = 4; int64 cache_read = 5;
 int64 cache_write5m = 6; int64 cache_write1h = 7; int64 max_input = 8; string version = 9; bool custom = 10;
}
message RunnerSettings { uint64 revision = 1; string naming = 2; string permission = 3; string context = 4; string claude_context = 5; string codex_context = 6; repeated ModelPrice prices = 7; string suggested_name = 8;
  // Hosts new agents, commands and terminals: "sessionhost" or "tmux"; "" keeps
  // the Runner configuration's choice. Running processes keep theirs.
  string process_backend = 9;
  // Subscriptions left out of automatic switching; every other signed-in
  // subscription of a conversation's provider is in its default pool.
  repeated string rotation_excluded_profile_ids = 10;
  // New Claude sessions load the person's claude.ai connectors (Claude's cloud
  // MCP servers, such as Claude Docs, Gmail or Notion). Off by default: plans
  // and documents stay in Lazybox artifacts. Running sessions keep theirs.
  bool claude_ai_connectors = 11;
  // Agent review (GITHUB.md, "Agent review").
  ReviewSettings review = 12;
  // Conversations keep the title made from their first message: no title is
  // generated after the first turn. Off by default, so an older client that
  // does not know the field keeps titles generated.
  bool plain_titles = 13;
  // Lazybox may offer a Claude subscription sign-in (Settings → Subscriptions)
  // and run conversations on the Claude subscriptions saved there. Off by
  // default; CLAUDE_COMPLIANCE.md says why.
  bool claude_subscription_sign_in = 14;
  // One-time notices the person has not dismissed yet, by id
  // ("automatic-switching-moved", "claude-sign-in-kept"). Saving the settings
  // without one dismisses it; a save never adds one.
  repeated string notices = 15;
  // Read only: the providers an enabled extension's account policy switches
  // automatically at a limit. Empty: switching is always the person's choice.
  repeated string automatic_switching_providers = 16;
  // Read only: claude_subscription_sign_in was turned on by the migration,
  // because this Runner already had Claude subscriptions saved in Lazybox.
  bool claude_sign_in_carried_over = 17;
}
message ClaudeAuth {
  // An Anthropic API key is saved; the claude-default account's agents use it.
  bool api_key_set = 1;
  // Its last four characters, to recognise it; never more.
  string api_key_hint = 2;
  // The cloud provider the Runner's environment selects for Claude
  // ("bedrock", "vertex", "foundry", "anthropic-aws"), or "".
  string cloud_provider = 3;
}
message SetClaudeApiKeyRequest {
  // The key (sk-ant-…). Empty with clear forgets the saved one.
  string api_key = 1;
  bool clear = 2;
}
message ReviewSettings {
  // The default reviewer: "" for the other provider than the conversation
  // under review, else a subscription (profile id).
  string reviewer = 1;
  // The brief template; "" is the built-in one (default_template).
  string template = 2;
  // Start a review when an agent's turn ends with changes. Off by default.
  bool auto_start = 3;
  // Read only: the built-in template, for "Reset".
  string default_template = 4;
  // How a new review's findings reach the author between rounds: "ask" (you
  // accept and send them; the default), "auto" or "off" (one pass).
  string loop = 5;
  // Rounds before a loop stops and asks you; 0 is 3.
  uint32 max_rounds = 6;
  // Who reviews by default: "other" (the other agent than the author's:
  // Codex reviews Claude's work and Claude reviews Codex's; the default),
  // "same" (the author's own agent, in a fresh conversation) or "fixed"
  // (reviewer, and reviewer_model when set). "" is "fixed" when reviewer is
  // set, else "other", as before this field. An agent that is not available
  // (not installed, or not signed in) gives way to the author's own agent,
  // and the review says so.
  string reviewer_mode = 7;
  // fixed: the model the reviewer runs on; "" is its agent's default.
  string reviewer_model = 8;
}
message SetModelPriceRequest { uint64 revision = 1; ModelPrice price = 2; bool remove = 3; }
message ListThemesRequest {}
// One file in the themes folder.
message ThemeFile {
  // The file name, extension included.
  string name = 1;
  // "json" or "toml".
  string format = 2;
  // The parsed document as compact JSON; empty when it cannot be parsed.
  string json = 3;
  // Why the file cannot be used: a parse error with its line (and column when
  // known), or a file too large to read.
  string error = 4;
  int64 modified_unix_millis = 5;
}
message ThemeFolder {
  string directory = 1;
  // Sorted by name; at most 64.
  repeated ThemeFile files = 2;
  // Changes whenever any file is added, removed or edited, so a client polling
  // ListThemes reapplies only on a change.
  string revision = 3;
}
message CreateThemeRequest {
  // The base name, without extension: letters, digits, space, '.', '_', '-'.
  string name = 1;
  // The theme as TOML.
  string content = 2;
}
message CreateThemeResponse {
  ThemeFolder folder = 1;
  // The created file's name and absolute path.
  string file = 2;
  string path = 3;
}
message RenameCollectionRequest { string collection_id = 1; string name = 2; }
message TelemetryRequest {
  string workspace = 1; string execution = 2; string conversation = 3;
  // Also report usage hour by hour (TelemetryReport.series), for spend over time.
  bool series = 4;
}
message TelemetryScope { string workspace = 1; string conversation = 2; string execution = 3; string profile = 4; string provider = 5; string attempt = 6; }
message TokenCounts { optional int64 input = 1; optional int64 output = 2; optional int64 cache_read = 3; optional int64 cache_write5m = 4; optional int64 cache_write1h = 5; }
message ContextDetail { string name = 1; optional int64 tokens = 2; }
message ContextCategory { string name = 1; optional int64 tokens = 2; bool included = 3; string kind = 4; repeated ContextDetail details = 5; }
message ContextSnapshot {
 TelemetryScope scope = 1; string agent = 2; string model = 3; optional int64 used = 4; optional int64 capacity = 5;
 optional int64 reserve = 6; string source = 7; repeated ContextCategory categories = 8; string observed_at = 9;
}
message UsageRecord {
 string id = 1; TelemetryScope scope = 2; string agent = 3; string parent = 4; string model = 5; string source = 6;
 string response_id = 7; string status = 8; TokenCounts tokens = 9; optional int64 nanos = 10; string price_version = 11;
 string reason = 12; string tier = 13; string observed_at = 14;
 // What each part of nanos cost; absent when unpriced.
 TokenCosts costs = 15;
}
// What each kind of token cost, in nanodollars; a part is absent when unknown.
message TokenCosts { optional int64 input = 1; optional int64 output = 2; optional int64 cache_read = 3; optional int64 cache_write5m = 4; optional int64 cache_write1h = 5; }
message UsageGroup {
 TelemetryScope scope = 1; string agent = 2; string model = 3; string source = 4; TokenCounts tokens = 5;
 optional int64 nanos = 6; int64 records = 7; int64 unpriced = 8; int64 incomplete = 9;
 // What each part of nanos cost, when every priced record says; absent otherwise.
 TokenCosts costs = 10;
 // Why the unpriced records have no price, each reason once.
 repeated string unpriced_reasons = 11;
 // The tokens of the unpriced records: what nanos leaves out.
 TokenCounts unpriced_tokens = 12;
}
// Usage in one hour (UTC) by conversation, provider and model: tokens and
// cost, counted as the report's groups count them.
message UsageBucket {
 int64 hour_unix_millis = 1; string conversation = 2; string provider = 3; string model = 4;
 TokenCounts tokens = 5; optional int64 nanos = 6; int64 records = 7; int64 unpriced = 8;
}
message TelemetryReport {
 repeated UsageGroup groups = 1; repeated ContextSnapshot contexts = 2; repeated UsageRecord recent = 3;
 // Hour by hour, oldest first; only when the request asked for series.
 repeated UsageBucket series = 4;
}
message AddSubscriptionRequest {
  string request_key = 1;
  string provider = 2;
  string label = 3;
  // Secret input: never retained in ordinary metadata or logs.
  string subscription_token = 4;
  // How the person signs in: "browser" (the provider's page in a browser on
  // the Runner's computer, which calls back to the provider CLI there) or
  // "device" (a one-time code entered on any device; Codex only). Empty is
  // the Runner's default, the browser.
  string sign_in_method = 5;
}
message SubscriptionEnrollmentRequest {
  string enrollment_id = 1;
  string request_key = 2;
  string provider = 3;
}
message RenameSubscriptionRequest {
  string profile_id = 1;
  string label = 2;
}
message RefreshSubscriptionRequest { string profile_id = 1; }
message SubscriptionEnrollment {
  string id = 1;
  string state = 2;
  string profile_id = 3;
  string provider = 4;
  string label = 5;
  string sign_in_url = 6;
  string user_code = 7;
  string error = 8;
  // "browser" or "device" (AddSubscriptionRequest.sign_in_method); empty for
  // an imported token. A browser sign-in has a sign_in_url and no user_code.
  string sign_in_method = 9;
  // Why a sign-in failed, so the client can offer the way out:
  // "device_sign_in_disabled" (the account refuses device codes; the browser
  // works) or "sign_in_in_progress" (another sign-in holds the provider's
  // local callback). Empty otherwise.
  string error_code = 10;
}
message UsageWindow {
  string name = 1;
  double used_percent = 2;
  int64 reset_at = 3;
  int64 duration_minutes = 4;
}
message Profile {
  string id = 1;
  string provider = 2;
  string isolation = 3;
  AccountObservation availability = 4;
  string label = 5;
  bool managed = 6;
  // A Claude account an earlier Lazybox imported from a subscription token
  // (no longer done; not recommended). The token itself is never sent.
  bool token_imported = 7;
}
message RemoveSubscriptionRequest {
  string profile_id = 1;
}
message Gateway {
  string id = 1;
  string provider = 2;
}
message InfoResponse {
  repeated Profile profiles = 1;
  repeated Gateway gateways = 2;
  repeated Session sessions = 3;
  string default_model = 4;
  string default_permission = 5;
  AttachmentLimits attachment_limits = 6;
  repeated SubscriptionEnrollment pending_enrollments = 7;
  bool shared_subscriptions = 8;
  // A supervising launcher will start this Runner again after RestartRunner.
  bool restart_available = 9;
  // Random per Runner process: a new value means a new process is serving.
  string instance_id = 10;
  // Stable across restarts of the same Runner database.
  string runner_id = 11;
}
message ProviderAvailabilityRequest {
  // Probe the provider programs again (path and version) instead of answering
  // from the last probe.
  bool refresh = 1;
  // Include latest official stable releases from the Runner’s cached check.
  bool check_updates = 2;
}
message ProviderAvailability {
  // Every provider the Runner knows, installed or not, in a fixed order.
  repeated ProviderStatus providers = 1;
  // When the programs were last probed.
  int64 checked_at_unix_millis = 2;
}
message ProviderStatus {
  // "claude", "codex", or an ACP agent: "acp:<id>" (ACP.md).
  string provider = 1;
  // The program as people know it: "Claude Code", "Codex", "Gemini CLI".
  string title = 2;
  // ready (a subscription can take work), limited (every subscription is at a
  // limit), sign_in (none is signed in), billing, no_subscription,
  // not_installed, or unusable (installed but cannot run: see error).
  string state = 3;
  bool installed = 4;
  // The program the Runner runs, and its reported version ("2.1.311").
  string path = 5;
  string version = 6;
  // Where the program comes from: configured, bundled (with the SDK), path.
  string source = 7;
  // Why the provider cannot run, in plain words; empty when it can.
  string error = 8;
  // A command that installs the provider, when it is missing.
  string install_command = 9;
  // This provider's saved subscriptions, the best to use first.
  repeated SubscriptionAvailability subscriptions = 10;
  // Set for an ACP agent (provider "acp:<id>"); Claude and Codex have none.
  AcpAgentInfo acp = 11;
  // The models a conversation of this provider can switch to (/model): what
  // the program lists (Codex's model/list), else a built-in list. A running
  // agent's own list (its command_catalog event) is more precise; this is
  // the fallback for an agent that reports none. Empty for an ACP agent.
  repeated ProviderModel models = 12;
  // Latest stable release if the optional update check succeeded.
  string latest_version = 13;
}
// One model a provider offers, as the model picker lists it.
message ProviderModel {
  // The id the provider takes: an alias ("opus") or a full id ("claude-opus-5-5").
  string value = 1;
  // Its name as people say it: "Opus 5.5", "GPT-6.1-Sol".
  string display_name = 2;
  string description = 3;
  repeated string effort_levels = 4;
}
// An ACP agent (Agent Client Protocol) as Settings → Agents shows it.
message AcpAgentInfo {
  string id = 1;
  // The client's icon for it ("agent-gemini"); "agent" for a custom one.
  string icon = 2;
  // How the Runner starts it: a program on its PATH or an absolute path.
  string command = 3;
  repeated string args = 4;
  // The names of the environment variables it is given. Their values never
  // leave the Runner.
  repeated string env_names = 5;
  string homepage = 6;
  // The person added it, or changed a built-in one's command.
  bool custom = 7;
  // A built-in agent's installed program does not name, in its --help, the
  // flags Lazybox starts it with: a sentence for Settings, empty when they
  // are all named or it was not checked. A hint; the agent may still start.
  string launch_problem = 8;
  // The agent whose credentials it uses when it has none of its own
  // ("gemini" for Antigravity); empty when it shares none.
  string shares_credentials_with = 9;
  // The names it takes from that agent now, because that agent has them and
  // it does not. Their values never leave the Runner.
  repeated string inherited_env_names = 10;
  // The names it takes from that agent when it has none of its own
  // ("GEMINI_API_KEY"): which of either agent's names are the shared key.
  repeated string shared_env_names = 13;
  // The command that signs a built-in agent in on the Runner ("agy acp
  // --login"), and what else its credentials need; empty when unknown.
  string sign_in_command = 11;
  string credentials_note = 12;
}
message AcpEnvVar {
  string name = 1;
  // Empty keeps the value saved before under this name.
  string value = 2;
}
message SaveAcpAgentRequest {
  // Lowercase letters, digits and dashes; empty makes one from the title. A
  // built-in agent's id changes how that agent starts.
  string id = 1;
  string title = 2;
  string command = 3;
  repeated string args = 4;
  repeated AcpEnvVar env = 5;
}
message RemoveAcpAgentRequest {
  string id = 1;
}
message SubscriptionAvailability {
  string profile_id = 1;
  // The label Settings shows; empty for a CLI sign-in the Runner inherited.
  string label = 2;
  // available, unverified (no limit observed and no credential found to
  // check), limited, sign_in or billing.
  string state = 3;
  // When a limited subscription resets (Unix seconds); 0 when unknown.
  int64 reset_at = 4;
  // One plain line: "Signed in", "Not signed in", the reason it is unusable.
  string detail = 5;
  bool managed = 6;
  string isolation = 7;
}
message RestartRunnerRequest {}
message RestartRunnerResponse {
  // The process that is stopping; Info reports another one once its successor serves.
