[package]
name = "lazybox-snippets"
description = "Read-only snippet catalog for the Lazybox Runner."
version = "0.0.0"
license = "Apache-2.0"
edition = "2024"
publish = false

# Standalone: no other manifest in this repository builds it as a member.
[workspace]

[[bin]]
name = "lazybox-snippets"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
