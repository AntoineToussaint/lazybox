# yaml-language-server: $schema=./actions.schema.json
#
# Your Lazybox actions and hooks. Lazybox reloads this file as soon as you
# save it; Settings → Actions & hooks shows what loaded and any mistake, by
# line. `lazybox actions validate` checks it from a terminal.
#
# Actions appear in the ]] menu (with a key), the command palette and the
# conversation and workspace menus. They run with your own rules: a workspace
# action still needs its scripts approved, a read-only conversation runs no
# command. Hooks run a program, a shell line or a webhook when something
# happens; they are listed in Settings and in Processes while they run.
# Reference: POWER.md.
version: 1

actions:
  - id: continue
    title: Tell the agent to continue
    icon: play
    steps:
      - send: Continue.

