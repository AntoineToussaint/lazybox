}
message WorkspaceDiffRequest { string collection_id = 1; string member = 2; string path = 3; bool staged = 4; // Diff of the branch's commits since the workspace's base, not of uncommitted changes.
  bool committed = 5;
  // With committed: the ref compared with; empty is the workspace start.
