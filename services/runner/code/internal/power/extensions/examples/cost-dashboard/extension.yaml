# yaml-language-server: $schema=../extension.schema.json
#
# An example Lazybox extension (EXTENSIONS.md): what your agents cost, over
# time and by model, workspace, conversation and tracked pull request. It reads PR metadata, token use and the
# conversation list (titles only, never messages), and can bring a
# conversation forward in the window. It cannot send anything, change
# anything or reach the network.
lazybox: 1
category: Monitoring & costs
caption: Cost dashboard panel with fixture workspace data.
keywords: [usage, tokens]
name: Cost dashboard
version: 1.2.0
description: Estimated spend by pull request, workspace, conversation and model.
author: Lazybox
panels:
  - id: costs
    title: Cost dashboard
    description: Spend and tokens across every workspace
    icon: chart
    entry: index.html
grants:
  - read:usage
  - read:sessions
  - read:pulls
  - show:conversations
