# Weekly, grouped dependency update pull requests. Each one runs CI like any
# other pull request; nothing merges on its own.
#
# Not updated here, because they are bumped deliberately elsewhere:
#   - the codefly-dev Go modules: the generated Runner code (`make generate`,
#     `make check-generated`) must match the Codefly CLI and go-grpc agent
#     pinned in ci.yml and services/runner/service.codefly.yaml;
#   - lazybox-config in tools/lazybox-snippets: a reviewed lazybox-v1 revision
#     (REUSE_AUDIT.md);
#   - the Node bundled into the app (scripts/release/node.json) and the CI
#     Node version, which are not package manifests.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        update-types: [minor, patch]
        # The Agent SDK bundles the Claude Code the worker drives, so a bump
        # changes agent behaviour, approvals and auth errors, and wants the
        # real-provider tests (`make test-real`) and RUNTIME_EVIDENCE.md. It
        # comes as its own pull request instead of riding a group.
        exclude-patterns: ["@anthropic-ai/claude-agent-sdk"]

  - package-ecosystem: gomod
    directory: /services/runner/code
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/codefly-dev/*"
      # Vanguard 0.5 is rebuilt on connect-go v2 (its Transcoder and Service
      # types are gone); 0.4 is the last line for connect-go v1. The Runner's
      # adapters are generated by the pinned Codefly go-grpc agent against
      # connect-go v1 and vanguard 0.4, so vanguard moves with Codefly.
      - dependency-name: "connectrpc.com/vanguard"
        versions: [">= 0.5.0"]
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /apps/desktop/src-tauri
      - /tools/lazybox-snippets
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: lazybox-config
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
