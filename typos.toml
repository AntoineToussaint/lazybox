# typos config — used by the `typos` job in CI (crate-ci/typos
# action) and runnable locally with `typos`.
#
# Default behavior catches a lot of real typos in code + comments.
# This file only encodes the things typos.dev gets *wrong* for this
# repo: crate names it thinks are misspellings, GraphQL/JSON
# identifiers, and English spelling variants we've consciously
# picked.

[default]
extend-ignore-identifiers-re = [
    # GraphQL filter operator (Linear API): `nin` = "not in".
    "nin",
]

[default.extend-words]
# `ratatui` is the Rust TUI crate — not a misspelling of
# "ratatouille". Apply to lowercase + titlecase occurrences.
ratatui = "ratatui"
Ratatui = "Ratatui"

# Domain-specific identifiers and idioms we've settled on.
sluggify = "sluggify"     # internal helper name; renaming is churn-only
unparseable = "unparseable"  # accepted English variant
unmergable = "unmergable"    # accepted English variant
clonable = "clonable"        # accepted English variant
activit = "activit"          # format-string fragment: "activit{}"
seeked = "seeked"            # DOM media event name (HTMLMediaElement 'seeked')
Shft = "Shft"                # deliberate typo'd chord in the unparseable-chord example/test
mis = "mis"                  # hyphenated prefix: "mis-decode" etc.
fo = "fo"                    # RFC 4648 base64 test vector (b"fo")
hel = "hel"                  # composing-buffer test value ("hello" minus 2 chars)

[files]
extend-exclude = [
    # cargo-machete / vendored bindgen output / snapshot files have
    # their own conventions and shouldn't gate on prose typos.
    "**/snapshots/**",
    "**/*.snap",
    "**/*.snap.new",
    "Cargo.lock",
    # The vendored libghostty crates carry upstream comments/names.
    "crates/libghostty-vt/**",
    "crates/libghostty-vt-sys/**",
    # Binary PTY captures: raw terminal byte streams (ANSI cursor moves
    # concatenated with text, e.g. `␛[3;3HThe` → "Hthe") are not prose.
    "**/*.bin",
]
