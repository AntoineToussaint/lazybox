# Builds the public homepage, V2 guides and frozen V1 archive together.
name: Docs

on:
  push:
    tags:
      - "v2-v*"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "26"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
          DOCS_SOURCE_REF: ${{ github.ref_name }}
        run: npm run site:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .cache/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
