  // Whether a pull request exists for the branch; the fields below describe it.
  bool found = 5;
  int64 number = 6; string title = 7; string url = 8;
  // open, closed or merged.
  string state = 9; bool draft = 10; string base = 11; string head_sha = 12;
  // GitHub's mergeable_state: clean, blocked, behind, dirty, unstable, has_hooks, draft or unknown.
  string mergeable_state = 13; bool mergeable = 14;
  // approved, changes_requested, review_required, or empty when no review is asked for.
  string review_decision = 15;
