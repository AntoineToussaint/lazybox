primary_region = "ewr"

[build]
  dockerfile = "crates/relay/Dockerfile"

[env]
  LAZYBOX_RELAY_LISTEN_ADDR = "0.0.0.0:9443"
  RUST_LOG = "lazybox_relay=info"

[[services]]
  internal_port = 9443
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 9443

  [[services.tcp_checks]]
    grace_period = "2s"
    interval = "15s"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
