name: Smoke release artifacts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check public release identity and install commands
        run: |
          jq -e '
            .releases[]
            | select(.app_name == "lazybox-tui-boot")
            | .display_name == "lazybox"
          ' <<< "$PLAN"
          jq -r '.announcement_changelog' <<< "$PLAN" \
            | scripts/check-release-notes.sh

  archives:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the exact target archive
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-${{ matrix.target }}
          path: target/distrib
          merge-multiple: true
      - name: Extract and exercise packaged commands
        run: scripts/smoke-release-artifacts.sh target/distrib
