  string session_id = 1;
}
message Capabilities {
  bool images = 1;
  bool questions = 2;
  bool approvals = 3;
  bool steer = 4;
  bool resume = 5;
  bool pending_resume = 6;
  string profile_isolation = 7;
  bool files = 8;
  bool subagents = 9;
  // The permission mode can change while the session runs.
  bool live_permission = 10;
  // One sub-agent can be stopped (ApplyRequest.stop_agent) while the main
  // agent continues.
  bool stop_agent = 11;
  // The model can change while the session runs (ApplyRequest.model), for
