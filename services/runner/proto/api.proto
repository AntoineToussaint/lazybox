  uint32 comments = 2;
}
message ItemComment {
  string author = 1;
  // Markdown, as the provider stores it.
  string body = 2;
  int64 created_at_unix_millis = 3;
  string url = 4;
}
// An item with what an agent is given about it.
message ItemDetail {
  Item item = 1;
  // The description, as Markdown.
  string body = 2;
  // The most recent comments, oldest first.
  repeated ItemComment comments = 3;
  // How many comments the item has in all.
