# Build + test on every PR / main push. Catches regressions before
# they hit a release tag.
#
# The "branch must be up-to-date with main" merge gate is OFF, so a
# PR can merge without re-running CI against the latest main. To
# compensate, CI runs a broader set of checks here: build/test/clippy
# (matrix), fmt, rustdoc with -D warnings, cargo-deny, typos, and
# cargo-machete (soft-fail).
#
# Jobs that compile workspace code share `.github/actions/rust-build-env`
# (Zig + C toolchain + Rust stable + cache) so the install step
# doesn't drift across jobs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-env

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-env
        with:
          rust-components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rustdoc:
    # Broken intra-doc links / bad rustdoc references fail CI. Linux
    # only — rustdoc behavior doesn't differ across the matrix and
    # matrixing would just double the build time of a slow job.
    name: rustdoc
    runs-on: ubuntu-22.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-env
      - run: cargo doc --no-deps --workspace

  deny:
    # cargo-deny gates on RustSec advisories, banned/duplicated deps,
    # license policy, and source allowlists. Config lives in
    # `deny.toml` at the repo root. No Rust toolchain or build of the
    # workspace needed — cargo-deny only reads Cargo.lock.
    name: deny
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  typos:
    name: typos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to a tagged release rather than `@master` so CI is
      # reproducible across re-runs and a silent upstream change
      # can't flip behavior. Bump when typos.dev cuts a new release.
      - uses: crate-ci/typos@v1.46.3

  machete:
    # cargo-machete surfaces unused workspace dependencies. Soft-fail
    # initially because the noise/value ratio isn't known yet on this
    # workspace — `continue-on-error` is at the *step* level so the
    # job (and the PR check) stays green while the run log still
    # surfaces what machete found. Promote to a step-level required
    # check (drop `continue-on-error`) and add to branch protection
    # once the signal proves clean.
    name: machete
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to a tagged release rather than `@main` so CI is
      # reproducible. Bump when bnjbvr/cargo-machete cuts a new release.
      - uses: bnjbvr/cargo-machete@v0.9.2
        continue-on-error: true
