# Per-test timeout enforced by cargo-nextest.
#
# Why: rustc's built-in test runner has no per-test bound. A single
# deadlock hangs the whole `cargo test --workspace` invocation
# silently. nextest's `slow-timeout` kills any test that exceeds the
# `period` and the suite continues, surfacing the offender as a
# failure instead of a hang.
#
# Run with `cargo nextest run --workspace` (also wired into `make test`).

[profile.default]
# Tests are unit tests; the hard ceiling is 30s for the whole suite,
# so any single test taking >10s is a bug. `terminate-after = 1` kills
# the process after one slow-timeout period.
slow-timeout = { period = "10s", terminate-after = 1 }
# Don't suppress output on failure — when a deadlock kills a test we
# want to see its stdout for diagnosis.
failure-output = "immediate-final"
# Skip #[ignore]'d tests by default (real-backend integration tests).
# Run them on demand with `cargo nextest run --run-ignored only`.
default-filter = "not test(/^ignored_/)"

# Integration tier (#410): `e2e_*` tests run real subprocesses — git
# provisioning, tmux attach, live agent binaries — and are legitimately
# seconds-slow. Applies to every profile (overrides in `default` are
# inherited).
[[profile.default.overrides]]
filter = 'test(/^e2e_/)'
slow-timeout = { period = "150s", terminate-after = 1 }

[[profile.default.overrides]]
# This boundary test drives a real PTY through sustained output, disconnect,
# replay, and resync, so its own bounded phases can legitimately exceed 10s.
#
# The period must stay ABOVE the test's own in-test bounds
# (`PTY_OUTPUT_TOTAL_TIMEOUT` + the post-wait phases, see
# `crates/server/tests/api_gateway.rs`). `terminate-after = 1` SIGKILLs the
# process, and a killed test never unwinds, so whichever bound fires first
# decides whether the failure names its cause or reads `TIMED OUT`. Measured
# 36s under a loaded `nextest run -p lazybox-server`; the headroom here is for
# the box, not for the fixture, which is bounded at 4000 paced lines.
# `nextest_budget_outlasts_the_in_test_pty_bounds` pins the ordering.
filter = 'test(/^desktop_runtime_real_pty_handles_backpressure_reconnect_replay_and_resync$/)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.default.overrides]]
# The PTY-watchdog starvation tests drive a continuously-repainting Codex
# session under sustained backpressure across the full 15s watchdog window
# (issue #629). The flood is a bounded, deterministic ~1.4k frames, but the
# real wall-clock to chew them scales with the runner's available CPU, so a
# loaded CI box can push these bounded phases past the 10s unit bound.
filter = 'test(/^continuously_ready_(codex_repaints_do_not_starve_the_working_watchdog|meaningful_codex_output_advances_the_watchdog_anchor)$/)'
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.default.overrides]]
# The idle-detector behavior tests each run the real `lazybox-idle-stop.sh`
# under bash, and every tick of it is a full `ps` of the host — on a loaded
# box a three-tick test alone exceeded the 10s default (#1751). The CPU
# fixtures (#1597) also wait for a process tree to accrue a whole second of
# CPU, which is a physical quantity, not a fixed sleep: each burns a measured
# quota and waits `CPU_QUOTA_TIMEOUT` (120s) for the box to hand it out, then
# fails with the observation it made — a runner kill would replace that with
# a bare "timed out", which is the diagnosis-free failure these tests exist
# to end. The period must stay above the in-test wait plus the `ps` ticks
# around it; `nextest_budget_outlasts_the_cpu_quota_wait` pins the ordering.
filter = 'binary(box_lifecycle) and test(/^behavior::/)'
slow-timeout = { period = "180s", terminate-after = 1 }

[[profile.default.overrides]]
# The snapshot-budget tests assemble forty 2 MiB replay rings — over the
# 64 MiB socket frame cap on purpose — and bincode-encode the result in an
# unoptimized build. That is real work sized by the condition under test,
# and on a loaded box it ran past the 10s default (#1751).
filter = 'package(lazybox-server) and test(/^snapshot_budget_tests::/)'
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.default.overrides]]
# A merge and a spawn racing for one workspace, with the merge's store batch
# held open by the test. Once released, both do real work — the merge folds
# sessions and commits, the losing spawn provisions before it observes the
# deletion — and the test's own 30s liveness bound (`LOSING_SPAWN_LIVENESS`)
# has to fire before the runner's kill so a hang fails by name. Measured at
# 2.1s on a box at load ~90 (#1741).
filter = 'binary(polling) and test(/^spawn_losing_to_merge_cannot_recreate_the_deleted_source$/)'
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.default.overrides]]
# These tests exec the freshly built `lazybox` binary. The first exec of a
# ~200 MB debug build after a rebuild pages it in from a cold cache (measured
# 13s on a loaded box, 20ms once warm), so the wall clock is a property of
# the build and the page cache, not of the one-frame socket round-trip under
# test. The tests warm the binary outside their own liveness bound; this
# period keeps the cold exec itself inside the runner's budget.
filter = 'binary(notification_click)'
slow-timeout = { period = "60s", terminate-after = 1 }

[profile.ci]
# CI uses the same bound and fails on the first broken test.
slow-timeout = { period = "10s", terminate-after = 1 }
failure-output = "immediate-final"

# The loaded lane (`scripts/test-under-load.sh`, the merge queue's `loaded`
# job): the whole suite under two busy-loop spinners per core, ~3× CPU
# oversubscription on a 4-core runner. What that lane exists to catch is a
# wall-clock bet *inside* a test — a fixed budget that only an idle box
# meets — and those fail by their own assertion at any runner deadline. A
# 10s runner kill would instead take out tests doing 6–8s of real
# subprocess work (tmux reattach, real provisioning), which are not the
# bug: measured 6.4–7.9s at load 25–80 on a 15-core box, so 3× more
# oversubscribed they cross 10s. This period is the ceiling on honest work
# under load, not a per-test budget; the per-test overrides above still
# apply. `the_loaded_lane_runs_under_its_own_profile` pins the wiring.
[profile.loaded]
slow-timeout = { period = "30s", terminate-after = 1 }
failure-output = "immediate-final"

# Nightly lane: the full workspace including #[ignore]'d real-backend /
# live-agent tests (`--run-ignored all` in the workflow). No retries —
# a flaky real-path test is a signal, not noise to absorb.
[profile.nightly]
slow-timeout = { period = "10s", terminate-after = 1 }
failure-output = "immediate-final"
