# Linux builds and tests every Rust PR. The merge queue adds the expensive
# macOS and MSRV lanes against the exact candidate tree before it reaches main.
#
# Test breadth cannot compensate for a stale PR base: two independently-green
# PRs may still fail when composed. Keep `merge_group` enabled here and require
# CI on the repository's merge queue (or require branches be up to date) so
# GitHub tests the exact candidate tree before advancing main.
#
# The stable Linux gates — clippy, nextest, rustdoc, and the benchmark link
# check — each compile an independent artifact set (check .rmeta vs test bins vs
# doc vs bench bins), so co-locating them in one job only serialized four
# compiles behind each other (~8m wall-clock). They now run as four parallel
# jobs (`test`, `clippy`, `rustdoc`, `benches`), so wall-clock is the slowest
# single gate instead of their sum: ~5m on a cold cache, ~3m once a `main` push
# has seeded the shared cache. All four pass the same `shared-key: linux` to
# `rust-build-env`, so they save/restore ONE dependency cache rather than four
# per-job caches — the split stays within GitHub's 10GB LRU pool and every gate
# restores the same warm build. `clippy`/`rustdoc` reclaim the required-check
# names the old stubs held.
#
# `push: main` exists only to seed the cache, not to gate anything. GitHub
# shares a cache with a PR only if it was created on the PR's base branch, so
# without a run on `main` every PR's first build restores nothing and
# recompiles the whole workspace from scratch (the bulk of the 9-13m runs).
# The post-merge `main` run compiles once and saves the caches that every
# later PR restores; `rust-build-env` gates cache *saves* to `main` for the
# same reason (see that action).

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Cancel superseded PR runs on force-push so a re-push doesn't queue behind a
# now-stale run. Only pull_request events cancel: each merge-queue entry gets a
# unique group ref (no cancellation), and `push: main` runs stay independent so
# a cache-seeding build is never killed by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - ".cargo/**"
              - ".config/nextest.toml"
              - ".github/actions/rust-build-env/**"
              - ".github/workflows/ci.yml"
              - ".ghostty-version"
              - ".zig-checksums"
              - ".zig-version"
              - "Cargo.lock"
              - "Cargo.toml"
              - "README.md"
              - "crates/**"
              - "deny.toml"
              - "docs/features/**"
              - "docs/slack-setup.md"
              - "docs/snippets.md"
              - "docs/themes.md"
              - "prompts/**"
              - "rust-toolchain.toml"
              - "scripts/**"
            web:
              - ".github/workflows/ci.yml"
              - "crates/server/src/api_client.html"
              - "crates/server/src/api_client_contract.json"
              - "web/**"
            desktop:
              - ".cargo/**"
              - ".github/workflows/ci.yml"
              - "Cargo.lock"
              - "Cargo.toml"
              - "apps/desktop/**"
              - "crates/config/**"
              - "crates/core/**"
              - "crates/gh-provider/**"
              - "crates/ipc/**"
              - "crates/server/**"
              - "crates/store/**"
              - "crates/tui-core/**"
              - "docs/desktop-spike.md"
            contracts:
              - ".github/ISSUE_TEMPLATE/**"
              - ".github/workflows/ci.yml"
              - ".github/workflows/release.yml"
              - "CONTRIBUTING.md"
              - "README.md"
              - "SUPPORT.md"
              - "web/**"

  msrv:
    name: msrv (Rust 1.88.0)
    needs: changes
    if: github.event_name == 'merge_group' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
        with:
          rust-toolchain: 1.88.0
      - run: cargo check --workspace --all-targets

  test:
    name: test (ubuntu-22.04)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
        with:
          shared-key: linux

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test with per-test timeout enforcement
        run: |
          cargo nextest run --workspace --profile ci
          # `managed-k8s` is intentionally not wired into the product yet,
          # so workspace feature unification does not compile it. Keep the
          # provider contract and in-memory control plane release-gated.
          cargo nextest run -p lazybox-sandbox --all-features --profile ci

  macos:
    name: test (macos-14)
    needs: changes
    if: github.event_name == 'merge_group' && needs.changes.outputs.rust == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env

      - name: Build
        run: cargo build --workspace --all-targets

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test with per-test timeout enforcement
        run: cargo nextest run --workspace --profile ci

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
        with:
          rust-components: clippy
          shared-key: linux
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p lazybox-sandbox --all-targets --all-features -- -D warnings

  fmt:
    name: fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  web:
    name: web (types, build, Lighthouse budgets)
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' ||
      (needs.changes.outputs.contracts == 'true' && needs.changes.outputs.rust != 'true')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: npm ci
      - name: Audit deployable web dependencies
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate
      - name: Type-check and build site
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: |
          npm run check
          npm test
      - name: Enforce Lighthouse and transfer-size budgets
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: npm run lighthouse
      # Most web edits need no workspace build. These two Rust-backed
      # contract tests are the exception: they compare public docs with
      # the shipped config and runtime action catalog.
      - uses: ./.github/actions/rust-build-env
        if: needs.changes.outputs.contracts == 'true' && needs.changes.outputs.rust != 'true'
        with:
          shared-key: linux
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.contracts == 'true' && needs.changes.outputs.rust != 'true'
        with:
          tool: cargo-nextest
      - name: Verify Rust-backed web contracts
        if: needs.changes.outputs.contracts == 'true' && needs.changes.outputs.rust != 'true'
        run: cargo nextest run -p lazybox-tui --profile ci --test web_docs --test keymap_docs

  # Lightweight, PR-gating compile check for the desktop shell (#1207).
  # The desktop lives in its OWN Cargo workspace, so the root `cargo
  # build/clippy` never touches it — any change to a shared type
  # (`ComputeInputs`, IPC DTOs, the inbox builder) broke it silently, at
  # least twice. This job is deliberately minimal (no npm, no
  # playwright, no bundling — the disabled `desktop` MVP job below keeps
  # those) so it stays fast enough to gate merges.
  desktop-check:
    name: desktop shell compiles (macos-14)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
        with:
          cache-workspaces: |
            .
            apps/desktop/src-tauri
      - name: Compile the desktop shell against shared crates
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked

  desktop:
    name: desktop MVP (macos-14)
    needs: changes
    # Desktop CI is temporarily disabled: the generated desktop
    # contracts have drifted and the shell isn't a release blocker right
    # now. Re-enable by dropping `false &&` once the desktop app is being
    # actively maintained again. The lightweight `desktop-check` job
    # above still gates PRs on the shell COMPILING (#1207).
    if: false && needs.changes.outputs.desktop == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: ./.github/actions/rust-build-env
        with:
          rust-components: clippy,rustfmt
          cache-workspaces: |
            .
            apps/desktop/src-tauri
      - name: Verify generated desktop contract
        run: |
          cargo run -p lazybox-server --features desktop-contract --bin generate-desktop-contract
          cargo test -p lazybox-server --test api_gateway desktop_compatibility_fixture_is_current -- --exact
          git diff --exit-code -- apps/desktop/src/generated \
            || { echo "::error::desktop contract is stale — run 'make desktop-contract' and commit apps/desktop/src/generated"; exit 1; }
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Test and build frontend
        working-directory: apps/desktop
        run: |
          npm audit --audit-level=moderate
          npm run check
          npm test
          npm run build
      - name: Install browser for desktop e2e
        working-directory: apps/desktop
        run: npx playwright install chromium
      - name: Browser accessibility and integration e2e
        working-directory: apps/desktop
        run: npm run e2e
      - name: Lint and test desktop shell
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Build internal macOS app
        working-directory: apps/desktop
        run: npm run tauri build -- --debug --bundles app
      - name: Package executable macOS app
        working-directory: apps/desktop/src-tauri
        run: |
          test -x target/debug/bundle/macos/lazybox.app/Contents/MacOS/lazybox-desktop
          target/debug/bundle/macos/lazybox.app/Contents/MacOS/lazybox-desktop --version \
            | grep -E '^lazybox-desktop [0-9]+\.[0-9]+\.[0-9]+\+[0-9a-f]{12}$'
          tar -czf target/debug/bundle/macos/lazybox-macos-dogfood.tar.gz \
            -C target/debug/bundle/macos lazybox.app
          mkdir target/debug/bundle/macos/archive-check
          tar -xzf target/debug/bundle/macos/lazybox-macos-dogfood.tar.gz \
            -C target/debug/bundle/macos/archive-check
          test -x target/debug/bundle/macos/archive-check/lazybox.app/Contents/MacOS/lazybox-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: lazybox-macos-dogfood
          path: apps/desktop/src-tauri/target/debug/bundle/macos/lazybox-macos-dogfood.tar.gz
          if-no-files-found: error

  rustdoc:
    name: rustdoc
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
        with:
          shared-key: linux
      - name: Rustdoc
        run: |
          cargo doc --no-deps --workspace
          cargo doc --no-deps -p lazybox-sandbox --all-features

  benches:
    # The workspace's two criterion benches (tui, server) type-check under the
    # clippy `--all-targets` gate but only this full build proves they still
    # link. Its own runner keeps the ~3m bench link off the test critical path.
    name: benches
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-build-env
        with:
          shared-key: linux
      - name: Link benchmark targets
        run: cargo build --workspace --benches

  deny:
    # cargo-deny gates on RustSec advisories, banned/duplicated deps,
    # license policy, and source allowlists. Config lives in
    # `deny.toml` at the repo root. No Rust toolchain or build of the
    # workspace needed — cargo-deny only reads Cargo.lock.
    name: deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  typos:
    name: typos
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Verify path filtering
        run: test "${{ needs.changes.result }}" = "success"
      - uses: actions/checkout@v7
      # Pinned to a tagged release rather than `@master` so CI is
      # reproducible across re-runs and a silent upstream change
      # can't flip behavior. Bump when typos.dev cuts a new release.
      - uses: crate-ci/typos@v1.49.0

  machete:
    # Dependency hygiene is a real gate: a stale direct dependency expands
    # compile time, advisory surface, and the set of contracts maintainers
    # falsely believe a crate owns.
    name: machete
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Pinned to a tagged release rather than `@main` so CI is
      # reproducible. Bump when bnjbvr/cargo-machete cuts a new release.
      - uses: bnjbvr/cargo-machete@v0.9.2
