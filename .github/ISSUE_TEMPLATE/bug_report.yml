name: Bug report
description: Something in Lazybox does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Help → Send feedback…** in the app fills most of this in for you.
        A security problem does not go here: follow [SECURITY.md](https://github.com/AntoineToussaint/lazybox/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. A screenshot for anything visual.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: doctor
    attributes:
      label: lazybox doctor
      description: The output of `lazybox doctor`. Read it first; it can contain paths from your work.
      render: text
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Settings → About & updates shows it; from a clone, `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - make install (from source)
        - Disk image from a release
        - Homebrew
        - Dev or Working (working on Lazybox itself)
        - Linux Runner
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version (or Linux distribution)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        For a failed `make install`, the end of its output. Otherwise the relevant lines of
        `~/Library/Logs/Lazybox/runner.log` ([where the logs are](https://github.com/AntoineToussaint/lazybox/blob/main/docs/testers.md#how-to-report-a-problem)).
        Read them before you paste them.
      render: text
