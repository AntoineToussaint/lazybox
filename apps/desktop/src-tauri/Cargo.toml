[package]
name = "lazybox-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
bytes = "1"
chrono = "0.4"
futures-util = "0.3"
lazybox-config = { path = "../../../crates/config" }
lazybox-core = { path = "../../../crates/core" }
lazybox-gh = { path = "../../../crates/gh-provider" }
lazybox-ipc = { path = "../../../crates/ipc" }
lazybox-server = { path = "../../../crates/server" }
lazybox-tui-core = { path = "../../../crates/tui-core" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
which = "8"

[dev-dependencies]
lazybox-store = { path = "../../../crates/store" }
tempfile = "3"
