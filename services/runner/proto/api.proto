  string source_session_id = 1;
  // Completed native turn to include, or transcript cursor of a prompt to replace.
  oneof boundary {
    string after_turn_id = 2;
    uint64 before_prompt_cursor = 3;
  }
  // Provision isolated worktrees from the corresponding code checkpoint.
