message ChangedLineCounts { uint32 added = 1; uint32 removed = 2; }
message Commit { string id = 1; string subject = 2; int64 committed_at_unix = 3; }
// files are uncommitted changes. committed are the changes the branch's commits
// made since base, the commit the workspace started from; commits lists them.
message RepositoryChanges { string member = 1; string branch = 2; string head = 3; repeated ChangedFile files = 4; string error = 5; bool truncated = 6; string base = 7; repeated ChangedFile committed = 8; repeated Commit commits = 9; bool committed_truncated = 10; string committed_error = 11;
  // Local and remote-tracking branches, and the default branch (origin/HEAD, else main or master).
  repeated string branches = 12; string default_branch = 13;
  // The remote-tracking ref of the branch's last push (origin/<branch>), empty
  // when never pushed. ahead counts commits on HEAD that are not there yet.
  string upstream = 14; uint32 ahead = 15;
  // owner/name when origin is a GitHub repository, so the PR loop applies.
  string github_repository = 16; }
message WorkspaceChanges { repeated RepositoryChanges repositories = 1; }
