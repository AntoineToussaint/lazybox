[package]
name = "pilot-gh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pilot-auth = { workspace = true }
pilot-core = { workspace = true }
pilot-events = { workspace = true }
octocrab = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# `http` is the type plumbing octocrab uses for its low-level
# `_get_with_headers` API — we set the `If-Modified-Since` header
# directly so the notifications heartbeat can answer 304. Pin matches
# what octocrab 0.44 already depends on so there's no duplicate.
http = "1.4"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
