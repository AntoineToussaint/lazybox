[package]
name = "lazybox-e2e-channel"
description = "End-to-end encrypted channel (Noise/X25519) wrapping any async byte stream."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Only the ChaChaPoly + BLAKE2s + X25519 path is used (see NOISE_PARAMS);
# dropping snow's default `aes-gcm`/`sha2` features keeps aes-gcm, aes,
# ctr, ghash, and polyval out of the tree entirely.
[dependencies]
snow = { version = "0.10", default-features = false, features = [
    "use-chacha20poly1305",
    "use-blake2",
    "use-curve25519",
    "use-getrandom",
    "std",
] }
thiserror = { workspace = true }
tokio     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
