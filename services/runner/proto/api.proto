  // The same without the comments.
  string context_without_comments = 6;
}
message ResolveItemUrlRequest { string url = 1; }
message ItemWorkspaces {
  // The workspaces started from the item (their origin), newest first.
  repeated Collection workspaces = 1;
}
message ItemLink {
  Item item = 1;
  string collection_id = 2;
  // The conversation it came from or belongs to, when known.
  string session_id = 3;
  // origin (the workspace started from it), delivers (work it produced, a pull
  // request) or mentions (named in the conversation; listed, never tracked).
  string role = 4;
  // How Lazybox learned of it: started-from, branch, agent-output, cli or person.
  string source = 5;
  int64 linked_at_unix_millis = 6;
  // The workspace's name, kept for history once it is deleted.
  string collection_name = 7;
  bool collection_deleted = 8;
