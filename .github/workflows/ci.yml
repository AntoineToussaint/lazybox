# Per-change CI. It runs the same checks as the release catalog
# (`scripts/release-gates.json`, run by `make check-release` at
# staging), split into parallel jobs so a regression is caught on the PR that
# causes it instead of at release staging.
#
# | Job        | Runner       | Release gate it mirrors                         |
# | ---------- | ------------ | ----------------------------------------------- |
# | plan       | ubuntu-24.04 | reads the catalog; emits the UI shard matrix    |
# | go         | macos-15     | core: go vet, `make test`, race run,           |
# |            |              | then the launcher's `make test-environments`    |
# | go-linux   | ubuntu-24.04 | core on Linux: fmt-check, go vet, `make test`,  |
# |            |              | race run (the Runner on a Linux machine)        |
# | generated  | ubuntu-24.04 | core: `make check-generated` (Codefly + Buf)    |
# | typescript | ubuntu-24.04 | core: `make check-workspaces`                   |
# | desktop    | macos-15     | native: `make check-desktop`                    |
# | ui (N)     | ubuntu-24.04 | ui: every `scope: "ui"` gate, sharded           |
# | typos      | ubuntu-24.04 | spelling across the repository (typos.toml)     |
#
# The UI matrix is generated from the catalog (`release-gates.mjs shards`), so a
# gate added there runs here with no edit to this file. Live/real-provider tests
# are the catalog's `external` entries and are never selected.
#
# The Go suite runs on both: macOS, where the desktop's Runner runs, and Linux,
# where a Runner for remote use runs (REMOTE_RUNNERS.md). macOS only for what
# cannot run elsewhere: the launcher (Dev, Working) refuses other hosts, and
# the Tauri shell embeds WKWebView. The UI suites run on Linux: they
# drive Playwright against the fixture Runner, and their browsers make the page
# report macOS (scripts/fixtures/playwright.mjs). Run `make stage` on a Mac
# before a release: it runs every gate there, UI included.
#
# Not run here, with reasons, in RELEASE_GATES.md ("CI").

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs these same jobs as its gates (release.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Dev's installed LTS; package.json's engines floor is 24.
  NODE_VERSION: "26"
  # About 20 gates per Linux runner. More shards shorten the UI critical path
  # at the cost of additional copies of dependency and browser setup.
  UI_SHARDS: "6"

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan (release catalog)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.shards.outputs.ui }}
      playwright-image: ${{ steps.shards.outputs.playwright-image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Loading the catalog also fails when an npm `test:` script is not
      # classified, so an unadmitted test stops CI here, as it stops staging.
      - name: Shard the UI gates
        id: shards
        run: |
          node scripts/release-gates.mjs list release
          matrix="$(node scripts/release-gates.mjs shards ui "$UI_SHARDS")"
          echo "ui=$matrix" >> "$GITHUB_OUTPUT"
          version="$(node -p 'require("./package-lock.json").packages["node_modules/@playwright/test"].version')"
          echo "playwright-image=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  go:
    name: go (vet, test, race, launcher)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/runner/code/go.mod
          cache-dependency-path: services/runner/code/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      # Session-host and process tests skip without tmux; a skip here would be
      # coverage silently lost, so it is installed rather than optional.
      - name: Install tmux
        run: command -v tmux || brew install tmux
      # The Makefile defaults to one build job and one P for the shared dev
      # box; a runner is ours alone, so builds use every core.
      - name: Use every core for builds
        run: echo "GO_BUILD_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
      - name: Vet
        run: make check-go GOMAXPROCS="$GO_BUILD_JOBS"
      - name: Test (GOMAXPROCS = cores)
        run: make test GOMAXPROCS="$GO_BUILD_JOBS"
      # The packages that keep agents and commands alive across a Runner
      # restart, under the race detector (session hosts included, via GORACE),
      # on one P: the configuration the release gate runs everything in.
      - name: Race-check the restart packages (GOMAXPROCS=1)
        run: make test-outlive GOMAXPROCS=1
      # The launcher (environments, service, restart, gates): macOS-only, as
      # the launcher refuses other hosts. The race target installed npm deps.
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
          chromium-shell-only: 'true'
      - run: make test-environments
      - name: README and CONTRIBUTING name only what exists
        run: node scripts/export-check.mjs
      - name: Nothing private or secret in the tree
        run: node scripts/check-private.mjs

  # The Runner on a Linux machine: the same Go suite and race run as `go`, on
  # Linux. The tests that need systemd (a service whose stop kills its cgroup,
  # session hosts in scopes of their own) run when the runner's user manager
  # can start scopes, and say why they skip when it cannot.
  go-linux:
    name: go linux (vet, test, race)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/runner/code/go.mod
          cache-dependency-path: services/runner/code/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install tmux
        run: command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }
      # A user manager for this account, as a Linux host running the Runner
      # as a service has (lingering), so systemd-run --user --scope works.
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          uid="$(id -u)"
          for _ in $(seq 100); do test -S "/run/user/$uid/bus" && break; sleep 0.1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/$uid" systemd-run --user --scope --quiet true \
            && echo "systemd scopes: available" \
            || echo "::warning::systemd-run --user --scope fails here; the scope tests will skip"
      - name: Use every core for builds
        run: echo "GO_BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Format and vet
        run: make fmt-check check-go GOMAXPROCS="$GO_BUILD_JOBS"
      - name: Test (GOMAXPROCS = cores)
        run: make test GOMAXPROCS="$GO_BUILD_JOBS"
      - name: Race-check the restart packages (GOMAXPROCS=1)
        run: make test-outlive GOMAXPROCS=1

  generated:
    name: generated code (Codefly + Buf)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # A release whose `codefly sync` reproduces the committed output byte for
      # byte; the service agent (go-grpc 0.1.70) is pinned separately in
      # services/runner/service.codefly.yaml. Bump both deliberately.
      CODEFLY_VERSION: "0.1.212"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/runner/code/go.mod
          cache-dependency-path: services/runner/code/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Codefly
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="codefly_${CODEFLY_VERSION}_linux_amd64.tar.gz"
          gh release download "v${CODEFLY_VERSION}" --repo codefly-dev/cli \
            --pattern "$archive" --pattern checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          mkdir -p codefly-bin && tar -xzf "$archive" -C codefly-bin codefly
          echo "$PWD/codefly-bin" >> "$GITHUB_PATH"
      # `codefly sync service runner` downloads the pinned go-grpc agent and
      # generates inside its proto companion image (ghcr.io, public) through
      # the runner's Docker; `buf generate` then rebuilds the TypeScript.
      # check-generated fails if either output differs from the commit, then
      # runs buf lint and buf breaking against contracts/runner-v1.binpb.
      - name: Generated output is current; contract lint and compatibility
        run: make check-generated
      - name: Generation left no other change
        run: git diff --exit-code

  typescript:
    name: typescript (typecheck, client, worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      # The agent browser's Chromium (Playwright's headless shell) and its
      # system libraries: the browser-service tests launch it.
      - run: make deps
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
          chromium-shell-only: 'true'
      # Typecheck, workspace links, client and both workers' tests.
      - run: make check-workspaces

  desktop:
    name: desktop (Tauri fmt, test, clippy)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Save only from main: a PR restores main's cache (GitHub scopes
          # caches to the base branch) without filling the 10GB pool per PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      # fmt --check, the UI assets Tauri embeds, cargo test --locked,
      # clippy --locked -D warnings.
      - run: make check-desktop CARGO_BUILD_JOBS="$(sysctl -n hw.ncpu)"

  ui:
    name: ui ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-24.04
    # Includes the exact browsers and Ubuntu libraries used by the lockfile.
    # Installing system packages per shard can take longer than the tests.
    container:
      image: ${{ needs.plan.outputs.playwright-image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.ui) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The gate runner, not `npm run` directly: same env scrubbing, process
      # groups and per-gate deadlines as staging, and every gate in the shard
      # runs even after one fails. --retry-flaky runs a failed UI gate once
      # more: passing then, it is reported flaky (a warning, the job summary,
      # the receipt) rather than failing the build. Staging never retries.
      - name: Run ${{ matrix.gates }}
        env:
          GATES: ${{ matrix.gates }}
          SHARD: ${{ matrix.shard }}
        run: node scripts/release-gates.mjs run ui --only "$GATES" --report ".cache/gates-ui-$SHARD.json" --retry-flaky
      # The suites drive Playwright as a library and save screenshots (several
      # only on failure) to .cache and /tmp; they record no traces.
      - name: Upload screenshots and gate report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.shard }}
          path: |
            .cache/*.png
            .cache/gates-ui-*.json
            /tmp/lazybox-*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  typos:
    name: typos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Pinned to a tagged release so a silent upstream change cannot flip CI.
      - uses: crate-ci/typos@v1.50.3

  # One stable check name for branch protection: it fails unless every job
  # above passed.
  ci:
    name: ci
    if: always()
    needs: [plan, go, go-linux, generated, typescript, desktop, ui, typos]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r 'map(select(. != "success")) | length' <<<"$RESULTS")" = 0
