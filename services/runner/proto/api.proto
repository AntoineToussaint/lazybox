  bool keep_artifacts = 5;
}

// References are resolved inside the owned workspace on the Runner, never on the client.
message WorkspaceFileRequest { string collection_id = 1; string path = 2; }
message WorkspaceDirectoryEntry { string name = 1; string path = 2; bool directory = 3; }
message WorkspaceFile { string path = 1; string text = 2; bool truncated = 3; bool binary = 4; string version = 5; bool directory = 6; repeated WorkspaceDirectoryEntry entries = 7; }

message SaveWorkspaceFileRequest { string collection_id = 1; string path = 2; string text = 3; string expected_version = 4; }

// A fuzzy file finder over the workspace's repositories. Files Git ignores are
// left out; the index is bounded and positions index the matched characters of
// path in UTF-16 code units.
message SearchWorkspaceFilesRequest { string collection_id = 1; string query = 2; uint32 limit = 3; }
message WorkspaceFileMatch { string path = 1; repeated uint32 positions = 2; }
message WorkspaceFileSearch { repeated WorkspaceFileMatch matches = 1; bool truncated = 2; uint32 indexed = 3; }

// Where a file reference an agent wrote points: the path as given, under each
// repository, then by path suffix and file name. Several matches are a choice
// for the person, not an error.
message ResolveWorkspacePathRequest { string collection_id = 1; string path = 2; }
message WorkspacePathMatch { string path = 1; bool directory = 2; }
message WorkspacePathResolution { repeated WorkspacePathMatch matches = 1; bool exact = 2; bool truncated = 3; }

message DeleteConversationRequest { string session_id = 1; bool stop_sessions = 2; }
message DeleteConversationResponse {}

message RemoveRepositoryRequest { string repository_id = 1; string git_identity = 2; }

message GetRepositoryCatalogRequest { bool refresh = 1; }
message RepositoryCatalogEntry { string identity = 1; string name = 2; string repository_id = 3; }
message RepositoryCatalogSource { string id = 1; string state = 2; string detail = 3; int64 updated_at = 4; }
message RepositoryCatalog { repeated RepositoryCatalogEntry entries = 1; repeated RepositoryCatalogSource sources = 2; uint32 refresh_seconds = 3; }
message PrepareWorkspaceRequest {
  string request_key = 1; string collection_id = 2; string name = 3; repeated string repository_identities = 4;
  // The new workspace's branch, for every repository; empty keeps the Runner's default. Ignored when adding to a workspace.
  string branch = 5;
  // Adding to a workspace: the agent's request this answers. Once the
  // repositories are added, the request is resolved as added and the agent told.
  string repository_request_id = 6;
  // A new workspace started from a work item: recorded as its origin.
  ItemRef item = 7;
  // The branch each repository starts from, by repository identity
  // (WORKSPACES.md, "Start from"): fetched from origin first, then the new
  // branch starts at origin/<branch>. An omitted repository or an empty
  // branch uses origin's default. Explicit branches are offered in Recent.
  map<string, string> start_from = 8;
}
message ListRepositoryBranchesRequest {
  string repository_identity = 1;
  // Ask origin for its branches now (one ls-remote, nothing fetched); false
  // answers at once from what the Runner already has, without the network.
  bool remote = 2;
}
message RepositoryBranch {
  string name = 1;
  string commit = 2;
  // Its last commit's time, when the Runner has that commit; 0 otherwise.
  int64 committed_at_unix_millis = 3;
}
// What a repository's "Start from" choice offers.
message RepositoryBranches {
  string repository_identity = 1;
  // Origin's default branch: as origin names it (remote), else as last fetched; empty when unknown.
  string default_branch = 2;
  // Legacy last choice. New Runners leave this empty and use the default
  // branch unless a request explicitly selects a different starting point.
  string start_from = 3;
  // Branches chosen lately, newest first.
  repeated string recent = 4;
  // Origin's branches, most recently committed first, then by name: from
  // origin (remote) or as last fetched.
  repeated RepositoryBranch branches = 5;
  // Origin could not be asked: the branches are the last known ones.
  string error = 6;
  // The branches came from origin just now.
  bool remote = 7;
  // The repository is not on this Runner yet: no branches until it is
  // prepared; a typed branch name is still checked then.
  bool unregistered = 8;
}
message WorkspacePreparation {
  string identity = 1; string message = 2; Collection collection = 3;
  // Sent just before the stream fails because this repository's history
  // changed on GitHub (RefreshRepositoryIdentity is the way forward).
  RepositoryReplacement replaced = 4;
}
message RepositoryReplacement {
  string identity = 1;
  string name = 2;
  // Lazybox has a copy of the old history (else only its listing is old).
  bool has_copy = 3;
}
message RefreshRepositoryIdentityRequest {
  // github:owner/name, as the repository catalog has it.
  string identity = 1;
  // Replace the copy; without it, only say what that changes.
  bool confirm = 2;
}
message RepositoryIdentityRefresh {
  string identity = 1;
  // owner/name as GitHub has it now.
  string name = 2;
  // "replaced": the name now belongs to another GitHub repository than
  // Lazybox's copy or listing. Empty: the same repository.
  string reason = 3;
  bool has_copy = 4;
  // Workspaces made from the copy being replaced: they keep their worktrees.
  repeated string workspaces = 5;
  // Done (confirm), and the new copy's registration.
  bool replaced = 6;
  string repository_id = 7;
}

message Snippet { string key = 1; string category = 2; string description = 3; string body = 4; string origin = 5; repeated string next = 6; }
message SnippetCatalog { repeated Snippet snippets = 1; }

// Processes the Runner hosts so they outlive it (see SESSION_HOSTS.md).
message ListProcessesRequest {}
message StopProcessRequest { string id = 1; }
message CleanUpOrphanProcessesRequest {}
message ProcessUsage {
  // Percent of one core, summed over the host and every process under it.
  double cpu_percent = 1;
  uint64 memory_bytes = 2;
  uint32 process_count = 3;
}
message HostedProcess {
  // The session host's id.
  string id = 1;
  // "agent", "command" or "terminal".
  string kind = 2;
  // "sessionhost" or "tmux": what started this process's host; "run" for a
  // `lazybox run` that went on in the background, which has no session host
  // (its id is "run:" and the command id).
  string backend = 3;
  // "running", "starting", "exited" or "unreachable".
  string state = 4;
  // This Runner holds the host. A host no Runner holds is an orphan.
  bool attached = 5;
  int32 host_pid = 6;
  int32 program_pid = 7;
  int64 uptime_seconds = 8;
  string label = 9;
  string workspace_id = 10;
  string workspace_name = 11;
  // The conversation attempt (session) an agent or command belongs to.
  string session_id = 12;
  string conversation_title = 13;
  string provider = 14;
  string command_id = 15;
  string terminal_id = 16;
  // Attaches a terminal to a tmux-hosted process's window; empty otherwise.
  string attach_command = 17;
  // Absent when the process table could not be read.
  ProcessUsage usage = 18;
  // TCP ports a command's processes listen on.
  repeated uint32 ports = 19;
}
message ProcessHosting {
  // The backend new processes use, and the Runner configuration's default.
  string selected = 1;
  string configured = 2;
  // tmux -V when tmux can host processes; otherwise why not.
  string tmux_version = 3;
  string tmux_problem = 4;
  // Why the last process meant for tmux runs in a session host instead.
  string fallback = 5;
}
message ProcessInventory {
  repeated HostedProcess processes = 1;
  ProcessHosting hosting = 2;
  // Hosts that could not be listed, for example an unreadable directory.
  string problem = 3;
}
message CleanUpOrphanProcessesResponse {
  uint32 stopped = 1;
  // Hosts the sweep left alone because it could not confirm their state.
  string problem = 2;
  ProcessInventory inventory = 3;
}

message OrchestrationProcessRequest {
  // Workspace whose repositories' committed .lazybox/process.yaml is read;
  // empty resolves the user's process file over the presets alone.
  string collection_id = 1;
  // The workspace repository (id or name) whose process file applies. Empty
  // applies the only one that has a file; with several, none applies and
  // notice says so.
  string repository = 2;
  // Tasks in the mission, which selects the default preset; 0 without one.
  uint32 tasks = 3;
}
message OrchestrationProcessLayer {
  // preset, user or repository.
  string kind = 1;
  string source = 2;
  // sha256 of the file as read: what a person approves before first use.
  string digest = 3;
}
message OrchestrationProcessIssue {
  // error or warning.
  string severity = 1;
  // Key path in the effective process, such as roles.worker.permission.
  string path = 2;
  string message = 3;
  // The layer and file that wrote the value, when known.
  string layer = 4;
  string source = 5;
  uint32 line = 6;
  uint32 column = 7;
}
message OrchestrationProcessCandidate {
  string repository_id = 1;
  string name = 2;
  string path = 3;
  string digest = 4;
}
message OrchestrationProcess {
  string preset = 1;
  bool valid = 2;
  // The effective process as a process file, and as JSON in the shape of the
  // published schema (process.v1.json). Empty when a layer cannot be parsed.
  string yaml = 3;
  string json = 4;
  // sha256 of the effective process: what a mission pins.
  string digest = 5;
  // Lowest first: preset, user, repository.
  repeated OrchestrationProcessLayer layers = 6;
  repeated OrchestrationProcessIssue issues = 7;
  // Workspace repositories that carry a process file.
  repeated OrchestrationProcessCandidate candidates = 8;
  // Why no repository file applies although some exist, or empty.
  string notice = 9;
  // The user's ceiling as JSON (the schema's Ceiling).
  string ceiling_json = 10;
  // Where the user's process file is read from (it may not exist).
  string user_file = 11;
}
message ExplainOrchestrationProcessRequest {
  OrchestrationProcessRequest process = 1;
  // An event type such as task.reported, or timer or stall.
  string event_type = 2;
}
message OrchestrationReaction {
  // rule, trigger or notification.
  string kind = 1;
  // Where it is in the process: rules[2], roles.coordinator.triggers[0].
  string path = 2;
  // CEL condition; empty fires always.
  string condition = 3;
  // The role it wakes or acts on, with that role's permission and scopes.
  string role = 4;
  string permission = 5;
  repeated string scopes = 6;
  // A person starts the role (manual trigger).
  bool manual = 7;
  // A rule's count limit per subject; 0 without one.
  uint32 limit = 8;
  // Where a notification goes.
  repeated string to = 9;
  // Event types it may cause.
  repeated string emits = 10;
  string summary = 11;
}
message OrchestrationProcessExplanation {
  string event_type = 1;
  // In firing order: rules, then role triggers, then notifications.
  repeated OrchestrationReaction reactions = 2;
  // The same, written for a person.
  string text = 3;
  // The effective process explained, and its problems.
  string digest = 4;
  bool valid = 5;
  repeated OrchestrationProcessIssue issues = 6;
}

// Inline review comments (see GITHUB.md, "Review comments").
message ReviewComment {
  string id = 1;
  string member = 2;
  // Relative to the member's worktree.
  string path = 3;
  // "new": the file as changed (added and unchanged lines); "old": lines the
  // change removed.
  string side = 4;
  // 1-based and inclusive, numbered as that side was when the comment was made.
  uint32 start_line = 5;
  uint32 end_line = 6;
  // The lines as the person saw them, and their content hash.
  repeated string snippet = 7;
  string hash = 8;
  // Markdown.
  string body = 9;
  // The member's commit when the comment was made, and the diff it was read
  // in: view is "uncommitted", "staged" or "branch"; base is what a branch
  // diff compared with (a branch, or the workspace's start commit).
  string head = 10;
  string view = 11;
  string base = 12;
  int64 created_at_unix = 13;
  int64 updated_at_unix = 14;
  // "open", "sent", "resolved" or "wont_fix".
  string disposition = 15;
  // The conversation it was put in for the agent, and the commit then.
  string sent_to = 16;
  string sent_to_title = 17;
  int64 sent_at_unix = 18;
  string sent_head = 19;
  // The commit that changed the lines when the Runner resolved it on its own,
  // and a sentence saying so.
  string resolved_by = 20;
  string note = 21;
  // Computed on every read against the working tree: "current", "moved"
  // (re-anchored to the same lines elsewhere), "outdated" or "unknown".
  string freshness = 22;
  uint32 current_start_line = 23;
  uint32 current_end_line = 24;
  string freshness_reason = 25;
  // Who wrote it: "" for the person, "agent" for a reviewer agent's finding.
  string author = 26;
  // A finding's reviewer, as people name it ("Codex"), and its conversation.
  string author_label = 27;
  string author_session_id = 28;
  // A finding's severity: "blocker", "major", "minor" or "nit"; "" for a
  // person's comment.
  string severity = 29;
  // A finding's one-line title.
  string title = 30;
  // The agent review the finding belongs to (ReviewRun.id).
  string review_id = 31;
  // The finding's stable key in its review: filing it again updates it.
  string finding_key = 32;
  // The review round it was filed in, and how many later rounds found it
  // still open (two for a blocker stops the loop: it is stuck).
  uint32 round = 33;
  uint32 still_open_rounds = 34;
}
// One round of a review loop: the reviewer's pass, from the brief or a
// re-review, and what it found.
message ReviewRound {
  uint32 number = 1;
  // "start", or "author_turn" (the author's turn changed files after findings).
  string trigger = 2;
  // The author's turn this round re-reviews, if any.
  uint32 author_turn = 3;
  int64 started_at_unix = 4;
  int64 ended_at_unix = 5;
  uint32 filed = 6;
  uint32 resolved = 7;
  uint32 still_open = 8;
  // Open blockers when the round ended.
  uint32 blockers = 9;
}
// What happened in a review, in order: rounds, findings, who said what.
message ReviewTimelineEntry {
  int64 at_unix = 1;
  // round_started, round_ended, filed, resolved, reopened, sent, fixing,
  // asked, answered, paused, resumed, mode, stopped, escalated.
  string kind = 2;
  // Who: the reviewer's or author's name, "You" or "Lazybox".
  string actor = 3;
  string text = 4;
  string finding_id = 5;
  uint32 round = 6;
}
// One agent review: a reviewer conversation started on a scope of another
// conversation's work, and what it found.
message ReviewRun {
  string id = 1;
  string collection_id = 2;
  // The read-only reviewer conversation, its title and the agent's name.
  string reviewer_session_id = 3;
  string reviewer_title = 4;
  string reviewer_label = 5;
  string reviewer_provider = 6;
  string reviewer_profile_id = 7;
  // The conversation whose work is reviewed ("the author").
  string source_session_id = 8;
  string source_title = 9;
  string source_label = 10;
  // "changes" (a branch or uncommitted diff), "turn" (one agent turn's
  // checkpoints) or "pr" (a pull request); its label, as in the title.
  string scope = 11;
  string scope_label = 12;
  uint32 turn = 13;
  string compare = 14;
  string pull_request_url = 15;
  // "running" while the reviewer works, "done" once it ended its turn,
  // "failed" when it could not, "cancelled" when the person cancelled the
  // review, "stopped" when they ended its reviewer by hand while it reviewed.
  string state = 16;
  // A sentence about the state, for the person.
  string detail = 17;
  int64 created_at_unix = 18;
  int64 updated_at_unix = 19;
  // Findings by severity, open ones only.
  uint32 blockers = 20;
  uint32 majors = 21;
  uint32 minors = 22;
  uint32 nits = 23;
  // The mission task the source conversation is an attempt on, if any.
  string mission_id = 24;
  string task_id = 25;
  // The author's provider ("claude" or "codex").
  string source_provider = 26;
  // The loop: "ask" (you send findings between rounds), "auto" (Lazybox
  // sends them) or "off" (one pass). Re-reviews follow an author turn that
  // changed files after findings were sent, up to max_rounds.
  string loop = 27;
  uint32 max_rounds = 28;
  uint32 round = 29;
  // reviewing (the reviewer works), triage (findings wait for you), fixing
  // (findings sent; the author's turn), done.
  string phase = 30;
  bool paused = 31;
  // Why the loop ended: clean, max_rounds, stuck, error, stopped, taken_over,
  // cancelled (CancelReview), ended (the person ended the reviewer by hand:
  // Stop, End session, Delete); "" while it runs.
  string stop_reason = 32;
  repeated ReviewRound rounds = 33;
  repeated ReviewTimelineEntry timeline = 34;
  // Why the reviewer is not the one asked for, in one quiet sentence ("Codex
  // is not available, so a fresh Claude conversation reviews."); "" when it is.
  string fallback = 35;
  // The focus the person gave (`/review <focus>`), if any.
  string focus = 36;
  // Who ended the review by hand ("You"), with state "cancelled" (it was
  // cancelled) or "stopped" (its reviewer was stopped, ended or deleted while
  // it reviewed), and when; empty and 0 otherwise.
  string stopped_by = 37;
  int64 stopped_at_unix = 38;
  // pr: the workspace repository whose pull request is reviewed, so the
  // same review can be started again.
  string member = 39;
  string template_id = 40;
  string result_artifact_id = 41;
  repeated ReviewVerificationCheck verification = 42;
}
message WorkspaceReview {
  repeated ReviewComment comments = 1;
  // Resolve a sent comment when a later commit changes its lines.
  bool auto_resolve = 2;
  // The comment an add created.
  string added_id = 3;
  // The workspace's agent reviews, newest first.
  repeated ReviewRun runs = 4;
}
message StartReviewRequest {
  string collection_id = 1;
  // The conversation whose work is reviewed.
  string source_session_id = 2;
  // "changes", "turn" or "pr".
  string scope = 3;
  // changes: the ref the branch is compared with ("" is the workspace start,
  // ":uncommitted" uncommitted work only).
  string compare = 4;
  // turn: the source conversation's turn number.
  uint32 turn = 5;
  // pr: the workspace repository whose pull request is reviewed.
  string member = 6;
  // The reviewer: a subscription (profile id), else a provider ("claude" or
  // "codex"), else the default reviewer setting (the other provider).
  string profile_id = 7;
  string provider = 8;
  // What the person asked the reviewer to look at in particular
  // (`/review <focus>`); added to the brief. At most 2 KiB.
  string focus = 9;
  // The model the reviewer runs on; "" is the setting's (fixed), else its
  // agent's default.
  string model = 10;
  // A built-in review template. Empty preserves the legacy review entry points.
  string template_id = 11;
  string request_key = 12;
}
message StartReviewResponse {
  ReviewRun run = 1;
  Session session = 2;
}
message AddReviewFindingRequest {
  // The reviewer's own execution.
  string session_id = 1;
  // "member/path", relative to the workspace root, or a path in the only member.
  string file = 2;
  uint32 start_line = 3;
  uint32 end_line = 4;
  // blocker, major, minor or nit (also critical, high, medium, low, info).
  string severity = 5;
  string title = 6;
  // Markdown: what is wrong and what to do about it.
  string body = 7;
  // A stable key; empty derives one from the file, line and title.
  string key = 8;
}
message ReviewFinding {
  ReviewComment finding = 1;
  // True when the key matched a finding already filed, which was updated.
  bool updated = 2;
}
message ListReviewFindingsRequest { string session_id = 1; }
message SetReviewFindingStateRequest {
  string session_id = 1;
  string finding_id = 2;
  // "resolved" or "open" (still open).
  string state = 3;
  string note = 4;
}
message UpdateReviewRunRequest {
  string collection_id = 1;
  string review_id = 2;
  // pause, resume, stop, take_over or loop (with loop and max_rounds).
  string action = 3;
  string loop = 4;
  uint32 max_rounds = 5;
}
message CancelReviewRequest {
  // The review's workspace; "" finds the workspace that keeps review_id.
  string collection_id = 1;
  string review_id = 2;
}
message AskAgentRequest {
  // The asking execution.
  string session_id = 1;
  // "author", "reviewer", or the other conversation's id.
  string to = 2;
  string question = 3;
  // How long the call waits for the reply (bounded); 0 returns at once.
  uint32 timeout_seconds = 4;
}
message WaitAgentAskRequest { string ask_id = 1; uint32 timeout_seconds = 2; }
message SpawnAgentRequest {
  // The orchestrator's execution.
  string session_id = 1;
  // Idempotency: a retried spawn starts no second agent.
  string operation_id = 2;
  // A new task's title and brief (its first message), or an existing task.
  string title = 3;
  string brief = 4;
  string task_id = 5;
  // Within the grant's ceiling; empty: the orchestrator's own subscription
  // and model, and the narrower of its permission and the ceiling.
  string profile_id = 6;
  string model = 7;
  string permission = 8;
  // "same" (default: the orchestrator's workspace, shared files) or "new"
  // (a workspace of its own: its repositories on new branches started from
  // the orchestrator's).
  string workspace = 9;
  // A label: worker (default), reviewer, researcher.
  string role = 10;
}
message AgentLineageRequest { string session_id = 1; }
message AgentChild {
  string conversation_id = 1;
  // The child's latest session.
  string session_id = 2;
  string title = 3;
  string task_id = 4;
  string task_title = 5;
  // The task's derived status (working, needs_you, claimed_done, done).
  string task_status = 6;
  string collection_id = 7;
  string workspace_name = 8;
  string profile_id = 9;
  string model = 10;
  string permission = 11;
  string role = 12;
  // running, waiting (for the person), idle, closed or missing.
  string live = 13;
  string live_detail = 14;
  // The child reported its task; report is what it said.
  bool reported = 15;
  string report = 16;
  // The tail of its latest message.
  string last_message = 17;
  int64 started_at_unix_millis = 18;
  // The attempt ended (stopped, deleted).
  bool ended = 19;
  string outcome = 20;
  // "parent" for the caller's own parent, else "child".
  string relation = 21;
  // What its conversation cost so far, and its plan estimate.
  double cost_usd = 22;
  double estimate_usd = 23;
}
message AgentLineageEvent {
  uint64 seq = 1;
  int64 at_unix_millis = 2;
  string type = 3;
  string conversation_id = 4;
  string summary = 5;
}
message AgentLineage {
  string mission_id = 1;
  string mission_title = 2;
  // The caller's own grant, when it orchestrates.
  MissionGrant grant = 3;
  // The caller's parent, when an orchestrator started it.
  AgentChild parent = 4;
  repeated AgentChild children = 5;
  // The mission log's cursor: wait and watch continue after it.
  uint64 seq = 6;
  // WaitAgents: what happened in the lineage after after_seq, oldest first.
  repeated AgentLineageEvent events = 7;
  // WaitAgents: the condition held (else the wait timed out); why, in words.
  bool matched = 8;
  string reason = 9;
  // SpawnAgent: the child just started.
  AgentChild spawned = 10;
  // The caller's newest plan: what it proposed and, once approved, the task each entry became.
  MissionPlan plan = 11;
  // The caller's grant's tree: spent and reserved against its cap (also on grant).
  double spent_usd = 12;
  double reserved_usd = 13;
}
message SendAgentMessageRequest {
  string session_id = 1;
  // "parent", or a child: its conversation id, session id or title.
  string to = 2;
  string text = 3;
  string operation_id = 4;
}
message AgentMessageReceipt {
  string id = 1;
  string to_conversation_id = 2;
  string to_label = 3;
  // queued (the receiver is in a turn) or delivered.
  string delivery = 4;
}
message WaitAgentsRequest {
  string session_id = 1;
  // Children (conversation id, session id or title), or "parent"; empty: every live child.
  repeated string targets = 2;
  // idle (its turn ended), needs-input (it waits for the person), reported,
  // closed, settled (any of these: the default) or event (anything new).
  string until = 3;
  // Every target must hold (the default), or any one.
  bool any = 4;
  uint32 timeout_seconds = 5;
  uint64 after_seq = 6;
}
message StopChildAgentRequest {
  string session_id = 1;
  string target = 2;
  // End the conversation and its attempt, not only its turn.
  bool end = 3;
  string reason = 4;
}
message ReportAgentTaskRequest { string session_id = 1; string summary = 2; }
message AgentAsk {
  string id = 1;
  string review_id = 2;
  // pending, answered or expired.
  string state = 3;
  string question = 4;
  string answer = 5;
  string asker_label = 6;
  string answerer_label = 7;
  string asker_session_id = 8;
  string answerer_session_id = 9;
  int64 created_at_unix = 10;
  int64 answered_at_unix = 11;
}
message ReviewFindings {
  ReviewRun run = 1;
  repeated ReviewComment findings = 2;
}
message ListReviewCommentsRequest { string collection_id = 1; }
message AddReviewCommentRequest {
  string collection_id = 1;
  string member = 2;
  string path = 3;
  string side = 4;
  uint32 start_line = 5;
  repeated string snippet = 6;
  string body = 7;
  string view = 8;
  string base = 9;
}
message EditReviewCommentRequest { string collection_id = 1; string id = 2; string body = 3; }
message DeleteReviewCommentRequest { string collection_id = 1; string id = 2; }
message SetReviewDispositionRequest {
  string collection_id = 1;
  repeated string ids = 2;
  string disposition = 3;
  // With "sent": the conversation whose message box received them.
  string session_id = 4;
  string session_title = 5;
  // With "dismissed": why, for the record.
  string note = 6;
  // With "sent": end and archive each reviewer whose review is over and
  // whose findings are all sent or dismissed (AgentType.close_when_delivered).
  bool close_reviewers = 7;
}
message SetReviewAutoResolveRequest { string collection_id = 1; bool enabled = 2; }
message TurnCheckpointsRequest { string session_id = 1; }
// One repository's checkpoint at a point of the conversation.
message RepositoryCheckpoint {
  string member = 1;
  string commit = 2;
  string branch = 3;
  // Untracked files left out (too large, too many, nested repositories).
  repeated string skipped = 4;
  uint32 skipped_count = 5;
  // Why this repository could not be checkpointed; empty when it was.
  string error = 6;
}
message TurnCheckpoint {
  // 1-based, numbered across the whole conversation, resumes included.
  uint32 turn = 1;
  // The message that started the turn.
  string operation_id = 2;
  string prompt = 3;
  int64 started_at_unix_millis = 4;
  // 0 while the turn is running.
  int64 ended_at_unix_millis = 5;
  // What the turn changed, before → after, across repositories.
  uint32 files = 6;
  uint32 additions = 7;
  uint32 deletions = 8;
  repeated RepositoryCheckpoint before = 9;
}
message CodeRevert {
  string id = 1;
  // revert, or undo (of the revert named by undo_of).
  string kind = 2;
  // The turn whose start the files were reverted to.
  uint32 turn = 3;
  string undo_of = 4;
  // The undo that undid this revert; empty while it can still be undone.
  string undone_by = 5;
  int64 at_unix_millis = 6;
  // Files written or deleted.
  uint32 files = 7;
  // Files or repositories that could not be restored, said plainly.
  repeated string problems = 8;
}
message TurnCheckpoints {
  repeated TurnCheckpoint turns = 1;
  repeated CodeRevert reverts = 2;
  // A note for the agent waits for the next message.
  bool note_pending = 3;
}
message TurnChangesRequest { string session_id = 1; uint32 turn = 2; }
message TurnFile {
  string path = 1;
  string original_path = 2;
  // A added, M modified, D deleted, R renamed, T type changed.
  string status = 3;
  uint32 additions = 4;
  uint32 deletions = 5;
  bool binary = 6;
}
message TurnRepositoryChanges {
  string member = 1;
  repeated TurnFile files = 2;
  bool truncated = 3;
  string error = 4;
}
message TurnChanges {
  repeated TurnRepositoryChanges repositories = 1;
  // The turn is still running: its changes so far, against the files now.
  bool in_progress = 2;
}
message TurnDiffRequest {
  string session_id = 1; uint32 turn = 2; string member = 3; string path = 4;
  // A rename's source path.
  string original_path = 5;
}
message RevertCodeRequest { string session_id = 1; uint32 turn = 2; }
message RevertRepositoryPreview {
  string member = 1;
  // From the revert's side: A recreated, D deleted, M put back as it was.
  repeated TurnFile files = 2;
  bool truncated = 3;
  // Commits made since the checkpoint. They stay on the branch.
  uint32 commits_since = 4;
  string branch_then = 5;
  string branch_now = 6;
  // Why this repository will be left as it is.
  string error = 7;
}
message RevertCodePreview {
  repeated RevertRepositoryPreview repositories = 1;
  // Why the revert would be refused now (an agent is working); empty when it would not.
  string blocked = 2;
}
message UndoRevertCodeRequest { string session_id = 1; string revert_id = 2; }
// The workspace runtime (WORKSPACE_RUNTIME.md).
message WorkspaceRuntimeRequest { string collection_id = 1; }
// The workspace's port block: LAZYBOX_PORT_i is base + i, LAZYBOX_PORT is
// LAZYBOX_PORT_0 unless an action picks another port of the block.
message WorkspacePorts { uint32 base = 1; uint32 count = 2; }
// One repository's runtime configuration, as committed.
message WorkspaceScriptSource {
  // The workspace member (its folder) and its repository.
  string member = 1;
  string repository_id = 2;
  // ".lazybox/workspace.yaml" when the member has one, else "".
  string path = 3;
  // Why the file could not be used, with its line; nothing from it runs.
  string error = 4;
  // "none" (nothing committed), "approved", "required" (never approved) or
  // "changed" (differs from every version approved before).
  string approval = 5;
  // What ApproveWorkspaceScripts must name: the hash of what is shown.
  string hash = 6;
  // The file itself, for review.
  string content = 7;
  // Entries that differ from the last approved version: "setup", "archive",
  // "files", "env" or "action:<name>".
  repeated string changed = 8;
  // Settings > Workspaces adds or replaces entries for this repository.
  bool overridden = 9;
}
message WorkspaceRunState {
  // "idle", "running", "stopping", "succeeded", "failed" or "stopped".
  string state = 1;
  string command_id = 2;
  optional int32 exit_code = 3;
  string signal = 4;
  string error = 5;
  int64 started_at_unix_millis = 6;
  // The output's last line, for a status at a glance.
  string last_line = 7;
}
message WorkspaceAction {
  // "<member>/<name>": what Start/StopWorkspaceAction take.
  string key = 1;
  string member = 2;
  string name = 3;
  string run = 4;
  string cwd = 5;
  bool default = 6;
  // false: starting it stops the same action in every other workspace.
  bool concurrent = 7;
  // Where it serves, with LAZYBOX_PORT resolved; "" when it does not serve.
  string url = 8;
  // Its LAZYBOX_PORT; 0 when the workspace has no port block.
  uint32 port = 9;
  // "repository" (committed, needs approval) or "settings" (yours).
  string source = 10;
  // Why it cannot start now, e.g. its scripts await approval; "" when it can.
  string blocked = 11;
  WorkspaceRunState run_state = 12;
  // Other workspaces where this repository's action of the same name runs.
  repeated string running_elsewhere = 13;
}
message WorkspaceSetup {
  string member = 1;
  string run = 2;
  string source = 3;
  // The scripts await approval: setup has not run.
  bool pending_approval = 4;
  WorkspaceRunState run_state = 5;
  // Files copied from the source checkout into the worktree, and listed
  // files the source checkout does not have.
  repeated string copied_files = 6;
  repeated string missing_files = 7;
}
message WorkspaceRuntime {
  string collection_id = 1;
  WorkspacePorts ports = 2;
  // Why no port block could be allocated; actions still run without one.
  string ports_error = 3;
  repeated WorkspaceScriptSource sources = 4;
  repeated WorkspaceAction actions = 5;
  repeated WorkspaceSetup setups = 6;
  // The action Run starts: Settings first, then the first `default: true`,
  // then the first action.
  string default_action = 7;
}
message ApproveWorkspaceScriptsRequest {
  string collection_id = 1;
  string member = 2;
  // The hash the person reviewed; a file changed since is refused.
  string hash = 3;
  // Run the member's setup once approved, if it has not succeeded yet.
  bool run_setup = 4;
}
message WorkspaceActionRequest {
  string collection_id = 1;
  // WorkspaceAction.key.
  string action = 2;
  // Start: stop a running instance first. Ignored by Stop.
  bool restart = 3;
}
message StoppedElsewhere { string collection_id = 1; string workspace_name = 2; string action = 3; }
message WorkspaceActionResult {
  WorkspaceRuntime runtime = 1;
  // A non-concurrent action stopped in other workspaces to start here.
  repeated StoppedElsewhere stopped_elsewhere = 2;
}
message RunWorkspaceSetupRequest { string collection_id = 1; string member = 2; }
// Your own runtime settings, kept on this Runner and never committed.
message RepositoryRuntimeOverride {
  string repository_id = 1;
  // Shown name; ignored on save.
  string name = 2;
  // YAML in the same schema as .lazybox/workspace.yaml. Its entries add to or
  // replace the repository's, and run without approval: you wrote them.
  string config = 3;
  // The action Run starts in this repository's workspaces ("<name>").
  string default_action = 4;
  // Never run this repository's setup automatically.
  bool skip_setup = 5;
  // Why config was refused, on read.
  string error = 6;
}
message WorkspaceRuntimeSettings {
  uint64 revision = 1;
  // Port blocks are allocated in [port_range_start, port_range_end].
  uint32 port_range_start = 2;
  uint32 port_range_end = 3;
  repeated RepositoryRuntimeOverride repositories = 4;
}
message GetRemoteAccessRequest {}
message SetRemoteAccessRequest {
  // Serve the device gateway to this tailnet over HTTPS (never Funnel).
  bool tailscale = 1;
}
message RemoteAccess {
  // The device gateway on this machine (loopback only). Empty when it is not running.
  string local_url = 1;
  // What a phone opens: the gateway as another device reaches it. Empty while
  // no route reaches this Runner from another device.
  string phone_url = 2;
  TailscaleAccess tailscale = 3;
  // Why the gateway or the phone app is unavailable, if it is.
  string problem = 4;
}
message TailscaleAccess {
  // not_installed, not_running, needs_login, https_disabled, available,
  // serving, conflict (another service owns the HTTPS port), failed.
  string state = 1;
  // This machine's tailnet name, e.g. laptop.example.ts.net.
  string dns_name = 2;
  uint32 https_port = 3;
  // The owner turned the route on; it is restored when the Runner starts.
  bool enabled = 4;
  string detail = 5;
}
message BeginDevicePairingRequest {
  // read is always granted; respond and start are optional.
  repeated string grants = 1;
}
message DevicePairingRequest { string pairing_id = 1; }
message DevicePairing {
  string id = 1;
  // pending, paired, expired, cancelled, failed.
  string state = 2;
  // What the phone opens (the QR code). Only BeginDevicePairing returns it:
  // its fragment holds the one-time secret, which the Runner keeps only hashed.
  string url = 3;
  int64 expires_at_unix_millis = 4;
  repeated string grants = 5;
  // The device the offer paired.
  Device device = 6;
}
message Device {
  string id = 1;
  string name = 2;
  repeated string grants = 3;
  int64 paired_at_unix_millis = 4;
  int64 last_seen_at_unix_millis = 5;
  // A short digest of the device's key; the phone shows the same one.
  string fingerprint = 6;
  // Its push notifications, without the Runner's key.
  PushSettings push = 7;
}
message ListDevicesRequest {}
message ListDevicesResponse { repeated Device devices = 1; }
message RevokeDeviceRequest { string device_id = 1; }
message GetPushSettingsRequest {}
// A browser's push subscription, as PushSubscription.toJSON() gives it.
message PushSubscription {
  // The push service URL. Only Apple's, Google's, Mozilla's and Microsoft's
  // push services are accepted: the Runner posts to it.
  string endpoint = 1;
  // The browser's P-256 public key and auth secret, base64url.
  string p256dh = 2;
  string auth = 3;
}
message PushPreferences {
  bool needs_input = 1;
  bool failed = 2;
  bool review = 3;
  // Quiet hours in the phone's time zone, "HH:MM"; both empty for none.
  string quiet_start = 4;
  string quiet_end = 5;
  // An IANA time zone, e.g. Europe/Paris.
  string time_zone = 6;
}
message PushSettings {
  // The Runner's VAPID public key (an uncompressed P-256 point, base64url):
  // the phone's applicationServerKey. Only a phone's own call returns it.
  string application_server_key = 1;
  bool subscribed = 2;
  PushPreferences preferences = 3;
  // The push service's host, e.g. web.push.apple.com.
  string service = 4;
  int64 last_sent_at_unix_millis = 5;
  // Why the last delivery failed, if it did.
  string last_error = 6;
}
message SetPushSettingsRequest {
  // Replaces the phone's subscription.
  PushSubscription subscription = 1;
  // Removes the subscription: notifications off on this phone.
  bool unsubscribe = 2;
  // Absent keeps the current preferences.
  PushPreferences preferences = 3;
}
message SendTestPushRequest {
  // The owner names a device; a phone may only test itself (empty or its own id).
  string device_id = 1;
}
message SendTestPushResponse { PushSettings push = 1; }
// Missions. Statuses: ready, blocked, working, needs_you, changes_requested,
// claimed_done, done, failed, canceled (verifying is reserved). Trust:
// claimed (said so), observed (the Runner saw the exit status or process),
// verified (checks passed on the newest head), accepted (a person, at a gate).
message ListMissionsRequest {}
message ListMissionsResponse { repeated Mission missions = 1; }
message GetMissionRequest {
  string mission_id = 1;
  // Also refresh the pull requests of live attempts (at most once a minute per
  // repository); the result arrives as evidence on a later read.
  bool refresh_evidence = 2;
}
message CreateMissionRequest { string request_key = 1; string title = 2; string brief = 3; }
message UpdateMissionRequest {
  string mission_id = 1;
  // Idempotency: a retried change with the same id is not applied twice.
  string operation_id = 2;
  oneof change {
    MissionEdit edit = 3;
    MissionCancel cancel = 4;
    GoalCreate add_goal = 5;
    TaskCreate add_task = 6;
    TaskEdit edit_task = 7;
    TaskCancel cancel_task = 8;
    TaskAssign assign = 9;
    TaskReport report = 10;
    GateDecision accept = 11;
    GateDecision reject = 12;
    // The person lets one conversation run agents for this mission, and
    // takes that back. Never an agent's: UpdateMission is owner only.
    OrchestratorGrantChange grant = 13;
    GrantRevoke revoke_grant = 14;
    // The person decides an orchestrator's plan; approving creates its tasks
    // and makes the cap and fan-out the grant's. Then raises a budget that
    // stopped new agents.
    PlanDecision approve_plan = 15;
    PlanDecision reject_plan = 16;
    BudgetRaise raise_budget = 17;
    IntegrationPrepare prepare_candidate = 18;
    IntegrationPromote promote_candidate = 19;
  }
}
message IntegrationPrepare {
  string plan_id = 1;
  repeated string check_argv = 2;
}
message IntegrationPromote { string candidate_id = 1; }
message IntegrationCandidate {
  string id = 1;
  string plan_id = 2;
  uint64 base_generation = 3;
  string state = 4;
  string command_id = 5;
  string detail = 6;
  map<string, string> revisions = 7;
  repeated string check_argv = 8;
  map<string, string> task_reviews = 9;
  string repair_task_id = 10;
}
message PlanDecision {
  string plan_id = 1;
  // Approval: what the whole tree may spend (0: no cap) and how many agents at once (0: unchanged).
  double cap_usd = 2;
  uint32 max_children = 3;
  string note = 4;
}
message BudgetRaise { string grant_id = 1; double cap_usd = 2; }
message PlanTask {
  // Names the task inside the plan; after refers to keys.
  string key = 1;
  string title = 2;
  string brief = 3;
  string role = 4;
  string profile_id = 5;
  string permission = 6;
  // same or new.
  string workspace = 7;
  // Paths it would change (relative; a trailing / names a folder).
  repeated string paths = 8;
  double estimate_usd = 9;
  repeated string after = 10;
  // Once approved: the mission task it became.
  string task_id = 11;
}
message PlanOverlap { string path = 1; repeated string keys = 2; }
message MissionPlan {
  string id = 1;
  string grant_id = 2;
  string summary = 3;
  repeated PlanTask tasks = 4;
  double total_usd = 5;
  // proposed, approved, rejected or superseded.
  string state = 6;
  double cap_usd = 7;
  string note = 8;
  int64 proposed_at_unix_millis = 9;
  int64 decided_at_unix_millis = 10;
  // Paths more than one task would change: parallel writers collide there.
  repeated PlanOverlap overlaps = 11;
  // The orchestrator that proposed it.
  string conversation_id = 12;
  string proposed_by = 13;
  repeated PlanBaselineMember baseline = 14;
  PlanContract contract = 15;
}
message ClaimLeaseRequest {
  string session_id = 1;
  // The task (an orchestrator's agent's); empty: the caller's own.
  string task_id = 2;
  // Relative to the workspace: api/handler.go, or web/ for a folder.
  string path = 3;
  bool exclusive = 4;
  uint32 ttl_seconds = 5;
  string reason = 6;
}
message ReleaseLeaseRequest { string session_id = 1; string lease = 2; }
message LeasesRequest { string session_id = 1; }
message MissionLease {
  string id = 1;
  string task_id = 2;
  string task_title = 3;
  string path = 4;
  // exclusive or shared.
  string mode = 5;
  string holder_conversation_id = 6;
  int64 claimed_at_unix_millis = 7;
  int64 expires_at_unix_millis = 8;
  string reason = 9;
}
message MissionLeases { string mission_id = 1; repeated MissionLease leases = 2; MissionLease claimed = 3; }
message MissionOverlap {
  repeated string task_ids = 1;
  repeated string paths = 2;
  // files (both changed them) or lease (one changed what the other leased exclusively).
  string kind = 3;
  string lease_id = 4;
  int64 at_unix_millis = 5;
}
message ProposePlanRequest {
  string session_id = 1;
  string operation_id = 2;
  string summary = 3;
  repeated PlanTask tasks = 4;
  PlanContract contract = 5;
}
message OrchestratorGrantChange {
  // Any session of the conversation that is to orchestrate.
  string session_id = 1;
  OrchestratorCeiling ceiling = 2;
}
// The most an orchestrator's children may get. Each field only narrows.
message OrchestratorCeiling {
  // read-only, ask or yolo; at most the holder's own permission.
  string permission = 1;
  // The subscriptions children may run on; empty: the holder's own and its rotation.
  repeated string profile_ids = 2;
  // Children live at once (1-16, default 3).
  uint32 max_children = 3;
  // 1: children start no agents (default); 2-3: the orchestrator may narrow
  // its grant for a child.
  uint32 depth = 4;
  // What the whole tree may spend; 0 sets no cap.
  double budget_usd = 5;
  // No agent starts before the person approves a plan; then only its tasks.
  bool plan_required = 6;
  // New agents are held while this many tasks wait for the person (0: 3).
  uint32 review_limit = 7;
}
message GrantRevoke { string grant_id = 1; string reason = 2; }
message MissionGrant {
  string id = 1;
  // The conversation that orchestrates, and its latest session.
  string conversation_id = 2;
  string session_id = 3;
  string title = 4;
  // The grant this one was narrowed from, for a child orchestrator.
  string parent_grant_id = 5;
  OrchestratorCeiling ceiling = 6;
  repeated string scopes = 7;
  int64 issued_at_unix_millis = 8;
  int64 revoked_at_unix_millis = 9;
  string revoke_reason = 10;
  // human, agent (narrowed for a child) or lazybox (the conversation was deleted).
  string issued_by = 11;
  string revoked_by = 12;
  bool live = 13;
  uint32 live_children = 14;
  uint32 children = 15;
  // What the tree (the orchestrator and its agents) spent, what its live
  // agents reserved of their estimates, and "" / warning / exhausted.
  double spent_usd = 16;
  double reserved_usd = 17;
  string budget_state = 18;
}
message MissionMessage {
  string id = 1;
  uint64 seq = 2;
  int64 at_unix_millis = 3;
  string from_conversation_id = 4;
  string to_conversation_id = 5;
  string from_label = 6;
  string to_label = 7;
  // note or report.
  string kind = 8;
  string text = 9;
}
message MissionEdit { string title = 1; string brief = 2; }
message MissionCancel { string reason = 1; }
message GoalCreate { string title = 1; }
message TaskCreate { string goal_id = 1; string title = 2; string brief = 3; repeated string blocked_by = 4; }
message TaskEdit { string task_id = 1; string title = 2; string brief = 3; }
message TaskCancel { string task_id = 1; string reason = 2; }
message TaskAssign {
  string task_id = 1;
  // An existing conversation (any of its sessions), or open a new one.
  string session_id = 2;
  OpenSessionRequest open = 3;
  // Send the task's brief as the conversation's next message.
  bool send_brief = 4;
}
message TaskReport { string task_id = 1; string summary = 2; }
message GateDecision { string task_id = 1; string note = 2; }
message Mission {
  string id = 1; string title = 2; string brief = 3;
  string process = 4; string process_digest = 5; int32 autonomy = 6;
  int64 created_at_unix_millis = 7; int64 updated_at_unix_millis = 8;
  bool canceled = 9; uint64 seq = 10;
  repeated MissionGoal goals = 11;
  repeated MissionTask tasks = 12;
  // GetMission only: the log, newest first (at most 200).
  repeated MissionEvent events = 13;
  // The mission's log could not be read; it is listed, never written.
  string error = 14;
  // Events kept in the log that this Runner does not fold (unknown types or newer versions).
  uint32 ignored = 15;
  // UpdateMission: the change's result, e.g. the id of a created task.
  string created_id = 16;
  // UpdateMission with assign: the session the task went to.
  string session_id = 17;
  // Orchestrator grants, live and revoked, oldest first.
  repeated MissionGrant grants = 18;
  // GetMission only: messages between agents, newest first (at most 200).
  repeated MissionMessage messages = 19;
  // Orchestrators' plans, newest first.
  repeated MissionPlan plans = 20;
  // Leases in force, and the overlaps the Runner observed, newest first.
  repeated MissionLease leases = 21;
  repeated MissionOverlap overlaps = 22;
  // Tasks waiting for the person's review (at a gate).
  uint32 awaiting_review = 23;
  repeated IntegrationCandidate candidates = 24;
  uint64 accepted_generation = 25;
  string accepted_candidate_id = 26;
}
message MissionGoal { string id = 1; string title = 2; }
message MissionTask {
  string id = 1; string goal_id = 2; string title = 3; string brief = 4;
  string status = 5;
  // What backs the status; empty where it claims nothing.
  string trust = 6;
  // What the recorded evidence alone supports.
  string evidence_trust = 7;
  // One sentence: why this status, and what backs it.
  string reason = 8;
  // stale, failing, ci_failing, no_evidence, blockers (an agent review has open blockers).
  repeated string flags = 9;
  // The human gate waiting for a decision (awaiting acceptance), or empty.
  string gate = 10;
  MissionAttempt attempt = 11;
  repeated MissionAttempt attempts = 12;
  // Newest first.
  repeated MissionEvidence evidence = 13;
  string report = 14; int64 reported_at_unix_millis = 15;
  // The note of the last decision at a gate.
  string decision_note = 16;
  repeated string blocked_by = 17;
  int64 created_at_unix_millis = 18; int64 updated_at_unix_millis = 19;
  // The snippet last sent to the current attempt's conversation, and what it chains to.
  string last_snippet = 20; repeated string next_snippets = 21;
  // What its conversations cost so far, and the estimate of the plan it came from.
  double cost_usd = 22;
  double estimate_usd = 23;
  string plan_id = 24;
}
message MissionAttempt {
  string id = 1; string conversation_id = 2;
  // The conversation's latest session, to open it.
  string session_id = 3;
  string collection_id = 4;
  int64 started_at_unix_millis = 5; int64 ended_at_unix_millis = 6;
  // deleted, handoff or stopped, once ended.
  string outcome = 7;
  // running, waiting, idle, closed or missing.
  string live = 8;
  string live_detail = 9;
  string title = 10;
  // Lineage: the conversation that started this one, under which grant, as
  // what role, at which permission and on which subscription.
  string parent_conversation_id = 11;
  string grant_id = 12;
  string role = 13;
  string permission = 14;
  string profile_id = 15;
}
message MissionEvidence {
  string ref = 1;
  // run, commit, pr or review (an agent review: failing while blockers are open).
  string kind = 2;
  string title = 3;
  // pass, fail, pending or unknown.
  string outcome = 4;
  optional int32 exit_code = 5;
  bool piped = 6;
  string member = 7; string repository = 8; string head = 9;
  int64 number = 10; string url = 11; string state = 12;
  string collection_id = 13; string session_id = 14; string command_id = 15;
  string output_path = 16; string detail = 17;
  int64 at_unix_millis = 18;
  map<string,string> revisions = 19;
  string contract_digest = 20;
  // Preserved in history, excluded from the current attempt’s evidence.
  bool historical = 21;
}
message MissionEvent {
  uint64 seq = 1; int64 at_unix_millis = 2; string type = 3; uint32 version = 4;
  string subject = 5; string actor_kind = 6; string actor_role = 7; string conversation_id = 8;
  string summary = 9;
  // This Runner folds it; otherwise it is kept and shown raw.
  bool known = 10;
  repeated string evidence = 11;
  string raw_json = 12;
  // The event's id and the event it reacts to: the timeline's arrows.
  string id = 13;
  string caused_by = 14;
}
message SetWorkflowReviewScheduleRequest {
  string collection_id = 1;
  bool hourly = 2;
}
message ReviewWorkflowRequest {
  string collection_id = 1;
  string snippet_key = 2;
  string feedback = 3;
}
message ReviewWorkflowResult {
  repeated string proposal_titles = 1;
}

message ListPromptHistoryRequest {
  // Scope: one conversation, one workspace, or (both empty) every conversation.
  string conversation_id = 1;
  string collection_id = 2;
  string search = 3;
  uint32 limit = 4;
}
message PromptRecord {
  string text = 1; string conversation_id = 2; string collection_id = 3; string session_id = 4;
  int64 at_unix_millis = 5;
  PromptSource source = 6;
}
message PromptHistory {
  repeated PromptRecord prompts = 1;
  // With conversation_id: the snippet last sent there and the chain it offers.
  string last_snippet = 2;
  repeated string next_snippets = 3;
  // With collection_id: the workspace's last distinct snippets, newest first.
  repeated string recent_snippets = 4;
}
// Who wrote one version of an artifact.
message ArtifactAuthor {
  // "person" (the owner, from the app), "agent" (an execution's credential,
  // `lazybox artifact put`) or "file" (the tracked file changed on disk, by
  // whoever changed it).
  string kind = 1;
  // The execution, for an agent.
  string session_id = 2;
}
// Where one version's content came from.
message ArtifactSource {
  // "message" (a conversation message), "file" (a workspace file), "agent"
  // (published by an agent) or "edit" (written in the app).
  string kind = 1;
  // A message: the execution and its conversation, the message's journal
  // cursor and turn.
  string session_id = 2;
  string conversation_id = 3;
  string message_id = 4;
  string turn_id = 5;
  // A file: its workspace path ("member/path").
  string path = 6;
}
// A pinned input to a derived plan. Mission/task links remain reserved.
message ArtifactLink {
  // "artifact" for a roadmap input.
  string kind = 1;
  string id = 2;
  // "design" or "review" for a roadmap input.
  string role = 3;
  uint32 version = 4;
}
message ArtifactVersion {
  uint32 number = 1;
  int64 created_at_unix_millis = 2;
  ArtifactAuthor author = 3;
  ArtifactSource source = 4;
  // sha256 of the content, hex.
  string digest = 5;
  uint64 size = 6;
  string schema = 7;
}
message Artifact {
  string id = 1;
  string collection_id = 2;
  string title = 3;
  // plan, report, spec, notes or other.
  string kind = 4;
  // markdown (including Mermaid diagrams) or html.
  string format = 5;
  int64 created_at_unix_millis = 6;
  int64 updated_at_unix_millis = 7;
  // Every version, oldest first (headers only).
  repeated ArtifactVersion versions = 8;
  // The requested version's content (GetArtifact, PutArtifact); empty in lists.
  string content = 9;
  // The version content belongs to.
  uint32 content_version = 10;
  // The conversation the artifact was first taken from, if any: "Update from
  // this message" is offered on that conversation's later messages.
  string origin_session_id = 11;
  string origin_conversation_id = 12;
  // The workspace file the Runner follows, if any ("member/path").
  string tracked_path = 13;
  // Why the tracked file could not be followed lately (removed, too large,
  // not text); empty while it is followed.
  string tracking_problem = 14;
  repeated ArtifactLink links = 15;
  // Set while the artifact is retired (RetireArtifact): hidden from the
  // default list, kept with every version, restorable.
  ArtifactRetirement retired = 16;
}
// Why and when an artifact was retired.
message ArtifactRetirement {
  int64 at_unix_millis = 1;
  // "person" or "agent" (with its execution).
  ArtifactAuthor by = 2;
  // The artifact of the same workspace that replaces it, if any.
  string superseded_by = 3;
  string reason = 4;
}
message ListArtifactsRequest {
  string collection_id = 1;
  // Also list retired artifacts; by default they are left out.
  bool include_retired = 2;
}
message ListArtifactsResponse { repeated Artifact artifacts = 1; }
message GetArtifactRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // 0 is the latest version.
  uint32 version = 3;
}
message PutArtifactRequest {
  string collection_id = 1;
  // Empty creates an artifact; otherwise a version is added to this one.
  string artifact_id = 2;
  // Required to create; on an update, empty keeps the title.
  string title = 3;
  // Empty is "other" on create, and keeps the kind on an update.
  string kind = 4;
  string content = 5;
  // Ignored for an agent credential (its source is always its own execution).
  ArtifactSource source = 6;
  // On an update: the version the writer saw. The Runner refuses the write if
  // a newer version exists, so a reviewed diff is the diff that is saved. 0
  // skips the check.
  uint32 expected_version = 7;
  repeated ArtifactLink links = 8;
  // Artifacts of the same workspace this one replaces: once it is saved, each
  // is retired as superseded by it (RetireArtifact's rules apply to each, and
  // all are checked before anything is written).
  repeated string supersedes = 9;
  // Empty defaults to markdown on create and preserves format on update.
  string format = 10;
  // Optional key for replaying the same creation after a lost response.
  string creation_key = 11;
}
message TrackArtifactFileRequest {
  string collection_id = 1;
  // Workspace path ("member/path").
  string path = 2;
  // Empty takes the file's first heading, else its name.
  string title = 3;
  string kind = 4;
}
message UpdateArtifactRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // Empty keeps the title; likewise kind.
  string title = 3;
  string kind = 4;
  // Stop recording versions from the tracked file; its versions are kept.
  bool stop_tracking = 5;
}
message DeleteArtifactRequest { string collection_id = 1; string artifact_id = 2; }
message DeleteArtifactResponse {}
message RetireArtifactRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // Retire it as replaced by this artifact of the same workspace; empty names none.
  string superseded_by = 3;
  // One line on why, shown with it.
  string reason = 4;
  // Restore a retired artifact instead (owner only).
  bool restore = 5;
}
message SaveArtifactToRepositoryRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // Workspace path ("member/path") of a Markdown file.
  string path = 3;
  // Replacing an existing file requires the version the person saw
  // (WorkspaceFile.version); empty only creates a new file.
  string expected_file_version = 4;
  // Then follow that file: later edits on disk become versions.
  bool track = 5;
}
message SaveArtifactToRepositoryResponse {
  string path = 1;
  Artifact artifact = 2;
}
message CreateArtifactIssueRequest {
  string collection_id = 1;
  string artifact_id = 2;
  // The workspace repository whose GitHub project receives the issue.
  string member = 3;
  // Empty is the artifact's title.
  string title = 4;
}
message CreateArtifactIssueResponse {
  int64 number = 1;
  string url = 2;
}

// Power-user extensibility (POWER.md): the actions and hooks file.
message GetUserActionsRequest {}
message UserActions {
  // The file the Runner reads, and whether it exists.
  string path = 1;
  bool exists = 2;
  // The file as a whole could not be read (YAML syntax, say). The actions and
  // hooks below are then the last version that loaded, if any (stale).
  string error = 3;
  // Problems with single entries; an entry with an error is left out.
  repeated UserActionIssue issues = 4;
  repeated UserAction actions = 5;
  repeated UserHook hooks = 6;
  // Increases whenever what the file declares changes.
  uint64 revision = 7;
  int64 loaded_at_unix_millis = 8;
  // The JSON Schema of the file, and where InitUserActions writes it.
  string schema = 9;
  string schema_path = 10;
  // The events hooks may follow, for Settings and completions.
  repeated string events = 11;
  // The actions and hooks above come from an earlier version of the file,
  // because the current one does not load.
  bool stale = 12;
}
message GetConfigFilesRequest {}
message ConfigFiles {
  // The folder holding them (the actions file's).
  string directory = 1;
  repeated ConfigFile files = 2;
  // Increases whenever any of them changes.
  uint64 revision = 3;
}
message ConfigFile {
  // keys, settings, or layouts/<id>.
  string name = 1;
  // keys, settings or layout.
  string kind = 2;
  string path = 3;
  bool exists = 4;
  // The file as a whole does not load; json is then its last good version
  // (stale), if any.
  string error = 5;
  bool stale = 6;
  repeated UserActionIssue issues = 7;
  // What the file declares, as JSON (POWER.md documents each shape).
  string json = 8;
  uint64 revision = 9;
  int64 loaded_at_unix_millis = 10;
  // The JSON Schema the file's yaml-language-server header names.
  string schema_path = 11;
}
message ConfigEdit {
  // The keys from the top of the file: ["notifications", "needs-input"].
  repeated string path = 1;
  // The new value as JSON; empty removes the key.
  string json = 2;
}
message UpdateConfigFileRequest {
  // keys, settings, or layouts/<id>.
  string name = 1;
  repeated ConfigEdit edits = 2;
  // The whole file instead of edits (an import); validated first.
  string content = 3;
  // Removes the file (layouts only).
  bool remove = 4;
}
message UserActionIssue {
  // Where in the file: "actions[2].steps[0]", say.
  string path = 1;
  uint32 line = 2;
  string message = 3;
  // "error" leaves the entry out; "warning" keeps it.
  string severity = 4;
}
message UserAction {
  string id = 1;
  string title = 2;
  string description = 3;
  string icon = 4;
  // One key after the leader (]] t), or empty.
  string key = 5;
  // Where the action is offered: palette, menu (the ]] which-key menu),
  // conversation (its menu) and workspace (its row's menu).
  repeated string where = 6;
  repeated UserActionStep steps = 7;
  // Ask before running.
  bool confirm = 8;
}
message UserActionStep {
  // send, open, run, command, permission or wait.
  string kind = 1;
  string name = 2;
  // always (default), succeeded or failed: whether the step runs, from the
  // result of the last step before it that has no condition.
  string when = 3;
  // send: the text, or a snippet's key; to: current (default), new, or a
  // conversation's id or title; wait: also wait for the turn to end.
  string text = 4;
  string snippet = 5;
  string to = 6;
  bool wait = 7;
  // open: a panel kind, a web URL, or a workspace file and line.
  string panel = 8;
  string url = 9;
  string file = 10;
  uint32 line = 11;
  // run: a workspace action's key (its scripts' approval applies).
  string action = 12;
  // command: a shell command run as a managed command of the conversation.
  string command = 13;
  // permission: ask, read-only or yolo.
  string permission = 14;
  // wait: idle or needs-input.
  string until = 15;
  uint32 timeout_seconds = 16;
  // do: an action of the app's registry (`lazybox do --list`), and its argument.
  string do_action = 17;
  string do_argument = 18;
}
message UserHook {
  string id = 1;
  string description = 2;
  repeated string on = 3;
  // Filters: every one set must match. Workspace and conversation match the
  // name or title, with * as a wildcard; repository matches owner/name.
  repeated string workspaces = 4;
  repeated string conversations = 5;
  repeated string repositories = 6;
  // Exactly one of: a program and its arguments, a shell line, a webhook.
  repeated string run = 7;
  string shell = 8;
  string webhook = 9;
  map<string, string> headers = 10;
  // Credential grants for the hook's own `lazybox` calls: read, respond,
  // start. Without grants a hook holds no Runner credential at all.
  repeated string grants = 11;
  uint32 timeout_seconds = 12;
  bool enabled = 13;
}
message ListHookRunsRequest { uint32 limit = 1; }
message HookRuns { repeated HookRun runs = 1; }
message HookRun {
  string id = 1;
  string hook_id = 2;
  string event = 3;
  // running, succeeded, failed or skipped.
  string state = 4;
  // The managed command holding the run's output (ReadCommand).
  string command_id = 5;
  optional int32 exit_code = 6;
  string error = 7;
  // One line about the event: "Alpha feature · fix the tests needs input".
  string summary = 8;
  string collection_id = 9;
  string session_id = 10;
  int64 started_at_unix_millis = 11;
  int64 ended_at_unix_millis = 12;
  // A webhook's HTTP status.
  uint32 http_status = 13;
  repeated string grants = 14;
  bool test = 15;
}
message TestHookRequest { string hook_id = 1; }
message UiRequest {
  string id = 1;
  // open, shot, action (a user action) or do (an action of the app's
  // registry, `lazybox do`; a hook may ask only for one marked safe).
  string kind = 2;
  // open and action: a workspace, a conversation, or a workspace file and line.
  string collection_id = 3;
  string session_id = 4;
  string file = 5;
  uint32 line = 6;
  // shot: empty for the window, or a panel kind; open: a panel to show.
  string panel = 7;
  // action: the user action's id; do: the registry action's id.
  string action_id = 8;
  // pending, done or failed.
  string state = 9;
  string error = 10;
  // shot: the PNG.
  bytes png = 11;
  // What the window did, in one line ("Showed Alpha feature · fix the tests").
  string detail = 12;
  int64 created_at_unix_millis = 13;
  // do: the action's argument, when it takes one (a settings section, a
  // palette query).
  string argument = 14;
}
message WaitUiRequestRequest {
  string id = 1;
  // Bounded by the Runner to two minutes; zero selects 30 seconds.
  uint32 timeout_ms = 2;
}
message WatchUiRequestsRequest {
  // "desktop" or "web": a desktop window is preferred when both are open.
  string surface = 1;
}
message CompleteUiRequestRequest {
  string id = 1;
  string error = 2;
  bytes png = 3;
  string detail = 4;
}

// One repository of a workspace, as an agent sees it.
message WorkspaceRepository {
  // The worktree's folder name in the workspace.
  string name = 1;
  string path = 2;
  string branch = 3;
  // The catalog identity (github:owner/repo, or a local one).
  string identity = 4;
  bool ready = 5;
  // The person's home checkout of this repository ("" when none): theirs,
  // read-only for agents.
  string home = 6;
  string repository_id = 7;
}
message ListWorkspaceRepositoriesRequest { string collection_id = 1; }
message WorkspaceRepositories {
  string collection_id = 1;
  string name = 2;
  // The branch a repository added to this workspace gets.
  string branch = 3;
  repeated WorkspaceRepository repositories = 4;
  // Requests agents made in this workspace that are still waiting.
  repeated RepositoryRequest requests = 5;
}
// A catalog repository that matches what an agent asked for, best first.
message RepositoryCandidate {
  // Empty for a local git folder not in the catalog yet (local_path names it).
  string identity = 1;
  string name = 2;
  // workspace, registered, local, github or folder.
  string source = 3;
  string local_path = 4;
  int32 score = 5;
}
message RequestRepositoryRequest {
  // The asking execution; an agent may only name its own.
  string session_id = 1;
  // A name, owner/repo, GitHub URL or absolute local path.
  string query = 2;
  string reason = 3;
}
message RepositoryRequest {
  string id = 1;
  string session_id = 2;
  string conversation_id = 3;
  string collection_id = 4;
  string query = 5;
  string reason = 6;
  repeated RepositoryCandidate candidates = 7;
  // pending, added, declined or expired.
  string state = 8;
  // The branch the repository gets in this workspace.
  string branch = 9;
  // declined: the person's reason, if they gave one.
  string decline_reason = 10;
  // added: the new worktrees.
  repeated WorkspaceRepository added = 11;
  int64 created_at_unix_millis = 12;
  int64 expires_at_unix_millis = 13;
  int64 resolved_at_unix_millis = 14;
  // The repository was already in the workspace: nothing was asked.
  bool already = 15;
}
message WaitRepositoryRequestRequest {
  string request_id = 1;
  // At most 60; 0 returns at once.
  uint32 timeout_seconds = 2;
}
message DeclineRepositoryRequestRequest {
  string request_id = 1;
  string reason = 2;
}

// An agent's request that the person start a conversation.
message RequestConversationStartRequest {
  // The asking execution; an agent may only name its own.
  string session_id = 1;
  // The new conversation's title, in a line.
  string title = 2;
  // Its first message: objective, done when, boundaries (at most 8 KB).
  string brief = 3;
  // A Lazybox artifact of the asking workspace that holds the brief; the new
  // conversation's first message names it.
  string brief_artifact_id = 4;
  // same (default): the asking conversation's workspace; new: a workspace of
  // its own, with new branches from this one's.
  string workspace = 5;
  // claude, codex or an ACP agent's provider; empty: the asking agent's.
  string provider = 6;
  // A subscription of that provider; empty: the asking one's, or the provider's first.
  string profile_id = 7;
  // Empty: the asking agent's model when the provider is the same, else the provider's default.
  string model = 8;
  // Why, in a line the person decides from (optional).
  string reason = 9;
  // With workspace new: the branch of origin every repository starts from,
  // fetched first, instead of this workspace's branches.
  string start_from = 10;
}
message ConversationStartRequest {
  string id = 1;
  string session_id = 2;
  string conversation_id = 3;
  string collection_id = 4;
  // The asking conversation's title.
  string from_title = 5;
  string title = 6;
  string brief = 7;
  string reason = 8;
  // same or new.
  string workspace = 9;
  string provider = 10;
  string profile_id = 11;
  string model = 12;
  // The permission the new conversation runs at: the asking conversation's.
  string permission = 13;
  string brief_artifact_id = 14;
  string brief_artifact_title = 15;
  uint32 brief_artifact_version = 16;
  // How many conversations are live in the asking workspace now, the asking
  // one included: a new one there shares their files.
  uint32 shared_with = 17;
  // pending, started, declined or expired.
  string state = 18;
  string decline_reason = 19;
  // started: the new conversation.
  string started_session_id = 20;
  string started_conversation_id = 21;
  string started_collection_id = 22;
  string started_title = 23;
  // Started under the asking conversation's Orchestrator grant: an agent of
  // its mission (mission_title), not a peer.
  bool child = 24;
  string mission_title = 25;
  int64 created_at_unix_millis = 26;
  int64 expires_at_unix_millis = 27;
  int64 resolved_at_unix_millis = 28;
  // workspace new: the branch of origin it starts from; empty for the asking
  // workspace's branches.
  string start_from = 29;
}
message WaitConversationStartRequest {
  string request_id = 1;
  // At most 60; 0 returns at once.
  uint32 timeout_seconds = 2;
}
message AnswerConversationStartRequest {
  string request_id = 1;
  // start or decline.
  string decision = 2;
  // decline: why, told to the agent (optional).
  string reason = 3;
  // start: the person's edits; empty keeps what the agent asked for.
  string title = 4;
  string brief = 5;
  // same or new.
  string workspace = 6;
  string profile_id = 7;
  string model = 8;
}

// One conversation's agent browser (BROWSER.md).
message BrowserState {
  string conversation_id = 1;
  // The execution that drives it now (the conversation's latest).
  string session_id = 2;
  string collection_id = 3;
  // closed | starting | open | stopped | failed
  string status = 4;
  // Who holds it: agent | person (after Take over).
  string controller = 5;
  string url = 6;
  string title = 7;
  bool loading = 8;
  bool can_go_back = 9;
  bool can_go_forward = 10;
  // The agent opens any site without asking, in this conversation.
  bool browse_freely = 11;
  // Why it failed or was stopped, in words for the person.
  string problem = 12;
  // The agent's action in progress, if any.
  BrowserAction current = 13;
  uint32 viewport_width = 14;
  uint32 viewport_height = 15;
  int64 updated_at_unix_millis = 16;
  // "Claude" or "Codex": who browses.
  string agent_name = 17;
  // A site, download or sign-in request waits for the person.
  bool waiting = 18;
}
// One step in a browser's action log.
message BrowserAction {
  uint64 seq = 1;
  // open | navigate | snapshot | click | type | select | press | scroll |
  // screenshot | back | forward | wait | close | blocked | download |
  // take_over | give_back | stop | site
  string kind = 2;
  // agent | person | lazybox
  string actor = 3;
  // One readable line: Clicked button "Sign in".
  string summary = 4;
  string url = 5;
  // Where it happened, in the page's CSS pixels; absent when nowhere.
  BrowserBox box = 6;
  // running | done | failed | blocked
  string status = 7;
  string error = 8;
  int64 at_unix_millis = 9;
  uint32 duration_ms = 10;
}
message BrowserBox {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
}
// One screencast frame: a JPEG of the page's viewport.
message BrowserFrame {
  bytes jpeg = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint64 seq = 4;
}
message WatchBrowserRequest {
  // Any execution of the conversation; the browser belongs to the conversation.
  string session_id = 1;
}
message BrowserEvent {
  BrowserState state = 1;
  BrowserFrame frame = 2;
  BrowserAction action = 3;
  // First event only: the recent action log, oldest first.
  repeated BrowserAction history = 4;
}
message ControlBrowserRequest {
  string session_id = 1;
  // take_over | give_back | stop | resume | browse_freely | ask_sites |
  // navigate | back | forward | reload (the last four only while the person holds it)
  string action = 2;
  string url = 3;
}
message BrowserInputRequest {
  string session_id = 1;
  // mouse_move | mouse_down | mouse_up | wheel | key_down | key_up | text
  string type = 2;
  // Page CSS pixels.
  double x = 3;
  double y = 4;
  // left | middle | right
  string button = 5;
  uint32 click_count = 6;
  double delta_x = 7;
  double delta_y = 8;
  // A KeyboardEvent.key value: "Enter", "a", "ArrowLeft".
  string key = 9;
  string text = 10;
  // Alt=1, Control=2, Meta=4, Shift=8.
  uint32 modifiers = 11;
}
// A request the agent's browsing raised, waiting for the person. It is a
// session's pending entry of type "browser_request" whose provider data is
// this message.
message BrowserRequest {
  string id = 1;
  string session_id = 2;
  string conversation_id = 3;
  string collection_id = 4;
  // site (first visit to an origin) | download | sign_in (a form with a password)
  string kind = 5;
  string url = 6;
  string origin = 7;
  // The agent's reason, when it gave one.
  string reason = 8;
  string file_name = 9;
  int64 created_at_unix_millis = 10;
  // The conversation's permission mode when asked ("yolo" still asks for sites).
  string permission = 11;
  string agent_name = 12;
}
message DecideBrowserRequestRequest {
  string request_id = 1;
  // site: once | conversation | workspace | deny. download, sign_in: once | deny.
  string decision = 2;
  // Told to the agent with a deny.
  string reason = 3;
}
message BrowserWorkspaceSites {
  string collection_id = 1;
  string name = 2;
  // Sites always allowed in this workspace ("Always for this workspace").
  repeated string sites = 3;
  // The workspace has a browser profile on disk (cookies, storage, cache).
  bool has_data = 4;
  int64 data_bytes = 5;
  // Agents of this workspace get no browser (Settings → Browser, per workspace).
  bool off = 6;
}
message BrowserSettings {
  uint64 revision = 1;
  // ask (each new site asks) | allow (any site, no asking) | off (no agent browser)
  string default_permission = 2;
  // Sites any agent opens without asking: example.com, *.example.com.
  repeated string allowed_sites = 3;
  // ask | block
  string downloads = 4;
  // Show the agent browser beside the chat when an agent starts browsing.
  bool show_panel = 5;
  repeated BrowserWorkspaceSites workspaces = 6;
  // Why agents cannot browse on this Runner, if they cannot.
  string problem = 7;
  // ready | not_installed (Chromium is missing) | off | unavailable (no
  // browser service on this Runner).
  string availability = 8;
  // Chromium is missing and InstallBrowser can install it (a developer build).
  bool installable = 9;
  // The latest InstallBrowser command, while it runs and after: its output.
  string install_command_id = 10;
}
message ClearBrowserDataRequest {
  string collection_id = 1;
}
message ListExtensionsRequest {}
message Extensions {
  // The config folder's extensions/ (it may not exist yet).
  string directory = 1;
  repeated Extension extensions = 2;
  // Bundled examples, and whether each is in the folder.
  repeated ExtensionExample examples = 3;
  uint64 revision = 4;
  // The extension protocol this Runner serves.
  uint32 protocol = 5;
}
message Extension {
  // Its folder's name.
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  string author = 5;
  string homepage = 6;
  string path = 7;
  // new (never approved), enabled, disabled, review (asks for more than was
  // approved; runs with what was), or broken (does not load).
  string state = 8;
  repeated ExtensionPanel panels = 9;
  // What its manifest asks for now.
  repeated string grants = 10;
  repeated string hosts = 11;
  // What the person approved.
  repeated string approved_grants = 12;
  repeated string approved_hosts = 13;
  int64 approved_at_unix_millis = 14;
  // Why it does not load, and its manifest's problems by line.
  string error = 15;
  repeated UserActionIssue issues = 16;
  // Changes whenever one of its files does: open panels reload.
  string digest = 17;
  // An account policy the Runner interprets (EXTENSIONS.md, "Account policy");
  // unset when the manifest declares none.
  ExtensionAccountPolicy account_policy = 18;
}
message ExtensionAccountPolicy {
  // The providers it applies to: "claude", "codex".
  repeated string providers = 1;
  // Move a conversation to another signed-in account when it reaches a limit.
  bool switch_on_limit = 2;
  // Accounts to try, in order (profile ids); empty is every other signed-in
  // account of the provider, sorted.
  repeated string accounts = 3;
}
message ExtensionPanel {
  string id = 1;
  string title = 2;
  string icon = 3;
  string entry = 4;
  string description = 5;
}
message ExtensionExample {
  string id = 1;
  string name = 2;
  string description = 3;
  bool installed = 4;
}
message ApproveExtensionRequest {
  string id = 1;
  // Exactly what the approval sheet showed.
  repeated string grants = 2;
  repeated string hosts = 3;
}
message SetExtensionEnabledRequest {
  string id = 1;
  bool enabled = 2;
}
message RemoveExtensionRequest { string id = 1; }
message InstallExampleExtensionRequest { string example = 1; }
message OpenExtensionPanelRequest {
  string id = 1;
  // A panel id; empty opens its first.
  string panel = 2;
  // The app's own origin, which may frame the page.
  string origin = 3;
}
message ExtensionPanelSession {
  // The shell page to frame (sandbox="allow-scripts").
  string url = 1;
  // The extension content origin.
  string content_origin = 2;
  // What the bridge calls the Runner with for this panel.
  string credential = 3;
  // What this panel may do: what it asks for and the person approved.
  repeated string grants = 4;
  repeated string hosts = 5;
  string digest = 6;
  uint32 protocol = 7;
}

message DeleteThemeRequest { string file = 1; }

message ListMailboxRequest {}
message MailboxItem {
  string id = 1;
  string repository = 2;
  string title = 3;
  string reason = 4;
  string url = 5;
  string updated_at = 6;
  repeated string workspace_ids = 7;
}
message ListMailboxResponse {
  repeated MailboxItem items = 1;
  bool truncated = 2;
}

message WisprStatusRequest {}
message WisprStatusResponse { bool configured = 1; }
message TranscribeWisprRequest {
  bytes wav = 1;
  string language = 2;
}
message TranscribeWisprResponse { string text = 1; }

message ListReleaseWatchRequest {}
message ReleaseWatchItem {
  string id = 1;
  string repository = 2;
  string environment = 3;
  string reason = 4;
  string url = 5;
  string updated_at = 6;
  repeated string workspace_ids = 7;
}
message ListReleaseWatchResponse {
  repeated ReleaseWatchItem items = 1;
  bool truncated = 2;
}

message ScheduleDeletionRequest {
  oneof target {
    DeleteWorkspaceRequest workspace = 1;
    DeleteConversationRequest conversation = 2;
  }
}
message PendingDeletion {
  string id = 1;
  string workspace_id = 2;
  string session_id = 3;
  string title = 4;
  int64 expires_at_unix_millis = 5;
  string failure = 6;
  string workspace_name = 7;
  repeated string repository_names = 8;
}
message ListPendingDeletionsRequest {}
message ListPendingDeletionsResponse { repeated PendingDeletion deletions = 1; }
message UndoDeletionRequest { string id = 1; }

// An owner decision on the exact command the Runner showed in the conversation.
message DecideTerminalHandoffRequest {
  string handoff_id = 1;
  bool accept = 2;
  bool allow_agent_input = 3;
}

message RunReviewVerificationRequest {
  string session_id = 1;
  string name = 2;
  string member = 3;
  string expected = 4;
  repeated string argv = 5;
  string regression = 6;
}
message ReviewVerificationCheck {
  string name = 1;
  string member = 2;
  string expected = 3;
  repeated string argv = 4;
  string regression = 5;
  repeated ReviewVerificationExecution runs = 6;
}
message ReviewVerificationExecution {
  uint32 round = 1;
  string base = 2;
  string candidate = 3;
  string base_command_id = 4;
  string candidate_command_id = 5;
  optional int32 base_exit = 6;
  optional int32 candidate_exit = 7;
  string state = 8;
  string detail = 9;
}

message PlanBaselineMember {
  string name = 1;
  string repository_id = 2;
  string commit = 3;
}
message PlanContract {
  string artifact_id = 1;
  uint32 version = 2;
  // Resolved by the Runner from the proposing workspace.
  string collection_id = 3;
  string digest = 4;
  repeated string acceptance_criteria = 5;
  // The spec artifact's title when the plan pinned it.
  string title = 6;
}

message ArrangeConversationsRequest {
  string collection_id = 1;
  repeated string conversation_ids = 2;
}
