[package]
name = "lazybox-server"
description = "Server library for lazybox: PTY lifecycle, provider polling, agent runs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lazybox-core       = { workspace = true }
lazybox-auth       = { workspace = true }
lazybox-store      = { workspace = true }
lazybox-config     = { workspace = true }
lazybox-gh         = { workspace = true }
lazybox-git-ops    = { workspace = true }
lazybox-tui-term   = { workspace = true }
lazybox-ipc       = { workspace = true }
lazybox-agents    = { workspace = true }
lazybox-linear       = { workspace = true }
lazybox-slack        = { workspace = true }

tokio            = { workspace = true }
futures          = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }
chrono           = { workspace = true }
portable-pty     = "0.8"
libc             = "0.2"
uuid             = { version = "1", features = ["v4"] }
bytes            = "1"
hyper            = { version = "1", features = ["server", "http1"] }
hyper-util       = { version = "0.1", features = ["server", "tokio"] }
http-body-util   = { version = "0.1", features = ["channel"] }

[dev-dependencies]
tokio          = { workspace = true, features = ["full", "test-util"] }
tempfile       = "3"
# Frame-size regression tests: assert an assembled Snapshot stays
# under the socket transport's MAX_FRAME_BYTES once bincode-encoded.
bincode        = { workspace = true }
criterion      = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
libghostty-vt  = { workspace = true }

[[bench]]
name = "sync"
harness = false

[lints]
workspace = true
