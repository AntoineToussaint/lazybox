# Builds the whole public site with one Astro build and publishes it to
# GitHub Pages on push to main. ONE toolchain, ONE artifact, ONE domain
# (lazybox.ai):
#
#   lazybox.ai        → Astro homepage      (web/src/pages/index.astro)
#   lazybox.ai/docs/  → Starlight docs      (web/src/content/docs/docs/**)
#
# The docs are an Astro Starlight integration, so the homepage and the docs
# come out of a single `astro build` (web/dist). `astro build` fails the job
# on broken internal links or missing content, so a bad PR breaks here
# instead of shipping.
#
# Paths-scoped to site sources so Rust-only changes don't trigger a deploy
# (and vice-versa). One-time setup: repo Settings → Pages → Source:
# "GitHub Actions".

name: pages

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site (Astro + Starlight)
        working-directory: web
        run: |
          npm ci
          npm run build   # → web/dist (homepage at /, docs at /docs/, includes public/CNAME)

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: deploy
    # Publish only from main. PRs run `build` for validation but never
    # touch the live site.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
