# Repo-local snippet library for pilot itself.
#
# Snippets are keystroke shortcuts: inside a terminal pane, press `]`
# then a key to expand the prompt below and auto-send it to the active
# agent. Type to filter; a unique match fires instantly (so `]rev`
# sends the review prompt in three keystrokes).
#
# This file is checked in, so everyone working on pilot shares the same
# starter set. Add your own personal ones in `~/.pilot/snippets.yaml`
# (repo-local entries win on key conflict).
snippets:
  rev:
    description: Review the current diff
    body: |
      Please review the current diff for correctness bugs and obvious
      cleanups. Focus on the changes only, not the surrounding code.
      Call out anything risky before suggesting nits.
  pr:
    description: Open a PR with summary + test plan
    body: |
      Please open a PR for the current branch with `gh pr create`. Use a
      concise title. The body should start with a `## Summary` section
      (1-3 bullets on the why) followed by a `## Test plan` checklist.
  test:
    description: Run the workspace test suite
    body: |
      Please run `cargo test --workspace` and fix any failures you find,
      then report what passed and what you changed.
