<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handoff Brief</title>
<link rel="stylesheet" href="_lazybox/lazybox.css">
<script src="_lazybox/lazybox.js"></script>
<script src="_lazybox/workflow.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="workflow">
<header><h1>Handoff Brief</h1><p id="scope">Workspace</p></header>
<p id="notice" role="status">Loading…</p>
<p id="source-status" role="status" hidden></p>
<h2>Include in handoff</h2>
<div id="source-controls" hidden><output id="selection-count"></output>
<button id="include-all" type="button">Include all sources</button>
<button id="exclude-all" type="button">Clear selection</button></div>
<ul id="rows" aria-label="Handoff sources"></ul>
<section class="workflow-form"><label>Open decisions<textarea id="decisions" rows="3"></textarea></label><label>Next step<textarea id="next" rows="3"></textarea></label><button id="draft" class="primary" type="button" disabled>Review handoff draft</button></section>
</body>
</html>
