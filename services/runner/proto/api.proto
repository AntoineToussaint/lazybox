  string root = 4;
  string state = 5;
  string error = 6;
  repeated CollectionWorktree members = 7;
  string owner_execution_id = 8;
  bool ownership_uncertain = 9;
  repeated string owner_execution_ids = 10;
  // The work item it was started from, if any.
  ItemRef origin = 11;
  // When it was created; 0 for a workspace older than the field.
  int64 created_at_unix_millis = 12;
  bool hourly_workflow_review = 13;
  repeated string conversation_order = 14;
}
message CreateCollectionRequest {
  string request_key = 1;
  CollectionSpec spec = 2;
}
message AddCollectionRepositoriesRequest {
  string collection_id = 1;
  string request_key = 2;
  repeated WorktreeSpec members = 3;
}
message RemoveCollectionRepositoryRequest {
  string collection_id = 1;
  string member_name = 2;
}
message CollectionRequest { string collection_id = 1; }
message CollectionResponse { Collection collection = 1; }
message ListCollectionsRequest { bool include_retained_artifact_workspaces = 1; }
// The person's order (ArrangeWorkspaces): a workspace they never placed
// (created since) comes first, newest first; with no order kept, by ID.
message ListCollectionsResponse { repeated Collection collections = 1; }
message ArrangeWorkspacesRequest {
  // Every workspace's ID, in the order the person put them. One left out
  // goes first, as a new one does; an unknown ID is ignored; none clears
  // the order.
  repeated string collection_ids = 1;
}
message ReconcileCollectionRequest {
  string collection_id = 1;
  string expected_owner_execution_id = 2;
  bool processes_stopped = 3;
  string reason = 4;
}
// One of: a workspace, or a conversation (any of its attempts).
message OwnershipRequest {
  string collection_id = 1;
  string session_id = 2;
}
// One process a previous Runner recorded, as the Runner checked it.
message OwnedProcess {
  // "agent" or "command".
  string kind = 1;
  string session_id = 2;
  string command_id = 3;
  // The conversation's title, or the command's.
  string label = 4;
  // What it runs, where recorded or seen; empty when unknown.
  string command_line = 5;
  // 0 when no process ID is recorded.
  int32 pid = 6;
  // "running": a process with the recorded identity runs; "gone": proved
  // gone; "unknown": nothing recorded lets the Runner tell.
  string state = 7;
  // Why, in plain words.
  string detail = 8;
}
message Ownership {
  repeated OwnedProcess processes = 1;
  // Nothing is unconfirmed (any more).
  bool settled = 2;
  // What the Runner settled by itself, if anything.
  string note = 3;
}
message ResolveOwnershipRequest {
  string collection_id = 1;
  string session_id = 2;
  // Stop the recorded processes that still run. Without it, the person says
  // they have stopped (refused for a process the Runner sees running).
  bool stop = 3;
  // Optional, with the person's word: why they know.
  string reason = 4;
}
message SessionResponse {
  Session session = 1;
}
message Image {
  string media_type = 1;
  string base64_data = 2;
}
message Message {
  string text = 1;
  repeated Image images = 2;
  repeated FileAttachment attachments = 3;
  // Where the text came from, recorded in the prompt log. Absent is typed, or
  // the snippet whose catalog body the text is exactly.
  PromptSource source = 4;
}
message PromptSource {
  // typed, snippet, console, inbox, mission, handoff, review (a review
  // brief, findings or a re-review sent by Lazybox), pr-checks (a tracked
  // pull request's failing checks) or pr-review (its GitHub review).
  string kind = 1;
  string snippet_key = 2;
  // console: the run whose compact view was sent.
  string command_id = 3;
  // mission: the task whose brief was sent.
  string mission_id = 4;
  string task_id = 5;
}
message FileAttachment {
  string name = 1;
  string media_type = 2;
  bytes data = 3;
}
message ReadAttachmentRequest {
  // As the operation_accepted record of the message lists it.
  string path = 1;
}
message AttachmentContent {
  string name = 1;
  // Detected from the bytes, not taken from the sender.
  string media_type = 2;
  bytes data = 3;
}
message Interrupt {}
message Answers {
  repeated string values = 1;
}
message Answer {
  string request_id = 1;
  map<string, Answers> answers = 2;
}
enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ACCEPT = 1;
  DECISION_DECLINE = 2;
  DECISION_CANCEL = 3;
}
message Approval {
  string request_id = 1;
  Decision decision = 2;
  // With DECISION_ACCEPT: the id of one of the "always allow" choices the
  // request offered (its provider data's `always` list), so the provider stops
  // asking for the same thing within that choice's scope. Empty allows once.
  string always = 3;
  // With DECISION_DECLINE: why, in the user's words; the agent is told.
  string reason = 4;
}
message ApplyRequest {
  string session_id = 1;
  string operation_id = 2;
  oneof operation {
    Message message = 3;
    Message steer = 4;
    Interrupt interrupt = 5;
    Answer answer = 6;
    Approval approval = 7;
    Permission permission = 8;
    StopAgent stop_agent = 9;
    ModelChange model = 10;
    DeliverQueued deliver_queued = 11;
    RevokeGrant revoke_grant = 12;
    ListMcpServers list_mcp_servers = 13;
    CompactContext compact_context = 14;
    ListProviderCatalog list_provider_catalog = 15;
  }
}
// Lists the running agent’s MCP servers without starting a turn.
message ListMcpServers {}
// Requests native context compaction once the conversation is idle.
message CompactContext {}
// Lists provider inventory for the current conversation.
message ListProviderCatalog { string section = 1; }
// Takes back one "always allow" of the conversation (Session.permission_grants):
// the agent asks again for what it covered, now and after any restart.
message RevokeGrant {
  string grant_id = 1;
}
// Delivers a queued message (Session.queued_messages) ahead of its turn.
// how "now": the turn in progress is interrupted and this message is the next
// turn. how "steer": the message goes into the running turn without
// interrupting it (Capabilities.steer). how "delete": remove it before delivery.
message DeliverQueued {
  string operation_id = 1;
  string how = 2;
  // For edit, save_edit, or cancel_edit. Only the editing client can release the hold.
  string edit_id = 3;
  string text = 4;
}
// Switches a running session's model for its following turns, when
// Capabilities.live_model. A setting, not a response: the owner's alone.
message ModelChange {
  string model = 1;
  string effort = 2;
}
// Stops one running sub-agent, when Capabilities.stop_agent; the main agent's
// turn continues. agent_id is an AgentActivity id other than root.
message StopAgent {
  string agent_id = 1;
}
// Changes a running session's permission mode: ask, read-only or yolo.
message Permission {
  string mode = 1;
  // Pending Claude ExitPlanMode approval authorizing a switch to the execute workflow.
  string exit_plan_request_id = 2;
}
message Receipt {
  // Complete message returned after acquiring the edit hold.
  string queued_text = 5;
  string operation_id = 1;
  string delivery = 2;
  string provider_id = 3;
  string error = 4;
}
message WatchEventsRequest {
  string session_id = 1;
  uint64 after = 2;
  bool include_previous = 3;
  // Ask for heartbeats: a JournalEvent with `heartbeat` set once the stream has
  // replayed everything there was (at once when there was nothing to replay),
  // then one every 15 seconds while no record arrives. A reader can then tell
  // a live but idle conversation from a stream that never connected. A Runner
  // from before this field sends none.
  bool heartbeats = 4;
}
message JournalEvent {
  uint64 cursor = 1;
  string captured_at = 2;
  AgentEvent event = 3;
  Receipt receipt = 4;
  bytes metadata_json = 5;
  // The last cursor the timeline had retained when this record was sent. A
  // reader whose cursor reaches it has replayed the history that existed when
  // it asked; later records are live. Zero when the Runner does not say.
  uint64 retained = 6;
  // A heartbeat (WatchEventsRequest.heartbeats), not a record: no event, and
  // `cursor` repeats the last record sent (0 before any). The reader is
  // caught up and the stream is alive.
  bool heartbeat = 7;
}
// A page of a conversation's timeline (the records WatchEvents replays with
// include_previous), read backward from `before`.
message ReadSessionTailRequest {
  string session_id = 1;
  // The page ends just before this cursor; 0 means at the latest record.
  uint64 before = 2;
  // When positive, the page starts where one of the person's messages starts
  // a turn, at most this many turns back (fewer when the size bound is
  // reached). Zero: the page is bounded by size alone.
  uint32 turns = 3;
  // About how many bytes of journal the page may hold; 0 selects the Runner's
  // default (1 MiB). A turn larger than this is cut to its latest records.
  // At least one record is returned when any precedes `before`.
  uint32 max_bytes = 4;
}
message ReadSessionTailResponse {
  // Contiguous and ascending, from `start` up to just before `before`. Each
  // record's `retained` is the response's.
  repeated JournalEvent events = 1;
  // The cursor of the first record: 1 when nothing precedes the page.
  uint64 start = 2;
  // The timeline's last cursor when it was read. WatchEvents with `after` set
  // to the last record's cursor continues the page with no gap.
  uint64 retained = 3;
}
message Checkpoint {
  string objective = 1;
  repeated string criteria = 2;
  repeated string decisions = 3;
  repeated string outstanding = 4;
  repeated string results = 5;
  repeated string source_revisions = 6;
  string working_tree_state = 7;
  repeated string command_ids = 8;
  repeated string service_references = 9;
  repeated string omitted_context = 10;
}
message ContinueSessionRequest {
  string session_id = 1;
  string profile_id = 2;
  string mode = 3;
  string reason = 4;
  Checkpoint checkpoint = 5;
}
message CommandRequest {
  string command_id = 1;
}
message StartCommandRequest {
  string session_id = 1;
  string title = 2;
  repeated string argv = 3;
  // The folder to run in: an absolute path to a directory inside the
  // conversation's folder (its workspace). Empty runs in that folder.
  string cwd = 4;
}
message RegisterPipeRequest {
  // The execution whose console shows the output (an agent's `lazybox run`/`log`).
  string session_id = 1;
  string title = 2;
  // Instead of session_id: a workspace run, shown in the console of every
  // conversation in that workspace (`lazybox log` in a workspace terminal).
  string collection_id = 3;
  // With collection_id: the conversation (id or title) whose message box receives
  // the run's compact view when it finishes. The person still decides to send it.
  string share_with = 4;
  // The CLI recognized actual argv as a PR create command. Display titles can be customized.
  bool creates_pull_request = 5;
  // The delivery criterion this run checks (`lazybox run --check ID`): exit 0
  // records an asserted pass, any other exit a failed assertion. Refused unless
  // the conversation's Mission contract or bound spec names the criterion.
  string check = 6;
  // The criterion this run is a prerequisite of (`lazybox run --needs ID`): a
  // non-zero exit records a failed prerequisite. At most one of check and needs.
  string needs = 7;
}
message BindDeliveryRequest {
  string session_id = 1;
  string artifact_id = 2;
  uint32 version = 3;
}
// Exactly one lookup: session_id (that conversation), or mission_id and task_id.
message GetDeliveryOutcomeRequest {
  string session_id = 1;
  string mission_id = 2;
  string task_id = 3;
}
message PublishDeliveryOutcomeRequest {
  string session_id = 1;
  string mission_id = 2;
  string task_id = 3;
  // The verdict snapshot to publish a new version of; empty for a new one.
  string artifact_id = 4;
}
message RecordReviewCriterionRequest {
  string session_id = 1;
  string criterion = 2;
  // "passed" or "failed".
  string result = 3;
}
message RecordReviewCriterionResponse {
  // What was recorded, as a person reads it.
  string note = 1;
}
message DeliveryCriterion {
  string id = 1;
  string expected = 2;
  bool required = 3;
}
message DeliveryContract {
  string artifact_id = 1;
  uint32 version = 2;
  string digest = 3;
  // "spec.v2"; a "spec.v1" contract has no named criteria.
  string schema = 4;
  repeated DeliveryCriterion criteria = 5;
  // The spec artifact's title when the revision was pinned.
  string title = 6;
}
// One observation as a person reads it. command_id names the managed command
// whose output is the evidence; it is read through that command.
message DeliveryEvidence {
  string id = 1;
  // "command", "review".
  string source = 2;
  string reference = 3;
  string command_id = 4;
  optional int32 exit_code = 5;
  string assertion = 6;
  string prerequisite = 7;
  // What this observation alone says: passed, failed, blocked or unverified.
  string state = 8;
  // "available" or "unavailable": whether the command's full output is still kept.
  string output = 9;
  // What ran: the command's title.
  string title = 10;
}
message DeliveryCriterionOutcome {
  string id = 1;
  string expected = 2;
  bool required = 3;
  // passed, failed, blocked, unverified or unrun.
  string state = 4;
  // Every observation on this candidate, in the order recorded.
  repeated DeliveryEvidence evidence = 5;
}
message DeliveryCandidateOutcome {
  string candidate = 1;
  // The workspace holds these files now.
  bool current = 2;
  // passed, failed, blocked, incomplete or unverified.
  string verdict = 3;
  repeated DeliveryCriterionOutcome criteria = 4;
}
// delivery.Outcome on the wire.
message DeliveryOutcome {
  DeliveryContract contract = 1;
  string attempt = 2;
  string conversation_id = 3;
  string mission_id = 4;
  string task_id = 5;
  // The workspace's candidate now; empty when it cannot be read.
  string current = 6;
  // The person's decision on the outcome: "accepted", "rejected" or empty.
  string decision = 7;
  // Newest first: the current candidate, then each one checked.
  repeated DeliveryCandidateOutcome candidates = 8;
}
message DeliveryBinding {
  string conversation = 1;
  // The attempt the conversation's checks now count for.
  string attempt = 2;
  string artifact_id = 3;
  uint32 version = 4;
  string digest = 5;
  // Each criterion as "[id, required|optional] expected".
  repeated string criteria = 6;
  // The spec artifact's title when it was bound.
  string title = 7;
}
message PublishRequest {
  string command_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}
message FinishPipeRequest {
  string command_id = 1;
  string capture_error = 2;
  // What a `lazybox run` gave its agent. Absent for a plain pipe (`lazybox log`).
  CommandReport report = 3;
  // The signal that ended a `lazybox run`'s command (SIGTERM after a stop), if one did.
  string signal = 4;
}
message FollowPipeRequest {
  string command_id = 1;
  // The run went on in the background: the agent's or person's call returned.
  bool background = 2;
  // The command's process (the group that Stop signals), for Processes.
  int32 pid = 3;
  // TCP ports the command's processes listen on.
  repeated uint32 ports = 4;
  // How long to wait for a request before answering, at most 30000 ms; 0
  // reports and answers at once.
  uint32 wait_ms = 5;
}
message FollowPipeResponse {
  // Stop the command: SIGTERM to its process group, SIGKILL after a grace period.
  bool stop = 1;
  // Move the command to the background now (BackgroundCommand).
  bool background = 2;
  // The output bytes the Runner holds, so a CLI that lost a reply resumes there.
  uint64 offset = 3;
}
// CommandReport is what a `lazybox run` gave the agent compared with what the
// command printed, so the console can label the run and telemetry can measure it.
message CommandReport {
  // The command's own exit status, which a pipe's capture cannot observe.
  int32 exit_code = 1;
  // Everything the command printed, stdout and stderr.
  uint64 output_bytes = 2;
  // The size of the view the agent received.
  uint64 agent_bytes = 3;
  // The gortk filter that built the view: "passthrough" when none matched, "raw" for --raw.
  string filter = 4;
  // The file holding the full output; empty when it could not be saved.
  string output_path = 5;
  // The compact view itself (at most 64 KiB), for a workspace run a person can
  // hand to an agent. Empty for an agent's own run: that agent already has it.
  string agent_view = 6;
  // The output came through a pipe (`lazybox log`): exit_code is not the producer's.
  bool piped = 7;
}
message CommandStatus {
  string id = 1;
  string session_id = 2;
  string title = 3;
  string mode = 4;
  uint64 offset = 5;
  bool done = 6;
  optional int32 exit_code = 7;
  string signal = 8;
  string capture_error = 9;
  repeated string argv = 10;
  CommandReport report = 11;
  // Set for a workspace run: it belongs to the workspace, not to one conversation.
  string collection_id = 12;
  // "terminal" for a run published from a workspace terminal; "action",
  // "setup" or "archive" for one the workspace runtime started.
  string origin = 13;
  // The conversation id a terminal run was shared with (`lazybox log --to`).
  string share_with = 14;
  // The folder the command runs in.
  string cwd = 15;
  // A `lazybox run` that went on in the background (a server or a watcher):
  // the agent's or person's call returned and the command keeps running.
  bool background = 16;
  // TCP ports the command's processes listen on, lowest first, while it runs.
  repeated uint32 ports = 17;
  // A `lazybox run` still in the foreground whose CLI follows the Runner:
  // BackgroundCommand can move it to the background.
  bool can_background = 18;
  // When the command started (Unix milliseconds); 0 when not known.
  int64 started_at_unix_millis = 19;
  // The command's process (the session host's program, or a `lazybox run`'s), when known.
  int32 pid = 20;
  // What a finished --check or --needs run recorded, or why it was not recorded.
  string delivery = 21;
  // The criterion a --check or --needs run counts for, as the Runner resolved
  // it at registration: a CLI that asked for one and reads none is talking to
  // a Runner that records no delivery evidence.
  string check = 22;
}
message ListCommandsRequest {
  // The execution's own commands, and the runs of its workspace.
  string session_id = 1;
}
message ClaimCommandShareResponse {
  bool claimed = 1;
  CommandStatus status = 2;
}
message ListCommandsResponse {
  repeated CommandStatus commands = 1;
}
message ReadCommandRequest {
  string command_id = 1;
  uint64 offset = 2;
  uint32 limit = 3;
}
message ReadCommandResponse {
  bytes data = 1;
  CommandStatus status = 2;
  uint64 next_offset = 3;
}
message WatchOutputRequest {
  string command_id = 1;
  uint64 after = 2;
}
message OutputEvent {
  uint64 cursor = 1;
  string captured_at = 2;
  string type = 3;
  string channel = 4;
  uint64 offset = 5;
  bytes data = 6;
  CommandStatus status = 7;
}

// A terminal runs the user's login shell in a workspace directory. Its output
// is addressed by byte offset; only the last bounded scrollback is retained.
message OpenTerminalRequest {
  string collection_id = 1;
  // Workspace-relative directory, for example a member repository; empty for
  // the workspace root. Resolved and confined on the Runner.
  string directory = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  // Retrying with the same key returns the terminal already started.
  string request_key = 5;
  // Instead of a workspace directory: this repository's home checkout
  // (a repository id), or the person's home folder. The terminal still
  // belongs to collection_id (its panel, its credential, its cleanup).
  string repository_home = 6;
  bool user_home = 7;
}
message TerminalRequest {
  string terminal_id = 1;
}
message TerminalStatus {
  string id = 1;
  string collection_id = 2;
  string directory = 3;
  string title = 4;
  string shell = 5;
  uint32 cols = 6;
  uint32 rows = 7;
  // Output end offset, and how many bytes before it are still retained.
  uint64 offset = 8;
  uint64 retained = 9;
  bool done = 10;
  optional int32 exit_code = 11;
  string signal = 12;
  string error = 13;
  int64 created_at_unix_millis = 14;
  // "" for a workspace shell; repository-home, user-home or interactive-command.
  string place = 15;
  // The repository whose home it runs in (place repository-home).
  string repository_id = 16;
  // Where the shell started, for a terminal outside the workspace.
  string cwd = 17;
  // How many command lines the shell said ended (its OSC 133;D mark, from
  // Lazybox's zsh integration), and the latest one's exit status: how a
  // window learns that a command it typed for the person finished.
  uint64 command_ends = 18;
  int32 last_command_status = 19;
  // The shell says when its prompt is ready for input (zsh with Lazybox's
  // integration). Without it, a window waits for the output to settle.
  bool prompt_marks = 20;
  // How many times the shell said its line editor reads a new command line
  // (OSC 133;B). Input written before the first one is echoed, then shown
  // again at the prompt: a window types only after it.
  uint64 prompts_ready = 21;
  // The shell waits at a prompt, in the folder it started in, with nothing
  // running: a window may type a command into it rather than open another.
  bool idle = 22;
}
message ListTerminalsRequest {
  string collection_id = 1;
}
message ListTerminalsResponse {
  repeated TerminalStatus terminals = 1;
}
message WatchTerminalRequest {
  string terminal_id = 1;
  // Byte offset already displayed. Output older than the scrollback is
  // skipped; each event's offset says where its data starts.
  uint64 after = 2;
}
message TerminalEvent {
  uint64 offset = 1;
  bytes data = 2;
  TerminalStatus status = 3;
}
message WriteTerminalRequest {
  string terminal_id = 1;
  bytes data = 2;
}
message ResizeTerminalRequest {
  string terminal_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
}

message VersionRequest {
  // Wait (up to 30 seconds) for a probe of agent_cli in progress, as
  // `lazybox doctor` does, instead of returning the last one.
  bool wait_agent_cli = 1;
}
message VersionResponse {
  string version = 1;
  // Which lazybox agents' shells reach. Unset when this Runner gives agents
  // no CLI, or before its first probe finished.
  AgentCliCheck agent_cli = 2;
}
// AgentCliCheck is which lazybox the shells agents run commands in reach.
// Shell startup files can put another lazybox (V1's) first on PATH; the
// Runner's shell integration puts its own back first (COMMAND_OUTPUT.md).
message AgentCliCheck {
  // This Runner's CLI: what agents should reach.
  string cli = 1;
  // The shell probed: the person's, which agents' commands run in.
  string shell = 2;
  // Another lazybox the person's startup files put first, without the
  // integration, and the shells that do (`zsh -lc`, …). Empty when none.
  string shadow = 3;
  repeated string shadow_in = 4;
  // Shells that reach something else even with the integration, with what
  // they reach. Empty when every probed shell reaches the CLI.
  repeated string unfixed = 5;
  bool fixed = 6;
  // What the person is told, or empty when nothing needs saying.
  string notice = 7;
  // Why the shell could not be probed at all.
  string problem = 8;
  int64 checked_at_unix_millis = 9;
}

// Credentials are submitted explicitly and retained only on the Runner.
