name: Feature request
description: Suggest an improvement or new capability for pilot.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Describing the problem you're hitting — not just the
        feature you have in mind — helps us find the right solution. If this is
        more of a question or open-ended discussion, consider starting a
        [Discussion](https://github.com/AntoineToussaint/pilot/discussions) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and where does pilot get in the way today?
      placeholder: When I have ten workspaces open I can't tell at a glance which ones have failing CI.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like pilot to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing features you tried.
    validations:
      required: false
