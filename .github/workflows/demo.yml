# Re-renders the VHS demo so it never goes stale relative to the UI.
#
# There are two tapes, both driving a real `lazybox --test` session:
#   - demo/lazybox.tape → the pretty README GIF (demo/lazybox.gif + .mp4 + .png).
#                         It spawns a shell, so its text capture carries volatile
#                         content (tempdir suffix, clock, username) and is NOT a golden.
#   - demo/golden.tape  → renders the `?` help overlay (static lazybox chrome,
#                         no live shell). demo/golden.ascii is the committed
#                         golden snapshot — just the keybinding table extracted
#                         from that render (see below).
#
# GOLDEN SNAPSHOT TEST: on a pull request we re-render golden.tape and compare
# the keybinding table against the committed demo/golden.ascii. We compare only
# the table, not VHS's full .ascii capture: that capture is the terminal
# scrollback at end-of-tape, whose repaint count and blank padding vary with
# render timing and across machines, so diffing it whole is flaky. The table
# content is byte-stable, so it only diverges when the UI or a keybinding
# actually changed — i.e. the demo went stale. CI then fails with instructions
# to re-render and commit. This keeps the recorded demo honest without anyone
# having to eyeball the GIF. The pretty GIF is re-rendered too (a smoke test
# that `lazybox --test` still boots) but is not diffed.
#
# We deliberately do NOT auto-commit regenerated artifacts from CI (see the
# main-push job): maintainers regenerate and commit locally so the binary GIF
# stays reviewable; the golden check just guards drift.

name: demo

on:
  pull_request:
    paths:
      - "demo/**"
      - "crates/**"
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: render
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-build-env

      - name: Build lazybox (release)
        run: cargo build --release -p lazybox-tui

      - name: Put lazybox on PATH
        # Both tapes invoke `lazybox --test`; make the freshly built binary
        # resolvable for the VHS render steps below.
        run: echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: Install VHS and render dependencies
        # We install VHS + ttyd + ffmpeg ourselves instead of using
        # charmbracelet/vhs-action: that action unconditionally calls its
        # `installLatestFfmpeg`, which is hard-coded to the `ffmpeg-n5.1`
        # asset of BtbN/FFmpeg-Builds. That asset no longer exists in the
        # latest release (now n7.1 / n8.1), so the action always fails with
        # "Failed to install ffmpeg" with no opt-out. ffmpeg comes from apt;
        # ttyd is pinned to a release static binary because apt's ttyd on
        # ubuntu-22.04 is 1.6.3 and VHS requires >= 1.7.2; VHS itself is
        # pinned to a tagged release so renders are reproducible (bump
        # deliberately).
        #
        # JetBrains Mono is installed and pinned because it is VHS's default
        # font and the golden snapshot's byte-stability depends on the cell
        # grid, which is derived from the font's metrics. Without the exact
        # font present the Linux render falls back to a different monospace,
        # shifting the column/row layout and breaking the golden diff.
        env:
          VHS_VERSION: v0.11.0
          TTYD_VERSION: 1.7.7
          JETBRAINS_MONO_VERSION: "2.304"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig
          # JetBrains Mono (VHS default font) — pinned for reproducible renders.
          curl -sfL "https://github.com/JetBrains/JetBrainsMono/releases/download/v${JETBRAINS_MONO_VERSION}/JetBrainsMono-${JETBRAINS_MONO_VERSION}.zip" -o /tmp/jbmono.zip
          mkdir -p "$HOME/.local/share/fonts"
          unzip -o -j /tmp/jbmono.zip 'fonts/ttf/*.ttf' -d "$HOME/.local/share/fonts"
          fc-cache -f
          fc-list | grep -i "jetbrains mono" | head
          # ttyd: apt's ubuntu-22.04 build is 1.6.3, VHS needs >= 1.7.2.
          curl -sfL "https://github.com/tsl0922/ttyd/releases/download/${TTYD_VERSION}/ttyd.x86_64" -o /tmp/ttyd
          sudo install /tmp/ttyd /usr/local/bin/ttyd
          ttyd --version
          dir="vhs_${VHS_VERSION#v}_Linux_x86_64"
          curl -sfL "https://github.com/charmbracelet/vhs/releases/download/${VHS_VERSION}/${dir}.tar.gz" -o /tmp/vhs.tar.gz
          tar -xzf /tmp/vhs.tar.gz -C /tmp
          sudo install "/tmp/${dir}/vhs" /usr/local/bin/vhs
          vhs --version

      - name: Render demo (smoke test)
        # A failure here means `lazybox --test` no longer boots or the tape broke.
        run: vhs demo/lazybox.tape

      - name: Render golden snapshot
        run: vhs demo/golden.tape

      - name: Upload freshly rendered golden (PR only)
        # Publishes the Linux-rendered golden.ascii so a mismatch in the
        # check below can be diagnosed (and the canonical render adopted)
        # without guessing. Runs before the check so it captures the render
        # even when the diff fails the job.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: golden-ascii-rendered
          path: demo/golden.ascii

      - name: Check golden snapshot (PR only)
        if: github.event_name == 'pull_request'
        # The committed demo/golden.ascii holds ONLY the keybinding table — the
        # byte-stable, machine-independent part of the `?` overlay. We do NOT
        # diff VHS's raw .ascii: that file is the terminal scrollback at
        # end-of-tape, a vertical stack of however many full-screen repaints
        # happened before capture, and both the repaint count and the blank
        # padding around them vary with render timing and across machines
        # (Linux CI vs. a dev's macOS). Diffing the whole capture is therefore
        # inherently flaky — the historical failures were a partial last frame
        # (table truncated mid-row) or a differing number of stacked frames,
        # neither of which means the UI changed.
        #
        # Instead extract the last COMPLETE keybinding table from the fresh
        # render and diff just that. We anchor the table's END on the bottom
        # row's `exit to sidebar` cell (the `]]` leave binding), which is
        # unique — unlike `snippets`, which now labels both the global `]`
        # browser row and the terminal `]]<key>` leader row, so anchoring on
        # it would stop mid-table. The tape's `Wait+Screen` still guarantees
        # the overlay is fully painted before capture, so a complete block
        # always exists; the table content only changes when the UI or a
        # keybinding actually changes, which is exactly what this guards.
        run: |
          awk '/Tab .* cycle panes/{c=1;b=""} c{b=b $0 ORS} c&&/exit to sidebar/{last=b;c=0} END{printf "%s",last}' \
            demo/golden.ascii > demo/golden.ascii.table
          if [ ! -s demo/golden.ascii.table ]; then
            echo "::error::No complete keybinding table found in the rendered overlay — the render did not settle. Re-run the job."
            exit 1
          fi
          mv demo/golden.ascii.table demo/golden.ascii
          if ! git diff --exit-code demo/golden.ascii; then
            echo "::error::demo/golden.ascii is stale. The lazybox UI or a keybinding changed but the demo was not regenerated."
            echo "Re-render locally and commit the result (the tape writes the full"
            echo "scrollback; extract the table with the same awk this check uses):"
            echo "  cargo build -p lazybox-tui   # or: make build"
            echo "  PATH=\"\$PWD/target/debug:\$PATH\" vhs demo/golden.tape && PATH=\"\$PWD/target/debug:\$PATH\" vhs demo/lazybox.tape"
            echo "  awk '/Tab .* cycle panes/{c=1;b=\"\"} c{b=b \$0 ORS} c&&/exit to sidebar/{last=b;c=0} END{printf \"%s\",last}' demo/golden.ascii > t && mv t demo/golden.ascii"
            echo "  git add demo/golden.ascii demo/lazybox.gif demo/lazybox.mp4 demo/lazybox.png && git commit"
            exit 1
          fi

      - name: Upload regenerated assets (main only)
        # On main, publish the freshly rendered assets for inspection. We do
        # NOT commit them from CI — maintainers regenerate and commit locally
        # so the binary diff stays reviewable. The PR golden check guards drift.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lazybox-demo
          path: |
            demo/lazybox.gif
            demo/lazybox.mp4
            demo/golden.ascii
