[workspace]
resolver = "2"

members = [
    "crates/core",
    "crates/auth",
    "crates/store",
    "crates/config",
    "crates/git-ops",
    "crates/gh-provider",
    "crates/slack-provider",
    "crates/tui-term",
    "crates/ipc",
    "crates/server",
    "crates/agents",
    "crates/linear-provider",
    "crates/llm-proxy",
    "crates/tui-core",
    "crates/tui",
    # Vendored from https://github.com/Uzaaft/libghostty-rs (commit
    # f27655a). Includes lazybox's local Zig-version + xcframework
    # patches that haven't shipped upstream yet. Vendored so a fresh
    # clone of lazybox builds standalone — no sibling-clone dance.
    "crates/libghostty-vt",
    "crates/libghostty-vt-sys",
]

# Lazybox's own crates opt into this lint config via `[lints]
# workspace = true` in their Cargo.toml. The two vendored libghostty
# crates do not, so `cargo clippy --workspace` only fails on issues
# in lazybox code — upstream noise stays upstream.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
# (defaults — tighten here if you want to enforce a style)

# ── cargo-dist (release plumbing) ───────────────────────────────────────
#
# `dist` reads this section to scaffold GitHub Releases, a Homebrew
# formula, and a curl-able `install.sh`. Triggered by pushing a tag
# matching the `tag-namespace` shape (e.g. `v0.1.0`). Bump
# `[workspace.package].version` first, then `git tag v0.1.0 && git
# push --tags` to fire the release workflow generated under
# `.github/workflows/release.yml`.
#
# The CI workflow needs Zig installed before `cargo build` runs — see
# the `pre-build` step in the generated release workflow.

[workspace.metadata.dist]
# Use the latest stable cargo-dist on every CI run.
cargo-dist-version = "0.28.0"
# Generic CI generator (GitHub Actions specifically).
ci = ["github"]
# What kinds of installer to publish alongside the prebuilt binaries.
# `shell` = `curl ... | sh` script for Linux/macOS.
# `homebrew` = a tap-pushed Homebrew formula.
installers = ["shell", "homebrew"]
# Enable the dedicated Homebrew publish job that pushes the formula to the tap
# (needs the HOMEBREW_TAP_TOKEN secret). Without this, the formula is generated
# but never pushed.
publish-jobs = ["homebrew"]
# Tap repo to push the Homebrew formula to. Must exist + give the
# release workflow write access via a deploy key or PAT.
tap = "AntoineToussaint/homebrew-lazybox"
# Build matrix. Both macOS arches + Linux x64. Intel macOS is cross-compiled on
# the macos-14 (Apple Silicon) runner — see github-custom-runners below — to
# avoid the scarce macos-13 runners. aarch64-unknown-linux-gnu is still deferred
# (a Zig libc++ sub-compilation error on that target).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
# Extra runner setup steps. libghostty-vt's build.rs invokes
# `zig build` during compilation — every CI runner needs Zig 0.15.2+
# on PATH. cargo-dist surfaces these to the generated workflow.
github-build-setup = "../release-setup.yml"
# Publish all pushes to GitHub Releases (including pre-releases).
pr-run-mode = "plan"
# Override dist's default runners: it picks macos-13 (Intel, scarce) for the
# Apple-Silicon build and the retired ubuntu-20.04 for Linux. `global` sets the
# runner for the orchestration jobs (plan/host/publish/announce).
[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-22.04"
aarch64-apple-darwin = "macos-14"
# Build Intel macOS on the Apple-Silicon runner (cross-compile) — macos-13
# Intel runners are scarce and stall the release.
x86_64-apple-darwin = "macos-14"
x86_64-unknown-linux-gnu = "ubuntu-22.04"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/AntoineToussaint/lazybox"
homepage = "https://lazybox.ai"
readme = "README.md"
# Lazybox ships as a single binary built by cargo-dist (see
# `[workspace.metadata.dist]`); the individual workspace crates are
# internal and not published to crates.io. Marking them
# `publish = false` keeps an accidental `cargo publish` from
# uploading them and lets cargo-deny treat the path-based wildcards
# between sibling crates as "private", not real wildcard pins.
publish = false

[workspace.dependencies]
# ── Shared library crates ──────────────────────────────────────────────
lazybox-core        = { path = "crates/core" }
lazybox-auth        = { path = "crates/auth" }
lazybox-store       = { path = "crates/store" }
lazybox-config      = { path = "crates/config" }
lazybox-git-ops     = { path = "crates/git-ops" }
lazybox-gh          = { path = "crates/gh-provider" }
lazybox-slack       = { path = "crates/slack-provider" }
lazybox-tui-term    = { path = "crates/tui-term" }
lazybox-tui-core    = { path = "crates/tui-core" }

# ── Daemon-side crates ─────────────────────────────────────────────────
lazybox-ipc       = { path = "crates/ipc" }
lazybox-agents    = { path = "crates/agents" }
lazybox-llm-proxy = { path = "crates/llm-proxy" }

# ── Third-party ────────────────────────────────────────────────────────
tokio              = { version = "1", features = ["full"] }
futures            = "0.3"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
bincode            = "1.3"
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm          = { version = "0.29", features = ["event-stream"] }
ratatui            = "0.30"
tuirealm           = "4.1"
tui-markdown       = "0.3"
chrono             = { version = "0.4", features = ["serde"] }
portable-pty       = "0.8"
rusqlite           = { version = "0.32", features = ["bundled"] }
parking_lot        = "0.12"
octocrab           = "0.44"

# Vendored libghostty-rs — see `crates/libghostty-vt` and
# `crates/libghostty-vt-sys`. Both build a Zig-compiled C library
# under the hood (the build.rs fetches ghostty's source on first
# compile).
libghostty-vt     = { path = "crates/libghostty-vt" }
libghostty-vt-sys = { path = "crates/libghostty-vt-sys" }

# The release profile cargo-dist (`dist`) builds with: `cargo build --profile
# dist`. cargo-dist requires this to exist (normally added by `dist init`);
# without it the build fails with "profile `dist` is not defined". Mirrors the
# profile cargo-dist generates by default.
[profile.dist]
inherits = "release"
lto = "thin"
