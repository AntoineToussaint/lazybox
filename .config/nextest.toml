# cargo-nextest for the Rust tests: `make check-desktop` runs the Tauri crate's
# (apps/desktop/src-tauri) and the snippet helper's (tools/lazybox-snippets).
#
# Every unit test finishes within 30 seconds (AGENTS.md). cargo test has no
# per-test deadline; nextest runs each test in its own process and ends one
# still running after `period`, naming it. The two crates are separate Cargo
# workspaces, so the Makefile passes this file with --config-file rather than
# relying on a .config/nextest.toml at each workspace root.
# scripts/unit-test-timeouts.mjs fails the gate catalog if this changes.

# The version CI installs (.github/workflows/ci.yml, NEXTEST_VERSION) and
# make install-check asks for. Bump them together.
nextest-version = { required = "0.9.152" }

[profile.default]
slow-timeout = { period = "30s", terminate-after = 1 }
