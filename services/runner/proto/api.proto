  bool live_model = 12;
}
message AgentEvent {
  string type = 1;
  string session_reference = 2;
  string turn_id = 3;
  string request_id = 4;
  string operation_id = 5;
  string text = 6;
  string status = 7;
  bytes provider_data_json = 8;
  string agent_id = 9;
  string parent_agent_id = 10;
  string name = 11;
  string agent_kind = 12;
  string native_id = 13;
  AccountObservation account = 14;
  bool terminal_agent_input = 15;
}
message Session {
  string id = 1;
  string profile_id = 2;
  string provider_reference = 3;
  string gateway_id = 4;
  bool busy = 5;
  bool closed = 6;
  string fault = 7;
  uint32 queued = 8;
  Capabilities capabilities = 9;
  repeated AgentEvent pending = 10;
  string work_id = 11;
  string previous_execution_id = 12;
  string collection_id = 13;
  string working_directory = 14;
  string status = 15;
  repeated AgentActivity agents = 16;
  AccountObservation account = 17;
  bool activity_truncated = 18;
  string purpose = 19;
  repeated string rotation_profile_ids = 20;
  string conversation_id = 21;
  string title = 22;
  bool historical = 23;
  bool recovery_required = 24;
  string resume_blocked = 25;
  int64 created_at_unix_millis = 26;
  string successor_execution_id = 27;
  string provider = 28;
  string model = 29;
  bool model_reported = 30;
  // Current permission mode: inherit (empty), ask, read-only or yolo.
  string permission = 31;
  string workflow = 32;
  // The shared agent instructions changed since this session received them;
  // the update is delivered with the next message.
  bool instructions_pending = 33;
  // The tail of the main agent's latest message, at most 512 bytes.
  string last_message = 34;
  // The conversation's agent browser, while it is open or was stopped.
  BrowserState browser = 35;
  // The messages waiting for the turn in progress, oldest first (queued counts them).
  repeated QueuedMessage queued_messages = 36;
  // When the person pinned the conversation to the top of their lists; 0 when
  // not pinned. Kept by the Runner, so every window and a paired phone agree.
  int64 pinned_at_unix_millis = 37;
  // When the person archived the conversation; 0 when not archived. Archived
  // conversations leave the working lists but stay in History.
  int64 archived_at_unix_millis = 38;
  // Where this conversation sits in an agent tree, when it does.
  SessionLineage lineage = 39;
  // The "always allow" choices the person made for this conversation that
  // its agent holds, oldest first. They outlive the agent's process: a
  // restarted or resumed agent holds them again. ApplyRequest.revoke_grant
  // takes one back. Choices saved to the workspace's own settings are not
  // listed: they are the agent's.
  repeated PermissionGrant permission_grants = 40;
  // Whether its agent has the agent browser (BROWSER.md): "has"; "can_give"
  // (it started without it, or the browser is off for its workspace: Give
  // the browser fixes that); "off" (off in Settings → Browser); empty where
  // the browser does not apply (no service, assistants, ACP agents, ended).
  string browser_access = 41;
  string behavior_profile = 42;
  string forked_from_session_id = 43;
  uint64 forked_from_cursor = 44;
  string effort = 45;
  // What kind of agent this is, as the Runner defines it from its purpose
  // (agent/types.go): where it is shown, what reaches the inbox, how it ends.
  AgentType agent_type = 46;
}
// AgentType is one kind of agent: a coding agent, a reviewer, an artifact
// companion, an Ask Lazybox assistant. Clients read these instead of
// matching purposes.
message AgentType {
  // The purpose it is defined for ("coding", "reviewer", "artifact", "help", …).
  string name = 1;
  // How people call it: "Coding agent", "Reviewer".
  string label = 2;
  // Listed as a conversation of its own (sidebar, tabs, workspace lists).
  bool listed = 3;
  // Its questions, approvals and failures reach the inbox and notifications.
  bool reaches_inbox = 4;
  // Its job ends once its work is handed on (a reviewer's findings sent).
  bool close_when_delivered = 5;
  // Works in a workspace: edits files, takes interactive commands.
  bool workspace = 6;
  // Starts other agents, conversations and missions.
  bool delegates = 7;
  // How a client shows it: "chat", "reviewer", "companion" or "assistant".
  string ui = 8;
}
// PermissionGrant is one "always allow" of a conversation.
message PermissionGrant {
  string id = 1;
  // What it allows, in words: "commands starting with `npm run`".
  string label = 2;
  // The agent's tool it applies to (Bash, mcp__lazybox__command…).
  string tool = 3;
  int64 granted_at_unix_millis = 4;
}
// SessionLineage nests conversations by who started them: an orchestrator's
// children name it as their parent.
message SessionLineage {
  // The orchestrator conversation that started this one.
  string parent_conversation_id = 1;
  string parent_title = 2;
  string mission_id = 3;
  string mission_title = 4;
  string task_id = 5;
  string role = 6;
  // This conversation holds an Orchestrator grant in force.
  string grant_id = 7;
  uint32 live_children = 8;
  uint32 max_children = 9;
}
// QueuedMessage is a message accepted while the agent was busy, waiting to be
// delivered as the next turn.
message QueuedMessage {
  string operation_id = 1;
  // The start of the message, at most 280 characters.
  string text = 2;
  int64 queued_at_unix_millis = 3;
  // Set on a message Lazybox wrote rather than the person.
  MessageOrigin origin = 4;
  // Automatic and manual delivery are paused while a person edits this message.
  bool editing = 5;
}
// MessageOrigin marks a message Lazybox wrote, not the person: the answer to a
// repository request, a review's findings, a question between two agents, a
// mission's brief. The agent receives the message's text unchanged; clients
// show it as an event of the conversation, never as the person's words. The
// operation_accepted record of such a message carries the same fields as
// `origin` in its provider data.
message MessageOrigin {
  // repository_added, repository_declined, review_brief, review_findings,
  // review_round, agent_ask, agent_answer, mission_brief, continuation, or
  // between an orchestrator and an agent it started: agent_brief, agent_note
  // or agent_report.
  string kind = 1;
  // The event in one line: "Added authority to this workspace".
  string summary = 2;
  // A short label beside it: a branch, "Round 2 of 3".
  string detail = 3;
  // What the event offers to copy (a path).
  string copy = 4;
  // The agent the message speaks for ("Codex"); empty is Lazybox.
  string from = 5;
  // From's conversation and session, when it is another agent of this one's
  // tree (an orchestrator and the agents it started): clients open it.
  string conversation = 6;
  string session = 7;
}

