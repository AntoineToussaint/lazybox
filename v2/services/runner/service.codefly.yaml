name: runner
version: 0.0.0
agent:
    kind: codefly:service
    name: go-grpc
    version: 0.1.69
    publisher: codefly.dev
endpoints:
    - name: grpc
    - name: connect
spec:
    debug-symbols: false
    hot-reload: true
    race-condition-detection-run: false
    source-dir: ""
    with-cgo: false
    with-workspace: false
    connect-endpoint: true
    cors: {}
    docker-image: ""
    health:
        mode: grpc
    protocol-output-dirs: []
    protocol-source-dir: ""
    rest-endpoint: false
    runtime-assets: []
