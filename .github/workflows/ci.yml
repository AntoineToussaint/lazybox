# Build + test on every PR / main push. Catches regressions before
# they hit a release tag.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Install C toolchain (Linux)
        if: runner.os == 'Linux'
        # The Zig-built ghostty static archive vendors simdutf /
        # highway / std::optional from libc++ (LLVM's C++ stdlib,
        # symbols namespaced `std::__1::`), NOT libstdc++ (GNU's,
        # `std::__cxx11::`). Linking with -lstdc++ leaves every
        # libc++ symbol unresolved (`std::__1::basic_string`,
        # `typeinfo for std::bad_optional_access`, `hwy::Abort`,
        # …). Install libc++ + libc++abi so the build script can
        # link them.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc++-dev libc++abi-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
