[package]
name = "lazybox-llm-proxy"
description = "Local HTTP pass-through that records lazybox agent telemetry."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lazybox-core       = { workspace = true }
# Wire types (ProxyRecord / ToolCall / ApiProvider) live in lazybox-ipc
# so the protocol crate stays at the bottom of the dep graph. This
# crate re-exports them for backward compatibility with existing
# `lazybox_llm_proxy::ProxyRecord` call sites.
lazybox-ipc        = { workspace = true }
serde            = { workspace = true }
serde_json       = "1"
tokio            = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
chrono           = { workspace = true }

# HTTP server: hyper 1.x + hyper-util for the listener.
hyper            = { version = "1", features = ["server", "http1"] }
hyper-util       = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
http-body-util   = "0.1"
bytes            = "1"

# Upstream HTTP client — reqwest handles TLS + redirect + keep-alive.
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
bincode          = "1.3"
# Mock upstream in tests reuses the same hyper/reqwest stack as the
# server. Listed here so the lib stays slim at build time.
tokio            = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
