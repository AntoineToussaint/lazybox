<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner Radar</title>
<link rel="stylesheet" href="_lazybox/lazybox.css">
<link rel="stylesheet" href="radar.css">
<script src="_lazybox/lazybox.js"></script>
<script src="_lazybox/workflow.js" defer></script>
<script src="_lazybox/attention-pages.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="workflow">
<header><h1>Runner Radar</h1><p id="scope">Runner</p></header>
<label class="state-filter">Show <select aria-label="Blocked state" id="state">
  <option value="all">All blocked</option><option value="needs-input">Needs input</option><option value="failed">Failed</option>
</select></label>
<label class="state-filter">Order <select aria-label="Order" id="order"><option value="oldest">Oldest first</option><option value="newest">Newest first</option></select></label>
<p id="notice" role="status">Loading…</p>
<ul id="rows" aria-label="Blocked conversations"></ul>
<nav id="history-pages" aria-label="Conversation history" hidden>
  <button type="button" data-newer>Newer conversations</button>
  <output></output>
  <button type="button" data-older>Older conversations</button>
</nav>
</body>
</html>
