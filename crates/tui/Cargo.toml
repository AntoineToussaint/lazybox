[package]
name = "lazybox-tui"
description = "The lazybox TUI library: realm model, panes, modals — a thin renderer over the IPC contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[lib]
name = "lazybox_tui"
path = "src/lib.rs"

[dev-dependencies]
# Golden-snapshot testing. Use `cargo insta review` to accept
# intentional render changes; otherwise CI catches regressions.
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "terminal_feed"
harness = false

# A thin renderer over IPC (#548): the UI library depends only on the wire
# crate, pure TUI logic, the embedded terminal, config, and core. The
# daemon, store, providers, and agents are reached through the boot crate
# (`lazybox-tui-boot`) and the IPC contract — enforced by the dep-rules
# test, so a `use lazybox_store::…` here is a compile error.
[dependencies]
lazybox-core       = { workspace = true }
lazybox-config     = { workspace = true }
lazybox-tui-term   = { workspace = true }
lazybox-tui-core   = { workspace = true }
lazybox-ipc        = { workspace = true }
tuirealm         = { workspace = true }
libghostty-vt    = { workspace = true }

tokio            = { workspace = true }
anyhow           = { workspace = true }
tracing          = { workspace = true }
crossterm        = { workspace = true }
libc             = { workspace = true }
ratatui          = { workspace = true }
chrono           = { workspace = true }
serde_json       = { workspace = true }
serde_yaml       = { workspace = true }
pulldown-cmark   = { workspace = true }
uuid             = { version = "1", features = ["v4"] }

[lints]
workspace = true
