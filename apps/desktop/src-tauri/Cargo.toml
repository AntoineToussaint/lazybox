[package]
name = "lazybox-v2-desktop"
version = "0.0.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
# `unstable` is Tauri's multiwebview: a Web panel is a child webview of the
# window it is docked in (WORKSPACES.md, "The Web panel").
tauri = { version = "=2.12.7", features = ["dynamic-acl", "unstable"] }
tauri-plugin-http = "=2.9.0"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.11"
tempfile = "3"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-updater = "=2.14.1"
base64 = "0.23"
# The notification center answers on its own threads: a oneshot and a timeout
# await it without holding a blocking thread (src/attention.rs). Tauri's runtime.
tokio = { version = "1", default-features = false, features = ["sync", "time"] }

[dev-dependencies]
glob = "0.3"

# `lazybox shot` (src/capture.rs): the window's own WKWebView snapshot. The
# same crates and versions Tauri and wry already use, with the features it needs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSData", "NSDictionary", "NSError", "NSString", "NSURL", "NSLocale", "NSSet", "NSArray", "NSEnumerator", "NSOperation", "NSObjCRuntime", "NSUserDefaults", "NSGeometry", "NSBundle"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSResponder", "NSWindow", "NSButton", "NSControl", "NSGraphics", "NSWorkspace"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKSnapshotConfiguration"] }
# Voice (src/voice.rs): dictation with the Speech framework on-device, the
# microphone through AVAudioEngine, and read-aloud with AVSpeechSynthesizer.
objc2-speech = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionTask", "SFSpeechRecognitionResult", "SFSpeechRecognitionMetadata", "SFTranscription", "SFSpeechRecognitionTaskHint"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioFormat", "AVAudioBuffer", "AVAudioTime", "AVAudioTypes", "AVSpeechSynthesis"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
# Notifications (src/notifications_macos.rs): UNUserNotificationCenter, which
# asks for permission and reports what macOS did, unlike the deprecated
# NSUserNotification path tauri-plugin-notification takes (it drops errors).
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNError", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger", "UNNotificationSound"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
