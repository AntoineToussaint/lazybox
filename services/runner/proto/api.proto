  // The provider's stable key: owner/name#number on GitHub, PAY-142 on Linear.
  string key = 2;
}
message ItemState {
  // open, started, review, done, closed or merged: the same words for every provider.
  string category = 1;
  // The provider's own words ("In Review").
  string label = 2;
}
message ItemCheck { string name = 1; string url = 2; }
// What a code review item adds (a GitHub pull request; later a merge request).
message ItemPullRequest {
  string head = 1; string base = 2; bool draft = 3;
  // success, failure, pending, none when the head has no checks, or incomplete
  // when it has more than the Runner reads at once and none of those read fails.
  string checks = 4;
  // approved, changes_requested, review_required, or empty when none is asked for.
  string review = 5;
  bool mergeable = 6;
  repeated ItemCheck failing_checks = 7;
  string head_sha = 8;
  // GitHub's mergeable_state: clean, blocked, behind, dirty (conflicts), unstable, draft or unknown.
  string mergeable_state = 9;
  // How many checks the head has, failing ones included.
  uint32 checks_total = 10;
  // When it was merged or closed; zero while open.
