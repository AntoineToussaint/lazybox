<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Watch</title>
<link rel="stylesheet" href="_lazybox/lazybox.css">
<link rel="stylesheet" href="release.css">
<script src="_lazybox/lazybox.js"></script>
<script src="_lazybox/workflow.js" defer></script>
<script src="app.js" defer></script>
</head>
<body class="workflow">
<header><h1>Release Watch</h1><p id="scope">Runner</p></header>
<div class="release-tools"><label>Show <select aria-label="Release activity filter" id="activity"><option value="attention">Needs attention</option><option value="approval">Deployment approvals</option><option value="failures">Failed checks and deployments</option><option value="all">All release activity</option></select></label><button type="button" id="inbox">Open Inbox</button></div>
<p id="notice" role="status">Loading…</p>
<ul id="rows" aria-label="Release activity"></ul>
</body>
</html>
