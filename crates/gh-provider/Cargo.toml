[package]
name = "lazybox-gh"
description = "GitHub PRs and Issues provider for lazybox via octocrab polling."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lazybox-auth = { workspace = true }
lazybox-core = { workspace = true }
octocrab = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# `http` is the type plumbing octocrab uses for its low-level
# `_get_with_headers` API — we set the `If-Modified-Since` header
# directly so the notifications heartbeat can answer 304. Pin matches
# what octocrab 0.54 already depends on so there's no duplicate.
http = "1.4"
# The device-flow OAuth login (`oauth.rs`) POSTs form bodies to
# github.com's login endpoints, which live outside octocrab's api.github.com
# base. Feature set mirrors linear-provider so the TLS backend is shared.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# GitHub App auth (`app_auth.rs`). `jsonwebtoken` builds the RSA signing key
# octocrab's `.app()` takes, and `secrecy` unwraps the `SecretString` octocrab
# returns for an installation token. Both versions match octocrab's own pins
# so neither adds a second copy to the tree — and they MUST: `.app()` takes
# jsonwebtoken 10's `EncodingKey`, so a lone major bump here does not compile.
# `.github/dependabot.yml` holds jsonwebtoken majors back until octocrab moves.
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem"] }
secrecy = "0.10"

[dev-dependencies]
tempfile = "3"
# `test-util` powers `#[tokio::test(start_paused = true)]`, which the
# request-permit deadline test uses to elapse a 30s virtual timeout
# instantly.
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
