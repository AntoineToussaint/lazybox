[package]
name = "lazybox-relay"
description = "Rendezvous relay: brokers client↔box by box-id and forwards ciphertext only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The relay is a separate codefly-hosted deployable, not part of the
# `lazybox` client installers. Keep cargo-dist's brew/shell installers
# from bundling it.
[package.metadata.dist]
dist = false

[[bin]]
name = "lazybox-relay"
path = "src/bin/lazybox-relay.rs"

[dependencies]
lazybox-config      = { workspace = true }
lazybox-entitlement = { workspace = true }
lazybox-identity    = { workspace = true }
serde              = { workspace = true }
bincode            = { workspace = true }
thiserror          = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
uuid               = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# The broker's encrypted-path test wraps the brokered stream in the E2E
# channel exactly as the box/client do; the deny-gate test drives the
# entitlement seam. Both are test-only edges.
bytes                  = "1"
http-body-util         = "0.1"
hyper                  = { version = "1", features = ["server", "http1"] }
hyper-util             = { version = "0.1", features = ["server", "tokio"] }
lazybox-e2e-channel = { workspace = true }
lazybox-entitlement = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
