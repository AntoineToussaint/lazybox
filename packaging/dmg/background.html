<!doctype html>
<!--
  The disk image window's background (660 × 400 points). Rendered to
  background.png and background@2x.png by scripts/release/dmg-background.mjs;
  the icon positions in dmg-settings.py sit on the two circles' centres.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, #fbfbfd 0%, #eef0f5 100%);
    color: #1d1d1f;
    position: relative;
  }
  .slot { position: absolute; top: 120px; width: 140px; height: 140px; border-radius: 32px; background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(0,0,0,.05); }
  .slot.app { left: 95px; }
  .slot.apps { left: 425px; }
  svg { position: absolute; left: 250px; top: 165px; }
  h1 { position: absolute; top: 34px; width: 100%; margin: 0; text-align: center; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  p { position: absolute; top: 318px; width: 100%; margin: 0; text-align: center; font-size: 12.5px; color: #6e6e73; line-height: 1.5; }
</style>
</head>
<body>
  <h1>Install Lazybox</h1>
  <div class="slot app"></div>
  <div class="slot apps"></div>
  <svg width="160" height="50" viewBox="0 0 160 50" aria-hidden="true">
    <path d="M8 25 H142" stroke="#8a93a6" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 14"/>
    <path d="M124 9 L150 25 L124 41" fill="none" stroke="#5b6478" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <p>Drag Lazybox onto the Applications folder, then open it from Applications.<br>It sets up its background service the first time it opens.</p>
</body>
</html>
