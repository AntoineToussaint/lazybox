message RepositoryHome {
  string repository_id = 1;
  // owner/repo when known, else the repository's name.
  string name = 2;
  // "" when the repository has no home.
  string path = 3;
  // configured, source or "" (none).
  string kind = 4;
  bool exists = 5;
  string branch = 6;
  bool detached = 7;
  // Changed and untracked files (at most 1000 counted).
