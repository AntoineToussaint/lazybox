- key: adr
  category: Docs
  description: Write an ADR for this decision
  body: 'Write a short Architecture Decision Record for the decision we just made: the context and forces, the options considered with their trade-offs, the decision, and its consequences (good and bad). Follow any existing ADR format and numbering in the repo. Be honest about what we''re giving up, not just why we''re right. Open it with a one-line summary of the decision, then the full detail below. The verdict names the ADR number and the decision it records.'
  origin: built-in
  next: []
- key: alloc
  category: Performance
  description: Reduce allocations in the hot path
  body: Find avoidable allocations and copies in the hot path I point you at — reuse buffers, borrow instead of clone, drop intermediate collections — and remove them only where a measurement shows it helps and the code stays readable. Confirm the win with a before/after benchmark and keep the tests green. Lead with the per-site detail (what allocated, the fix, the measured win). The verdict names the total measured reduction.
  origin: built-in
  next: []
- key: amend
  category: Git & PR
  description: Amend the last commit
  body: Fold the current working changes into the previous commit with `git commit --amend`, keeping the existing message unless it no longer describes the result. Only do this when the previous commit hasn't landed on a shared branch (an unmerged PR branch is fine) — if it has, stop and flag it rather than rewriting shared history. When done, report the amended commit. The verdict names the branch, the amended SHA, and whether a force-with-lease push is now needed.
  origin: built-in
  next: []
- key: arch
  category: Review
  description: Design & architecture review (staff-engineer lens)
  body: Review this change the way a staff engineer would — past line-level bugs, at the design. Does the change belong in this layer, or is it in the wrong place? Are the module boundaries, data flow, and ownership right, or does it add coupling that will bite later? Is there a materially simpler shape that does the same job? What's the blast radius, and the rollback story if it's wrong? Judge it against the patterns already in this codebase, not an ideal in the abstract — but "it matches the existing pattern" and "it degrades safely" are not defenses; a safe-looking default can hide a footgun, so name what specifically makes each choice safe or don't accept it. Lead with the detailed design findings, each with a `file:line` anchor and the reasoning, ordered by leverage. Name the two or three highest-leverage changes and the one risk you'd keep watching. If the design is sound, say so and name that risk. The verdict names the highest-leverage change and the one risk you'd keep watching.
  origin: built-in
  next: []
- key: attach
  category: Linear
  description: Link the PR to the Linear issue
  body: Connect this PR to its Linear issue so both sides cross-reference. Put the issue identifier (e.g. `ENG-123`) in the PR title or body — Linear's GitHub integration links them automatically from that magic word — and confirm the link shows up on the Linear issue. If the integration isn't wired up, instead add a comment on the issue with the PR URL and a comment on the PR with the issue link. The verdict names the linked issue identifier and PR number.
  origin: built-in
  next: []
- key: audit
  category: Review
  description: 'Full pre-ship review: correctness, design, security, perf, tests'
  body: 'Give the current diff (`git diff` against the base branch) the full pre-ship review, one lens at a time, reviewing adversarially — assume there IS a bug, each finding is real until you refute it with a concrete input that proves it can''t happen, and a safe-looking default is a claim to disprove, not a resting place. Correctness: logic errors, off-by-one, unhandled errors and edge cases. Design: are the boundaries and abstractions right, does it fit the surrounding code, is there a simpler shape. Security: untrusted input crossing a trust boundary, authz, injection, secret handling. Performance: allocations or I/O added to a hot path, N+1s, accidental quadratics. Tests: do they actually exercise the new behavior and its failure paths. In scope is everything the diff touches and everything that breaks because of it; scope is not an escape hatch, and "out of scope," "not worth the complexity," and "degrades gracefully" are banned as reasons to drop a finding. Lead with the full detail: for each finding, trace the real code path and give a concrete failure scenario — the input or state that produces the wrong result — with a `file:line` anchor, grouped by lens and ranked by severity; if a lens is genuinely clean, say so in one line rather than padding the list. The verdict names how many blockers remain and the most severe one.'
  origin: built-in
  next: []
- key: bench
  category: Performance
  description: Add a benchmark
  body: Add a benchmark that captures the performance characteristic we care about here, using the project's existing benchmarking setup if there is one. Make it representative and repeatable, run it, and record the current baseline numbers so future changes can be measured against it. Record the workload size, command, environment, units, and variation across repeated runs; keep setup outside the timed region. The verdict names what the benchmark measures and its baseline number.
  origin: built-in
  next: []
- key: bisect
  category: Debugging
  description: git bisect to find the offending commit
  body: Use `git bisect` to find the commit that introduced the regression. Establish a known-good and known-bad revision, script the check as a one-liner where you can so the bisect runs automatically, and identify the first bad commit. Reset the bisect state when you're done. Lead with the detail — the commit's diff and how it caused the failure. The verdict names the offending commit and the root cause it points at.
  origin: built-in
  next: []
- key: bug
  category: Debugging
  description: Root-cause the failure
  body: 'Investigate the failure I''m about to describe. Find the root cause before proposing any fix — trace the actual code path and confirm the mechanism, don''t guess or pattern-match. A plausible-but-unconfirmed cause is a hypothesis, not a diagnosis: prove it by making the bug appear and vanish on command. Once you can explain exactly why it happens, write a failing regression test, then fix the underlying cause (never the symptom) and confirm the test goes green — a fix you can''t back with that red-then-green test isn''t done. Lead with the detail — the mechanism, the fix, and why it''s the real cause. The verdict names the root cause in one sentence, plus the pass/fail counts if you ran anything.'
  origin: built-in
  next: []
- key: carve
  category: GitHub
  description: Split the proposed work into a few self-contained issues with DOD
  body: 'Don''t start coding yet. Carve the proposal in context into a few self-contained GitHub issues using `gh issue create`; created issues are the deliverable. Aim for at most three or four independently deliverable slices. For conflict-minimization, slice along file, module, or ownership boundaries with disjoint file sets. Search open and closed issues first and reuse existing work. Each issue must stand alone for an agent without this conversation: problem, intent, scope, non-goals, relevant files and constraints, and sibling and blocker links. Give each an explicit Definition of Done checklist: acceptance criteria, actual build/test/lint commands, a regression test where warranted, and required docs, snapshots, or codegen. State dependency order and which issues can run concurrently versus which must be serialized. Ask one focused question if a consequential scope or slice decision is unresolved. Report created and reused issue URLs and the concurrency and ordering plan. Work happens in each issue''s own lazybox workspace, never a named workspace beside it; don''t assume their rows opened, since visibility depends on the operator''s filters and scopes. The verdict names how many issues you created and how many you reused.'
  origin: built-in
  next: []
- key: catchup
  category: Review
  description: 'Catch up: what happened here, in a few lines'
  body: 'Bring me up to speed on this session in AT MOST 6 lines. I have been away and need to re-enter, not re-read: assume I remember the goal and nothing since. Your whole answer is the ending — there are no findings to report before it. Give me only what changed my picture: what you did, what you learned that was surprising, and what is now different about the plan. Skip the narration of steps that went as expected; a step that worked is not news. If you are blocked or need a decision from me, ask it directly and lead with the decision, never trail it. Report this catch-up, not the underlying work — needing nothing from me does not mean the work is finished. Name files and identifiers concretely rather than describing them. No preamble, no restating the task back to me, and no offer to continue — I can see the terminal. The verdict names where things stand in one sentence; this snippet changes nothing, so say so rather than reporting work.'
  origin: built-in
  next: []
- key: ci
  category: Chores
  description: Diagnose and fix failing CI
  body: CI is failing. Pull the failing job's logs (`gh run view --log-failed`), find the real cause rather than the surface error, and fix it locally. Don't write a failure off as a flake or "unrelated" without re-running to prove it — a green-on-retry is evidence, a guess is an excuse to skip the work. Re-run the equivalent check here to confirm it passes before pushing. Lead with the detail — what was actually broken and the fix. The verdict names the check and whether it is now green.
  origin: built-in
  next: []
- key: clarify
  category: Review
  description: Explain this PR in a few lines, no verbiage
  body: 'Explain this PR to me in at most five short lines — I asked for the short version, so keeping it short is the job, not a loss of evidence. Read the diff first; every claim comes from the real tree. Lead with what is true now that was not before, as the user sees it. Then, only as far as each earns a line: what was broken, the change that fixes it, the proof (the test or number that shows it), and any real risk. One concrete anchor per claim — a file, symbol, or issue number — and no bulleted tour of changed files, no restating my question, no sentence that would fit a different PR. If I need more, I will ask for `deepclarify`. This snippet changes nothing.'
  origin: built-in
  next: []
- key: clean
  category: Chores
  description: Remove dead code and unused deps
  body: Find and remove dead code, unused imports, and unused dependencies in the area I point you at. Before deleting each one, verify it's truly unreferenced — check for reflection, macros, feature gates, and dynamic dispatch that a static search misses. Confirm it still builds and tests pass, and keep the deletions in a reviewable diff. Lead with the per-item detail (what you removed and how you confirmed it's dead). The verdict names how much was cut and whether the tree is green.
  origin: built-in
  next: []
- key: commit
  category: Git & PR
  description: Commit staged changes with a good message
  body: Commit the staged changes only. Write an imperative subject (<=50 chars) and, unless the change is trivial, a body explaining the *why* rather than restating the *what*. Don't stage or commit unrelated edits — if the working tree has changes outside this change, leave them alone and say so. When done, report the commit subject and the list of files it captured. The verdict names the branch, the new commit SHA, and whether it was pushed.
  origin: built-in
  next: []
- key: conflicts
  category: Git & PR
  description: Resolve merge conflicts
  body: Resolve the current merge conflicts. For each hunk, work out what both sides intended and keep a result that honors both, not just whichever is easier to paste. Then confirm the merged result actually builds and passes tests rather than just clearing the markers. Lead with the per-file detail — which side you kept and why. The verdict names how many files conflicted, the resulting head SHA, and whether the tree is green.
  origin: built-in
  next: []
- key: convert
  category: GitHub
  description: Convert the issue into a PR
  body: 'Turn the GitHub issue this workspace is on into a PR. Read it with `gh issue view --comments`, branch off the default base with a name drawn from the issue, and implement the smallest change that fully resolves it — root cause, not symptom — with tests for the new behavior. Follow the scout rule: build only what the issue needs, and if you notice unrelated problems note them separately rather than folding them in. Run the project''s checks until green, then open the PR with `gh pr create`, its body starting with `Closes #N` so the issue collapses into it. Keep it one logical change; if the issue is really several, say so and scope this PR to the first. Lead with the detail of what you built and why it resolves the issue, including the PR URL. The verdict names the issue and PR numbers.'
  origin: built-in
  next: []
- key: cover
  category: Testing
  description: Add tests for uncovered branches
  body: Find the important untested branches in the code I just touched — error paths, edge cases, and boundary conditions first, not just the happy path. Add focused tests that would actually fail if the behavior regressed, run them to confirm they pass, and tell me which branches you deliberately left uncovered and why. Lead with the per-branch detail. The verdict names the pass/fail counts and how many branches are now covered versus deliberately skipped.
  origin: built-in
  next: []
- key: dedupe
  category: Refactor
  description: Remove duplication
  body: Unify the near-duplicate logic I point you at behind a single implementation — but only where it's genuinely the same concept, not coincidentally similar code that will diverge later. Preserve behavior exactly, update all call sites, and confirm with tests. If some copies differ in ways that matter, say so and leave them alone. Lead with the detail of what you unified and what you deliberately kept separate. The verdict names how many duplicates you unified and whether the tests still pass.
  origin: built-in
  next: []
- key: deepclarify
  category: Review
  description: 'Explain this PR in depth: problem, change, proof, risk'
  body: 'Explain this PR to me. Your whole answer is the ending — there are no findings to report before it, so the answer itself is the explanation, not a summary of one. Read the diff and run whatever you need to read it properly; every anchor below comes from the real tree, not from memory. Lead with what is true now that was not true before, in plain words, naming the user-visible consequence rather than the code. Then give, in this order and only while each earns its place: the problem — what was actually broken and who it hurt, the concrete failure rather than the category; the change — the one thing that makes it right, and how small it is, because a one-file fix to a scary-sounding bug is the most reassuring fact you have; the proof — a number, a command''s before/after, or the test that fails without it, never "added tests" with no claim; the risk — what could break, or "nothing obvious" if that is honest; and one line past those only if it changes what the reviewer does, such as a surprise found along the way, a deliberate non-goal a reader would otherwise assume was included, or CI that is not green yet. Anchor every claim — file paths, symbol names, issue numbers, real command output. "Refactored for clarity" is not a claim; "moved marker parsing out of dockerrun so sdk no longer links docker/docker (go list -deps: 24 packages -> 0)" is. Banned: restating my question, "this PR introduces/implements/ensures", "comprehensive", "robust", "various", a bulleted tour of changed files, and any sentence that would still be true of a different PR. If the diff alone does not answer it, ask for the missing piece rather than guessing. This snippet changes nothing — no commit, no push, no edit.'
  origin: built-in
  next: []
- key: deepreview
  category: Review
  description: 'Deep review: design, stress, blast radius (flagship)'
  body: |-
    Review the current diff (`git diff` against the base branch) as a skeptical senior engineer — deeper than surface bugs, in three passes, starting from the premise that there IS a problem here worth finding. Assume every finding is real until a specific, falsifiable reason refutes it, and treat a safe-looking default as the thing to disprove — "it degrades safely to the old behavior" is the exact reasoning that ships silent data loss, not a reason to wave a risk through. Pass 1, design: are the abstractions, boundaries, and ownership right; does it fit the patterns already in this codebase; is there a materially simpler shape that does the same job? Pass 2, correctness under stress, across every lens (correctness, security, performance, data loss, concurrency): trace the real code path and enumerate the edge cases, error paths, and partial-failure or bad-input scenarios that aren't handled — for each, give the concrete input or state that produces the wrong result, not a vague worry. Pass 3, blast radius: what breaks elsewhere if this is wrong, and is it reversible? In scope is everything the diff touches and everything that breaks because of it; separately, flag anything the task didn't need — opportunistic refactors, reformatting, drive-by renames, unrelated edits — as sprawl, which is a finding, not a bonus. A finding is skipped only by refuting it with a concrete failure scenario; "out of scope," "not worth the complexity," "for now," and "as a follow-up" are banned as dismissals. Lead with the full detail: findings ranked by severity, each with a `file:line` anchor, separating "will break" (has a real failure scenario) from "worth reconsidering" (a design smell) — don't pad, a weak nit dressed as a bug erodes trust. Include a completeness self-critique — what you did not examine and why skipping it is safe — and name the single highest risk you'd keep watching. The verdict names how many blockers remain.

    ARTIFACT CONTRACT (persist the findings if you can, and say so if you cannot)
    Your findings must outlive this session: a fixer may be a different agent, at a
    different strength, days later, with none of this conversation. Nothing you leave
    in the terminal reaches it.
    If you have the lazybox MCP tools, call `submit_review` when you are done, with:
    the readable report verbatim; `scope` — a label naming what you reviewed,
    `base_sha` and `head_sha` from `git rev-parse`, and — when the worktree is dirty
    — `dirty_digest`, a digest of the uncommitted diff (`git diff HEAD | shasum`);
    and one `findings` entry per finding carrying its severity, `file:line` anchors, the
    evidence that makes it real, and the remediation you suggest. Write the evidence
    for a reader who never saw this review — it is the reasoning, not a label.
    Zero findings is a complete review: submit the empty findings list rather than
    skipping the call, so a fixer can tell a clean tree from a review that never ran.
    A malformed or incomplete submission is kept as a DRAFT that no fixer will bind;
    the reply names each defect, so fix them and submit again before you finish.
    If you do NOT have those tools, they do not exist for this session: do not fake
    the call and do not stop over it. Deliver the review as prose exactly as you
    otherwise would, and add one line saying the findings were not persisted, so
    nobody assumes a later fixer can pick them up.
  origin: built-in
  next:
  - fixall
- key: deps
  category: Security
  description: Audit and update dependencies
  body: Audit the project's dependencies for known vulnerabilities and unmaintained packages using the ecosystem's audit tool. Propose safe upgrades, call out breaking changes from each changelog, and don't bump anything without checking what changed. Don't dismiss an advisory as "not exploitable here" unless you've traced that the vulnerable path is genuinely unreachable — assume it's reachable until proven dead. Lead with the per-advisory detail (severity, the fixed version, breaking changes). The verdict names how many advisories remain and what to upgrade first.
  origin: built-in
  next: []
- key: designissues
  category: GitHub
  description: Create coordinated GitHub issues from a design
  body: 'Turn the design in context into created, cross-linked GitHub issues with `gh issue create`. Read the complete design and supporting context; preserve the intended outcome, decisions, constraints, non-goals, rollout assumptions, and open questions. Inspect repository remotes, ownership, conventions, and implementation before assigning work. Search open and closed issues in every candidate repository and reuse existing work; do not create duplicates. Slice by independently deliverable outcome. Each issue must stand alone: problem and design reasoning, owning repository, scope and concrete behavior, acceptance criteria and verification, edge cases and migration concerns, dependencies and unresolved decisions. Create an umbrella or tracking issue only when coordination needs it. Replace placeholder links with actual sibling, parent, and blocker URLs after creation; state dependency and rollout order. Apply metadata only when repository conventions establish the correct values. If repositories or a consequential decision remain ambiguous, ask one focused question. Report created and reused issue URLs grouped by repository and anything blocked. Work happens in each issue''s own lazybox workspace, never a named workspace beside it; don''t assume their rows opened, since visibility depends on the operator''s filters and scopes. The verdict names how many issues you created and how many you reused.'
  origin: built-in
  next: []
- key: doc
  category: Docs
  description: Document public APIs
  body: 'Document the public APIs I touched: what each does, its parameters and return, invariants and failure modes, and a short usage example where it earns its place. Match the surrounding doc style and tooling exactly. Check examples against the actual signatures and run the documentation tests or build. Skip the trivial and self-evident — document the *why*, not the obvious *what*. The verdict names which APIs you documented.'
  origin: built-in
  next: []
- key: dod
  category: GitHub
  description: Stamp a Definition-of-Done checklist onto the draft
  body: 'Append a Definition of Done to the issue or PR you''re drafting so "done" is a checkable contract, not an assertion. Ground it in this repo''s real conventions — read how existing issues and PRs state acceptance, and what the build, test, and lint commands actually are — rather than emitting a generic template. The checklist carries: the acceptance criteria that define the change as complete; the concrete verification commands to run (build, test, lint) with their real invocations; a regression test where the change warrants one; and the docs, snapshot, or codegen updates this repo requires. Edit it onto the draft in place — `gh issue edit` / `gh pr edit`, or into the body you''re about to create — don''t just print it. Keep it tight and specific to the change at hand; drop any line that doesn''t apply rather than padding. The verdict names how many issues you stamped and their numbers.'
  origin: built-in
  next: []
- key: done
  category: Linear
  description: Move the Linear issue to Done
  body: Mark this workspace's Linear issue Done. First confirm the work is actually complete — the change is merged or its PR is approved and green, and the issue's acceptance criteria are met — then transition it to the team's completed state via the Linear tooling available to you (MCP, CLI, or API). Add a one-line closing comment linking the PR that resolved it. If any acceptance criterion is unmet, don't close it — tell me what's outstanding instead. The verdict names the issue identifier and its new state, or what is still outstanding.
  origin: built-in
  next: []
- key: estimate
  category: Linear
  description: Estimate and prioritize the Linear issue
  body: Estimate and prioritize this workspace's Linear issue. Read it fully and assess the real scope against the surrounding code — trace what actually has to change, don't guess from the title — then propose a point estimate on the team's scale plus a priority, each with a one-line justification. Call out the biggest uncertainty that could blow the estimate. Set the fields via the Linear tooling available to you if the values are clearly right, otherwise propose them for me to confirm. Say so if the issue is too vague to estimate. Lead with the detail (scope assessment, estimate, priority, justification). The verdict names the issue identifier, the estimate, the priority, and the biggest risk to it.
  origin: built-in
  next: []
- key: explain
  category: Debugging
  description: Explain this error / stack trace
  body: 'Explain the error or stack trace I''m about to paste: what it actually means, the most likely cause given *this* codebase (trace it to the real line, don''t speak in generalities), and the single concrete next step to confirm and fix it. If more than one cause is plausible, rank them and say how to tell them apart. Lead with the detailed read of the trace. The verdict names the most likely root cause and the next step to take.'
  origin: built-in
  next: []
- key: extract
  category: Refactor
  description: Extract a function / module
  body: Extract the logic I point you at into a well-named function or module with a clear signature and no hidden coupling to its old context. Update every call site, keep behavior identical, and confirm with the existing tests. Keep the diff reviewable — this is a move, not a rewrite; follow the scout rule and flag any behavior change you're tempted to make instead of quietly doing it. Lead with the detail of the new boundary and the call sites moved. The verdict names the new boundary and whether the tests still pass.
  origin: built-in
  next: []
- key: fixall
  category: Review
  description: Apply the review findings you just produced
  body: |-
    Take the review findings for this workspace — the report you bound if there is one, otherwise the review from this conversation — and *implement* them — the deliverable is a clean, tested diff, not a list. "Here are the changes I would make" is not an acceptable output; apply them. Go in severity order, highest first, and for each finding fix the *real cause* at the `file:line` it names, not the surface symptom. Default to fixing: a finding stays unfixed only when you can refute it with a specific, falsifiable reason — a concrete input or state that proves it can't happen. "Not worth the complexity," "degrades gracefully," "out of scope," "for now," and "as a follow-up" are banned as reasons to skip — they're the reflex that ships bugs, and one such "the safe default is enough" call silently deleted real user data. Treat the safe-looking default as the thing to disprove, and when you're unsure, fix it. Follow the scout rule: stay strictly in scope — fix only the findings plus anything that breaks because of your fix, and don't refactor, reformat, or clean up anything they didn't call out; if you spot an unrelated problem, note it for later instead of fixing it here. Whenever a fix changes behavior, add or adjust the test that would have caught the original problem. When you're done, re-run the build, tests, and linter to confirm the tree is green, then commit with a clear message that says what was wrong and why the change is the real fix, staging only the files you touched, and push the branch. Committing AND pushing every fix is part of the deliverable, not optional: a fix left uncommitted — or committed but unpushed — is lost the moment the worktree is cleaned up, so never end with changes stranded in the working tree. Lead with the detail — each finding, what you changed, and why it's the real cause, at its `file:line`, each finding you left with its falsifiable reason, and anything you noticed that the review missed. The verdict names how many findings you fixed and how many remain.

    ARTIFACT CONTRACT (work from the review, not from memory of it)
    If you have the lazybox MCP tools, bind a report before you change anything: do
    not work from scrollback or from a review you believe happened. Call
    `list_reviews`, passing the tree as it is now
    (`head_sha`, plus `dirty_digest` when it is dirty). Obey its `selection`:
    - `missing` — STOP. There is nothing to fix from. Say a deep review must run
      first; never start an empty fixer and never substitute your own reading.
    - `ambiguous` — name the candidate reports and ask which one to use. Do not pick
      the newest yourself.
    - `bound` — read it in full with `get_review` and work from ITS findings, at the
      anchors it names. A bound report with zero findings means the tree was clean;
      that is a result, not an error.
    When the bound report is not current — its head moved, or its worktree changed —
    revalidate each finding against the code as it is now before acting on it, and
    record one that no longer holds as `already_resolved` rather than dropping it.
    When you are done, call `submit_review_result` with the bound report id and one
    outcome per finding — `fixed`, `already_resolved`, `blocked` or `refuted` — each
    with the evidence behind it and the commits and checks that back it. Every
    finding needs one, including the ones you refute: a result that skips a finding
    is kept as a draft naming it. The original report is never modified.
    If you do NOT have those tools, this session has no artifact channel and none of
    the calls above exist for you — so do not stop over it, and do not invent them.
    Work from the review in this conversation exactly as you would have before, and
    say in your verdict that you worked from
    conversation memory rather than a bound report,
    so the difference is visible to whoever reads it.
  origin: built-in
  next: []
- key: freshen
  category: Git & PR
  description: 'Make the PR mergeable: update from main, resolve, verify, push'
  body: 'The PR won''t merge because the branch is behind `main` (GitHub reports the required checks as "expected"). Bring it fully current: update from the latest `main` — rebase for clean history, or merge if the branch is shared or already pushed widely — and resolve every conflict by understanding both sides, preserving the intent of each change rather than blindly taking one side. After resolving, re-run the build, tests, and linter to confirm the merge didn''t break anything, then push (`--force-with-lease` if you rebased) so CI re-runs and the required status checks report against an up-to-date head. Lead with the per-conflict detail — what conflicted and how you resolved each. The verdict names the branch, the resulting head SHA, whether it was pushed, and whether it is now mergeable.'
  origin: built-in
  next:
  - push
- key: goal
  category: Review
  description: What is this PR for? One or two lines
  body: 'Tell me the goal of this PR in one or two plain sentences: what it is for and who notices when it lands. Read the diff and the PR or issue text first so the goal is the real one, not a guess from the branch name. Brevity is the request here, so this is not dropping evidence: no file tour, no how, no caveats unless one changes whether I should merge it. If the diff and the text disagree about the goal, say that in one sentence instead. This snippet changes nothing. The verdict names the goal.'
  origin: built-in
  next: []
- key: handoff
  category: Git & PR
  description: Write a HANDOFF doc so the next session resumes cold
  body: 'Write a HANDOFF document capturing the current state so another agent — or a future you — can resume with zero context loss, and write it *now*, before a usage limit or crash ends this session and takes the context with it. Capture: what you were doing and why; what''s done, naming the commits and files; what''s in progress and exactly where you stopped; the next concrete steps, in order; any decisions or assumptions you made; and the open questions or blockers. Ground every line in the real state — run `git status` and `git branch --show-current` and record the current branch, staged and uncommitted changes, and how to verify the work (the build, test, and lint commands). Be specific and actionable, not a vague recap: this document is the only thing the next session will have. Open it with a short, human-readable summary — one paragraph a cold reader can skim to know exactly where things stand — then the full detail below. Write it to `HANDOFF.md` at the repo root, but don''t clobber an existing one — append a timestamped section if it''s already there — and leave it untracked rather than committing it; if you can''t write files, print the whole thing clearly instead. The verdict names the branch it describes and where the handoff was written; this snippet commits and pushes nothing.'
  origin: built-in
  next: []
- key: hotpath
  category: Review
  description: Performance review of the diff
  body: 'Review the current diff for performance regressions, not micro-nits. Walk the changed code on its hot path and look for allocations or clones added inside a loop, N+1 queries or repeated I/O, an accidental O(n²) from a nested scan, eager work that could be deferred, and blocking calls or locks added to a latency-sensitive path. Assume each added cost matters until the input scale proves it doesn''t — "probably negligible" is a claim you back with a number, not a dismissal. Lead with the detailed findings: for each, the `file:line`, the input scale at which it starts to hurt, and the concrete cost — measured or estimated, not hand-waved — ranked by impact, with a fix only where the win is real and the code stays readable. If the diff has no hot-path impact, say so plainly instead of inventing concerns. The verdict names the single biggest cost, or that there is no hot-path impact.'
  origin: built-in
  next: []
- key: leaks
  category: Security
  description: Scan for leaked secrets
  body: 'Scan the diff — and recent history if relevant — for accidentally committed secrets: API keys, tokens, private keys, passwords, connection strings. For anything found, flag it clearly with `file:line`, treat it as already compromised, and advise on rotation and scrubbing it from history. Don''t downgrade a match to "probably a test fixture or example key" unless you''ve confirmed it isn''t a live credential — assume real until proven otherwise. Don''t echo the full secret value back. Lead with the per-hit detail. The verdict names how many live-credential risks remain and the first rotation step.'
  origin: built-in
  next: []
- key: link
  category: GitHub
  description: Link this PR and the issue it closes
  body: 'Wire this PR to the issue it resolves so they track as one. Confirm which issue it closes, then make sure the PR body carries a `Closes #N` line — edit it with `gh pr edit` if it''s missing — so the issue auto-closes on merge and GitHub shows the link. For an issue in another repo use the full `Closes owner/repo#N` form. Cross-check that no other open PR already claims the same issue. The verdict names the linked issue and PR numbers.'
  origin: built-in
  next: []
- key: lint
  category: Chores
  description: Fix lint and formatting
  body: 'Run the project''s linter and formatter, then fix every warning and formatting issue in the code I touched — address the underlying cause, never suppress or `allow` it away without a clear reason. Re-run to confirm clean, and follow the scout rule: don''t drag unrelated reformatting into the diff. The verdict names how many warnings you fixed and whether the linter is clean.'
  origin: built-in
  next: []
- key: nit
  category: Review
  description: 'Nitpick pass: naming, comments, style'
  body: 'Do a nitpick pass over the current diff: naming, comment quality, dead code, inconsistent style, and anything that would slow a reviewer down. Keep every suggestion small, mechanical, and behavior-preserving, each with a `file:line` anchor. This is polish only — if you spot an actual correctness or design problem, flag it separately and loudly rather than downgrading it to a nit to keep the pass tidy; a real bug filed as style is how it survives review. Lead with the detailed list of nits in reading order. The verdict names how many nits you found and whether any real issue surfaced above the nit line; a nit is not a blocker. If the diff is already clean, say so instead of inventing nits to look busy.'
  origin: built-in
  next: []
- key: nudge
  category: GitHub
  description: Request or nudge reviewers
  body: Get this PR the review it needs. Check its state with `gh pr view` — is it a draft, are checks green, does it already have reviewers? If it's ready and unreviewed, request the right people with `gh pr edit --add-reviewer`, preferring the code owners or recent authors of the touched files. If review was already requested and has gone stale, draft a short, specific nudge comment naming what changed since they last looked and what you need from them. Don't nudge while CI is red or the PR is still a draft — say so instead. The verdict names the PR number and whom you requested, or why you held off.
  origin: built-in
  next: []
- key: perf
  category: Performance
  description: Profile and optimize the hot path
  body: Profile the hot path I describe and find where the time *actually* goes — measure, don't assume. Optimize the biggest win first, confirm the improvement with a before/after measurement, and stop when the gains stop mattering. Don't trade correctness or readability for micro-gains, and keep the existing tests green. Lead with the detail — the profile, the change, and the before/after numbers. The verdict names the measured speedup and what is now the bottleneck.
  origin: built-in
  next: []
- key: pr
  category: Git & PR
  description: Open a PR (summary + test plan)
  body: Open a PR for the current branch with `gh pr create`. Push first if the branch isn't up to date, then write a concise, specific title and a body with a `## Summary` section (1-3 bullets on *why*, not a diff recap) and a `## Test plan` checklist of what you actually verified. Base all of it on the real commits and diff, not a guess — read them before you write a word. When it's open, report the PR URL and what it ships. The verdict names the branch, the PR number, and that the branch was pushed.
  origin: built-in
  next: []
- key: push
  category: Git & PR
  description: Push the branch (force-with-lease after a rewrite)
  body: Push the current branch to its remote. If its history was rewritten — after a rebase, amend, or squash — push with `--force-with-lease` so you overwrite only your own commits and never clobber work someone else pushed; never use a bare `--force`, and don't run a fresh `git fetch` of this branch's own upstream right before the push or the lease check can't protect you. Otherwise a plain `git push` (add `-u` to set the upstream on the first push). If `--force-with-lease` is rejected because the remote moved, stop and tell me what changed rather than escalating to `--force`. The verdict names the branch, the pushed SHA, and whether it is now in sync with the remote.
  origin: built-in
  next: []
- key: readme
  category: Docs
  description: Update the README
  body: Update the README to reflect the change I just made — usage, flags, examples, and anything now stale or wrong. Verify each command or example actually works rather than assuming, keep it accurate and concise, and don't rewrite sections that are still correct. The verdict names what you updated and what you verified by running it.
  origin: built-in
  next: []
- key: ready
  category: Git & PR
  description: Mark the PR ready for review
  body: 'Mark the current pull request as ready for review with `gh pr ready`. First confirm it actually is ready: the diff is clean, tests and CI pass, and the description matches what changed. If anything''s off, tell me what and stop instead of flipping it. When you do flip it, verify the PR URL and isDraft with `gh pr view --json url,isDraft`; report the resulting state. If already ready, report that without changing it. The verdict names the PR number and its resulting draft state; this snippet pushes nothing.'
  origin: built-in
  next: []
- key: rebase
  category: Git & PR
  description: Rebase onto the latest main
  body: 'Rebase this branch onto the latest `main` (or whatever base it targets). Fetch just main first (`git fetch origin main`) — leaving your branch''s own remote-tracking ref untouched so the `--force-with-lease` below still guards it — then rebase onto `origin/main`, replaying cleanly and resolving any conflicts conservatively: preserve the intent of both sides, never drop a change just to clear markers, and flag anything ambiguous for me. When it''s done, confirm the branch still builds and tests pass, then push the rewritten history with `--force-with-lease` (never a bare `--force`). The verdict names the branch, how many commits replayed, the resulting head SHA, and whether it was pushed.'
  origin: built-in
  next: []
- key: refac
  category: Refactor
  description: Refactor for clarity, no behavior change
  body: 'Refactor the code I point you at for clarity and simplicity with no behavior change. Keep the diff small and reviewable — one coherent transformation, not a rewrite. Prove behavior is unchanged by running the existing tests before and after; if coverage there is thin, add a characterization test first. Follow the scout rule: don''t fix bugs or change APIs along the way — flag those separately instead of folding them in. Lead with the detail of what you changed and why it''s behavior-preserving. The verdict names what you restructured and whether the tests match before and after.'
  origin: built-in
  next: []
- key: release
  category: GitHub
  description: Cut a release PR
  body: Cut a release PR from the current state. Determine the next version from the commits since the last tag (`git log <last-tag>..HEAD`) and the project's versioning scheme, bump the version files, and assemble a changelog grouped by feat / fix / chore with the notable user-facing changes — not a raw commit dump. Confirm the build and tests are green first, then open the PR with `gh pr create` targeting the release base, titled for the version, with the changelog as the body. Flag any breaking change prominently. Don't tag or publish — the PR is the deliverable. The verdict names the version, the PR number, and any breaking change.
  origin: built-in
  next: []
- key: rename
  category: Refactor
  description: Rename a symbol across the repo
  body: Rename the symbol I specify consistently across the whole repo — code, tests, docs, and comments. Lean on the compiler or language tooling to catch call sites rather than a blind find-replace, verify nothing unrelated matched the same string, and confirm it still builds and tests pass. No behavior change beyond the rename. The verdict names how many call sites moved and whether the tree is green.
  origin: built-in
  next: []
- key: repro
  category: Testing
  description: Write a failing test that reproduces the bug
  body: Write a minimal automated test that reproduces the bug I'm about to describe. Trace the real code path first so the test exercises the actual failure, then confirm it fails on the current code for the same reason the bug occurs — that red test is the regression guard. Don't fix the bug yet; just prove it with a failing test. Lead with the failure output. The verdict names the pass/fail counts and why the failure is exactly the bug.
  origin: built-in
  next: []
- key: respond
  category: GitHub
  description: Address the PR review comments
  body: Address the unresolved review comments on this PR. Pull them with `gh pr view --comments` plus the inline review threads, and for each one either make the change the reviewer asked for or, if you disagree, reply with the concrete reason rather than silently skipping it. Fix the real cause, not just the flagged line, and add or adjust a test whenever the change alters behavior. Re-run the relevant checks, push, and post a short reply on each thread saying what you did so the reviewer can resolve it. Don't mark anything resolved you didn't actually handle. Lead with the per-comment detail — what each asked and what you did. The verdict names the PR number, how many threads you addressed, how many you pushed back on, and whether CI is green.
  origin: built-in
  next: []
- key: resume
  category: Git & PR
  description: Resume an in-progress rebase through conflicts
  body: A rebase is in progress and has stopped on a conflict. For each conflicted file, work out what both the replayed commit and the upstream changes intended and keep a result that honors both — don't blindly take one side just to clear the markers. Stage the resolved files, run `git rebase --continue`, and repeat for each commit the rebase stops on until it finishes. If it reaches a state you can't safely resolve, run `git rebase --abort` and tell me rather than forcing a bad merge. When it completes, confirm the tree builds and tests pass, then push with `--force-with-lease`. The verdict names the branch, which commits conflicted, the resulting head SHA, and whether it was pushed.
  origin: built-in
  next: []
- key: rev
  category: Review
  description: Review the current diff
  body: 'Review the current diff (`git diff` against the base branch) as a rigorous, adversarial code review — assume there IS a bug and your job is to find it, not to confirm the code is fine. Read adversarially across every lens that applies: correctness (logic errors, off-by-one, missing error handling, broken edge cases), security (untrusted input crossing a trust boundary), data loss, resource leaks, and concurrency. Treat each changed line as guilty until you can trace why it''s safe, and treat a safe-looking default — an early return, a fallback, a delete-on-missing — as a footgun to disprove, not a comfort. In scope is everything the diff touches *and* everything that breaks because of it; scope is not an escape hatch. A finding is dismissed only by refuting it with a specific, falsifiable failure scenario that proves it can''t happen; "out of scope," "not worth the complexity," "degrades gracefully," and "should be fine" are banned as dismissals. Lead with the full detail — every finding ranked by severity, each with a `file:line` anchor and the concrete input or state that triggers the wrong result, a real failure and not a vague worry, with no shallow nit dressed up as a bug. Look only at the changed lines and the code they directly touch, not the whole file. Include a completeness check — what you did not examine and why skipping it is safe. If a traced line is genuinely clean, say so plainly rather than inventing nits. The verdict names how many blockers remain.'
  origin: built-in
  next:
  - fixall
- key: scout
  category: Review
  description: 'Scout rule: flag and trim out-of-scope changes'
  body: 'Scope-check the current diff (`git diff` against the base branch) against the one thing this change is meant to do — this is the scout rule made explicit. Go hunk by hunk and flag every edit the task didn''t require — opportunistic refactors, drive-by renames, reformatting, unrelated cleanups, speculative abstractions, leftover debug code or stray TODOs — each with a `file:line` anchor and one line on why it doesn''t belong. Then trim them: revert the out-of-scope hunks so the diff carries only what the task needs, and confirm the build and tests still pass afterward. Keep anything that''s genuinely load-bearing even if it looks unrelated — say why you kept it rather than reverting it blindly. Lead with the detailed hunk-by-hunk list (flagged / trimmed / kept-with-reason). The verdict names how many hunks you trimmed, what the diff is now scoped to, and whether the tree is green. If the diff is already tight, say so plainly instead of inventing trims.'
  origin: built-in
  next: []
- key: sec
  category: Security
  description: Security review of the diff
  body: 'Review the current diff for security issues: injection, missing authz/authn checks, unsafe deserialization, path traversal, secret handling, SSRF, and unchecked input crossing a trust boundary. Review adversarially: assume there IS an exploitable hole, every input is hostile, and every check is bypassable until you trace why it isn''t, and don''t retire a finding as "probably not exploitable," "out of scope," or "degrades gracefully" without the specific reason the exploit fails. Lead with the full detail: for each finding the `file:line`, the concrete exploit path — the literal input that crosses the boundary — and the fix, ranked by exploitability. The verdict names how many exploitable holes remain and the most exploitable one. If the diff introduces no security-relevant change, say so rather than padding the list.'
  origin: built-in
  next: []
- key: selfrev
  category: Review
  description: Self-review before pushing
  body: Self-review this branch as a skeptical reviewer seeing it for the first time — assume it's not ready until you've tried to break it, not the reverse. Read the full diff against the base branch, then walk it adversarially and call out anything that isn't obviously correct, any missing or weak tests, any leftover debug code or stray TODOs, any change that's out of scope for this branch's purpose (drive-by refactors, reformatting, unrelated edits), and anything you'd be asked to change in review. For each correctness item give the concrete input or state that breaks it, not a hunch, with a `file:line` anchor. Lead with the full detailed list, ordered so I can fix top-down before pushing. Call it ready only after you've genuinely tried and failed to find a problem — then say so. The verdict names how many must-fix items remain before pushing.
  origin: built-in
  next: []
- key: squash
  category: Git & PR
  description: Squash the branch into clean commits
  body: Squash this branch's commits into a small number of logically coherent commits with clear messages. Group by concept, not by chronology, and don't collapse genuinely independent changes into one. The final tree must be identical to the current one — verify with `git diff` before and after and show me it comes back empty. The verdict names the branch, the new commit list, the resulting head SHA, and whether it was pushed.
  origin: built-in
  next: []
- key: status
  category: Linear
  description: Comment a status update back to Linear
  body: Post a concise status update as a comment on this workspace's Linear issue. Ground it in the real state of the branch and PR, not a guess. Keep it to a few human-readable lines a teammate can skim — what's done, what's in progress, and any blocker or decision you need — link the PR if one exists, and post it with the Linear tooling available to you (MCP, CLI, or API). Confirm the comment landed; if you can't reach Linear, show me the update text instead. The verdict names the issue identifier and whether the update posted; this snippet creates nothing.
  origin: built-in
  next: []
- key: subissues
  category: Linear
  description: Break the Linear issue into sub-issues
  body: Break this workspace's Linear issue into well-scoped sub-issues. Read the parent with its comments, then decompose the work into independently shippable pieces — each with a clear title and a one-line deliverable — without slicing so thin that the overhead outweighs the work. Create them as children of the parent under the same team via the Linear tooling available to you, preserving the link to the parent. If the issue is already small enough to do in one pass, say so instead of splitting it. The verdict names how many sub-issues you created and their identifiers.
  origin: built-in
  next: []
- key: sync
  category: Git & PR
  description: Update the branch from main (merge, no rewrite)
  body: Bring this branch up to date with the latest `main` by *merging*, not rebasing — use this when the branch is already pushed or shared and you'd rather not rewrite history. Fetch main first (`git fetch origin main`), merge `origin/main` in, and resolve any conflicts by honoring the intent of both sides (never drop a change just to clear markers), flagging anything ambiguous for me. Confirm the branch builds and tests pass afterward. Since this doesn't rewrite history, a plain `git push` is enough — no force needed. If you'd rather keep a linear history and the branch is unshared, rebase onto `origin/main` instead of merging. The verdict names the branch, what merged, the resulting head SHA, and whether it was pushed.
  origin: built-in
  next: []
- key: tdd
  category: Testing
  description: 'TDD: failing test first, then implement'
  body: Work test-first. Write a failing test that captures the desired behavior, run it, and confirm it fails for the *right* reason (not a typo or missing import). Then implement the minimal change to make it pass, re-run to confirm green, and refactor with the test as your guard. Show me the failing test before the implementation. The verdict names the pass/fail counts and the behavior the test now locks in.
  origin: built-in
  next: []
- key: test
  category: Testing
  description: Run the test suite and fix failures
  body: Run the project's test suite. If anything fails, fix the root cause in the code — not the test, and not by loosening an assertion — then re-run until green. "The test is flaky" or "it's testing the wrong thing" is a claim you prove with a specific reason before you weaken or delete it, never a quick way out of a real failure. If a test is genuinely wrong, say so explicitly and explain before you touch it. Lead with the per-failure detail — what failed, why, and what you changed. The verdict names passed, fixed, and still-failing counts, and says which checks you did not run rather than implying they passed.
  origin: built-in
  next: []
- key: trace
  category: Debugging
  description: Add logging to narrow it down
  body: Add targeted logging around the suspect code path to narrow where behavior diverges from expectation — log the inputs, the branch taken, and the key values at each step, not everything. Run it and read what it reveals. Keep the instrumentation easy to remove once we've found it. Lead with the captured trace detail. The verdict names the root cause — where reality first diverged from expectation — and the next place to look.
  origin: built-in
  next: []
- key: triage
  category: GitHub
  description: Triage the issue into a plan
  body: 'Triage the GitHub issue this workspace is on. Read the body and every comment with `gh issue view --comments`, restate the problem in one line, and confirm it''s real and still relevant. If it''s a bug, reproduce it — trace the actual code path rather than trusting the report — then break the work into an ordered, checkable plan: the root change, the tests that prove it, and any follow-ups worth splitting out. Raise anything under-specified or out of scope as a question back on the issue instead of guessing. Don''t start coding yet — deliver the plan first. Lead with the detail (restated problem, reproduction, the ordered plan). The verdict names the issue number, what it''ll take, and the single biggest unknown.'
  origin: built-in
  next: []
- key: whyci
  category: GitHub
  description: Summarize why CI is failing
  body: Summarize why CI is failing on this PR. List the failing checks with `gh pr checks`, pull each failed job's log with `gh run view --log-failed`, and for every distinct failure give the check name, the real cause (not just the last red line), and the `file:line` or step it points at. Separate genuine code failures from flakes and infra errors. Don't fix anything yet; this is the diagnosis. Lead with the per-failure detail. The verdict names how many checks are failing and which failure to fix first; this snippet changes nothing, so say so rather than reporting work.
  origin: built-in
  next: []
- key: wip
  category: Linear
  description: Move the Linear issue to In Progress
  body: Move this workspace's Linear issue to In Progress to signal you've started. Use the Linear tooling available to you (MCP, CLI, or API) to set the workflow state — states are team-specific, so the started state may be named differently; pick the one that fits. Confirm the transition actually applied. If you can't reach Linear from here, say so plainly instead of assuming it worked. The verdict names the issue identifier and its new state.
  origin: built-in
  next: []
