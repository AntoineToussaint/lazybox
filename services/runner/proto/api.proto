  string author = 14;
}
message SearchItemsRequest {
  // github; empty searches every connected provider.
  string provider = 1;
  // Free text. owner/name#123 or an item's URL finds that one item.
  string query = 2;
  // mine (assigned to you and not done, the default), recent or all.
  string scope = 3;
  // A previous page's next; empty for the first page.
  string cursor = 4;
}
message ItemPage {
  repeated Item items = 1;
  // The cursor of the next page; empty on the last one.
