<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reminders</title>
<link rel="stylesheet" href="_lazybox/lazybox.css">
<script src="_lazybox/lazybox.js"></script><script src="app.js" defer></script>
</head>
<body class="workflow">
<header><h1>Reminders</h1></header>
<section class="workflow-form">
<label>What should you check? <input id="message" required maxlength="240"></label>
<label>Remind me <select id="delay"><option value="15">in 15 minutes</option><option value="60">in an hour</option><option value="1440">in 24 hours</option><option value="tomorrow">tomorrow at 9 AM</option><option value="monday">next Monday at 9 AM</option><option value="custom">at a specific time</option></select></label>
<input id="when" type="datetime-local" aria-label="Local date and time" hidden>
<button class="primary" id="save" type="button">Set reminder</button>
</section>
<p role="status" id="status"></p><h2>Scheduled</h2><p id="empty" class="muted" hidden>No reminders scheduled.</p><ul id="scheduled"></ul>
</body></html>
