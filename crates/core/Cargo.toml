[package]
name = "lazybox-core"
description = "Source-agnostic domain types for lazybox: Task, Session, Activity, SessionKey."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
# The store persists Workspace as JSON; the strict persisted-blob
# decoder (`Workspace::decode_persisted`) lives next to the schema
# version it enforces, so the JSON codec is a real dependency here.
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
bincode = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
