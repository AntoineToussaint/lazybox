  string id = 1;
  string path = 2;
  string name = 3;
  string source_url = 4;
  int64 github_id = 5;
  string git_identity = 6;
  // The person's home checkout, when it has one: a regular checkout outside
  // every workspace. "" when none.
  string home_path = 7;
  // configured (chosen in Settings) or source (the folder the repository was
  // registered from, which is already the person's own checkout).
  string home_kind = 8;
}
