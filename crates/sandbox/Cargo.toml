[package]
name = "lazybox-sandbox"
description = "Provider-agnostic remote dev-box lifecycle (start/stop/connect) for lazybox; GCP first."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Box lifecycle providers live behind a feature so the crate builds
# standalone and later providers (azure) land as their own gate.
default = ["gcp"]
gcp = []

[dependencies]
lazybox-core = { workspace = true }
lazybox-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
