# Repo-local snippet library for lazybox itself.
#
# Snippets are keystroke shortcuts: inside a terminal pane, press `]`
# then a key to expand the prompt below and auto-send it to the active
# agent. Type to filter; a unique match fires instantly (so `]rev`
# sends the review prompt in three keystrokes).
#
# This file is checked in, so everyone working on lazybox shares the same
# starter set. Add your own personal ones in `~/.lazybox/snippets.yaml`
# (repo-local entries win on key conflict).
snippets:
  rev:
    description: Deep review with clear verdict
    body: |
      Deep review of the current diff. At the top, give a **clear verdict in 30 seconds**:

      🟢 **All good** — ship as-is
      🟡 **Minor issues** — fix these nits, then ship (list them)
      🔴 **Critical findings** — do NOT ship (list blockers)
      ❓ **Unclear** — need more context (ask what)

      Then detailed findings with file:line references. Focus on correctness bugs,
      performance issues, and safety violations. Skip style nits unless critical.

  pr:
    description: Create PR with title, summary, test plan
    body: |
      Create a PR for the current branch with `gh pr create`.

      Title: concise one-liner (under 70 chars), what it does not why
      Body: start with ## Summary (1-3 bullets on the why/impact)
      Then ## Test plan (checklist of what you tested)

      Arm auto-merge (--squash) if appropriate for the change type.
      If the branch is ready to land immediately, enable auto-merge.

  test:
    description: Run tests, fix all failures
    body: |
      Run `cargo test --workspace` and fix ALL failures.

      Strategy: fix in order of impact (compilation errors > unit test fails > integration flakes).
      For flaky tests, add regression tests to prevent recurrence.

      Report: "Tests: X passed, fixed Y failures (list them). All tests green."
      If any failures remain, explain why they're deferred and what's next.

  deepreview:
    description: Comprehensive deep code review
    body: |
      Comprehensive code review of the current diff. Report:

      **Verdict (top, 30 seconds):**
      🟢 All good — ship | 🟡 Minor nits — fix then ship | 🔴 Blockers — do not ship | ❓ Need context

      **Findings (detailed, with file:line):**
      - Correctness issues (logic bugs, unsafe patterns, type errors)
      - Performance problems (hot-path inefficiency, unnecessary allocations, lock contention)
      - Safety violations (unwrap in library code, unvalidated input, race conditions)
      - Architecture concerns (backwards compatibility, API stability, design debt)

      **What to skip:** style, naming, trivial refactors (unless blocking ship).

  fixall:
    description: Fix all issues in current branch
    body: |
      Fix ALL issues in the current branch. Strategy:

      1. Review the full diff
      2. Fix every bug, anti-pattern, and issue you find
      3. Default: FIX. Only skip if explicitly out-of-scope (e.g., unrelated file, depends on pending PR)
      4. In doubt: ask for guidance instead of skipping
      5. Bias proactive — if it's broken, fix it

      Report at top: "Fixed: X (list critical fixes). Deferred: Y (reason). All tests pass."

      Don't leave TODOs or "future work" — ship it fixed, or ask if it's truly out-of-scope.
