}
message PullRequestSummary {
  int64 number = 1; string title = 2; string url = 3;
  // open, closed or merged.
  string state = 4; bool draft = 5;
  // success, failure, pending, none, or incomplete (as PullRequestStatus).
  string checks_state = 6;
  // approved, changes_requested, review_required, or empty.
  string review_decision = 7;
  int64 observed_at_unix_millis = 8;
}
message RepositoryGitSummary {
  string member = 1;
  // Empty on a detached HEAD.
  string branch = 2; string head = 3;
  // origin/<branch> when the branch was pushed, else empty. ahead and behind
  // count commits against it; a never-pushed branch counts its commits since
  // the workspace started as ahead.
  string upstream = 4; uint32 ahead = 5; uint32 behind = 6;
  // origin/HEAD (else main or master), and commits ahead of and behind it.
  string default_branch = 7; uint32 ahead_of_default = 8; uint32 behind_default = 9;
  // Uncommitted files: staged, unstaged and untracked.
  uint32 dirty = 10; bool dirty_truncated = 11;
  // owner/name when origin is a GitHub repository.
  string github_repository = 12;
  // Absent when no pull request is known for the branch (yet).
  PullRequestSummary pull_request = 13;
  string error = 14;
  // What the branch changes, when the request asked for it and it could be counted.
  LineChanges changes = 15;
}
// What a branch changes against where it forked from the default branch (else
// against the commit the workspace started from), uncommitted work included:
// what its pull request would show, and what is not committed yet.
message LineChanges {
  // The default branch compared with ("origin/main"); empty when it is the workspace's start.
  string base = 1;
  // Files changed, untracked ones included.
  uint32 files = 2;
  // Lines added and deleted in tracked text files; an untracked file's lines are not counted.
  uint32 additions = 3;
  uint32 deletions = 4;
  // Too many changes to list in full: the counts are a floor.
  bool truncated = 5;
}
message WorkspaceGitSummary { string collection_id = 1; repeated RepositoryGitSummary repositories = 2; }
message WorkspaceGitSummaries { repeated WorkspaceGitSummary workspaces = 1; }
message ListLinksRequest {
  // One workspace's links.
  string collection_id = 1;
  // An agent's own execution (`lazybox items`): the Runner derives its workspace.
